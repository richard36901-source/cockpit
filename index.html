// ── Trading Calendar ────────────────────────────────
function renderTradingSection(pageKey, y, m) {
  const pm = getPM(pageKey);
  const nav = `<div class="month-nav"><button class="mnav-btn" onclick="navMonth(-1)">‹</button><span class="mnav-label">${MNAMES[m]} ${y}</span><button class="mnav-btn" onclick="navMonth(1)">›</button></div>`;
  return nav + renderTradingCalendar(pageKey, y, m);
}
function renderTradingCalendar(pageKey, y, m) {
  const DAYS = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  const firstDay = new Date(y, m, 1).getDay();
  const mondayOff = (firstDay + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();

  // Collect trade data
  let totalPnl = 0, winDays = 0, lossDays = 0, bestDay = 0, worstDay = 0, tradeDays = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `cockpit.trade.${y}.${m}.${d}`;
    const stored = safe.get(key);
    if (stored !== null) {
      const pnl = parseFloat(stored);
      if (!isNaN(pnl) && pnl !== 0) {
        totalPnl += pnl; tradeDays++;
        if (pnl > 0) { winDays++; if (pnl > bestDay) bestDay = pnl; }
        if (pnl < 0) { lossDays++; if (pnl < worstDay) worstDay = pnl; }
      }
    }
  }
  const winRate = tradeDays > 0 ? Math.round((winDays / tradeDays) * 100) : 0;

  let html = `<div class="section-h"><span><span class="num">01</span>Trade Calendar</span><div class="line"></div><span class="meta">${MNAMES[m].toUpperCase()} ${y}</span></div>`;
  html += `<div class="trade-cal-wrap"><div class="trade-cal">`;
  DAYS.forEach(d => html += `<div class="cal-hdr">${d}</div>`);
  for (let i = 0; i < mondayOff; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const dow = date.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isFuture = date > today;
    const isToday = date.toDateString() === today.toDateString();
    const pnlKey = `cockpit.trade.${y}.${m}.${d}`;
    const stored = safe.get(pnlKey);
    const pnl = stored !== null ? parseFloat(stored) : null;

    let cls = 'cal-day';
    if (isFuture) cls += ' future';
    else if (isWeekend) cls += ' weekend';
    else if (pnl === null) { cls += ' no-trade clickable'; }
    else if (pnl > 0) cls += ' profit clickable';
    else if (pnl < 0) cls += ' loss clickable';
    else cls += ' breakeven clickable';
    if (isToday) cls += ' today';

    const pnlStr = pnl !== null && pnl !== 0 ? (pnl > 0 ? '+' : '') + pnl : '';
    const click = (!isFuture && !isWeekend) ? `onclick="editTrade(${y},${m},${d})"` : '';

    html += `<div class="${cls}" ${click}><span class="cal-dn">${d}</span>${pnlStr ? `<span class="cal-pnl">${pnlStr}</span>` : ''}</div>`;
  }

  html += `</div></div>`;
  html += `<div class="trade-stats">
    <div class="ts-card"><div class="ts-num ${totalPnl>=0?'good':'bad'}">${totalPnl>=0?'+':''}${fmt(totalPnl)}<span style="font-size:0.5em;margin-left:2px;color:var(--text-3)">₪</span></div><div class="ts-label">Net P&L</div></div>
    <div class="ts-card"><div class="ts-num">${winRate}<span style="font-size:0.6em;color:var(--text-3)">%</span></div><div class="ts-label">Win Rate</div></div>
    <div class="ts-card"><div class="ts-num good">${bestDay>0?'+'+bestDay:'-'}</div><div class="ts-label">Best Day</div></div>
    <div class="ts-card"><div class="ts-num bad">${worstDay<0?worstDay:'-'}</div><div class="ts-label">Worst Day</div></div>
  </div>`;
  return html;
}

window.editTrade = async function(y, m, d) {
  const key = `cockpit.trade.${y}.${m}.${d}`;
  const cur = safe.get(key) || '';
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const r = await openModal({ title:`${d} ${MONTHS[m]} ${y} — Trade`, icon:'📊',
    fields:[
      {id:'pnl',   label:'P&L (₪) — use negative for loss', type:'number', placeholder:'0', value:cur, step:'0.01'},
      {id:'notes', label:'Notes (optional)', placeholder:'NQ long, FOMC day…', value:''}
    ],
    deleteLabel: cur ? 'No trade (clear)' : null
  });
  if (r.action==='cancel') return;
  const date = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (r.action==='delete') {
    safe.del(key);
    sbDelete('cockpit_trade_days', `trade_date=eq.${date}`);
  } else {
    const n = parseFloat(r.values.pnl);
    if (!isNaN(n)) {
      safe.set(key, n);
      sbUpsert('cockpit_trade_days', { trade_date:date, pnl:n, notes:r.values.notes||'' });
    }
  }
  renderPage(safe.get('cockpit.page') || 'trading');
};

function renderHoldings(data, pageKey) {
  const rate = data.usdToIls || 3.7;
  const toIls = (amt, cur) => cur === 'USD' ? amt * rate : cur === 'EUR' ? amt * rate * 1.08 : amt;

  let cryptoTotal = 0, stockTotal = 0, cashTotal = 0;
  data.crypto.forEach(c => { cryptoTotal += c.amount * c.price * (c.currency==='USD'?rate:1); });
  data.stocks.forEach(s => { stockTotal  += s.shares * s.price * (s.currency==='USD'?rate:1); });
  data.cash.forEach(c   => { cashTotal   += toIls(c.amount, c.currency); });
  const total = cryptoTotal + stockTotal + cashTotal;

  let html = `
    <div class="port-total">
      <div class="net-num">${fmt(Math.round(total))}<span class="cur">₪</span></div>
      <div class="pt-pills">
        <div class="pt-pill"><div class="pt-pill-label">Crypto</div><div class="pt-pill-val" style="color:var(--warn)">${fmt(Math.round(cryptoTotal))}₪</div></div>
        <div class="pt-pill"><div class="pt-pill-label">Stocks</div><div class="pt-pill-val" style="color:var(--tech)">${fmt(Math.round(stockTotal))}₪</div></div>
        <div class="pt-pill"><div class="pt-pill-label">Cash</div><div class="pt-pill-val" style="color:var(--good)">${fmt(Math.round(cashTotal))}₪</div></div>
      </div>
    </div>
    <div class="hld-sections">`;

  // Crypto
  html += `<div class="hld-block"><div class="hld-head"><div class="hld-title">Crypto</div><div class="hld-htotal">${fmt(Math.round(cryptoTotal))}₪</div></div>
    <table class="hld-table"><tr><th>Asset</th><th>Amount</th><th>Price ($)</th><th>Value (₪)</th><th>24h</th></tr>`;
  data.crypto.forEach((c,i) => {
    const val = Math.round(c.amount * c.price * rate);
    const ch = c.change;
    html += `<tr><td><div class="hld-sym">${c.symbol}</div><div style="font-size:10px;color:var(--text-3)">${c.name}</div></td>
      <td>${c.amount}</td><td>$${fmt(c.price)}</td><td>${fmt(val)}₪</td>
      <td class="hld-change ${ch>=0?'pos':'neg'}">${ch>=0?'+':''}${ch}%</td></tr>`;
  });
  html += `</table><button class="hld-add" onclick="addHolding('crypto')">+ Add crypto</button></div>`;

  // Stocks
  html += `<div class="hld-block"><div class="hld-head"><div class="hld-title">Stocks</div><div class="hld-htotal">${fmt(Math.round(stockTotal))}₪</div></div>
    <table class="hld-table"><tr><th>Ticker</th><th>Shares</th><th>Price ($)</th><th>Value (₪)</th><th>1d</th></tr>`;
  data.stocks.forEach(s => {
    const val = Math.round(s.shares * s.price * rate);
    html += `<tr><td><div class="hld-sym">${s.symbol}</div><div style="font-size:10px;color:var(--text-3)">${s.name}</div></td>
      <td>${s.shares}</td><td>$${fmt(s.price)}</td><td>${fmt(val)}₪</td>
      <td class="hld-change ${s.change>=0?'pos':'neg'}">${s.change>=0?'+':''}${s.change}%</td></tr>`;
  });
  html += `</table><button class="hld-add" onclick="addHolding('stock')">+ Add stock</button></div>`;

  // Cash
  html += `<div class="hld-block"><div class="hld-head"><div class="hld-title">Cash</div><div class="hld-htotal">${fmt(Math.round(cashTotal))}₪</div></div>
    <table class="hld-table"><tr><th>Currency</th><th>Amount</th><th>Rate</th><th>Value (₪)</th></tr>`;
  data.cash.forEach(c => {
    const r = c.currency==='ILS'?1 : c.currency==='USD'?rate : rate*1.08;
    html += `<tr><td class="hld-sym">${c.currency}</td><td>${fmt(c.amount)}</td><td>${c.currency==='ILS'?'1.00':r.toFixed(2)}</td><td>${fmt(Math.round(c.amount*r))}₪</td></tr>`;
  });
  html += `</table><button class="hld-add" onclick="addHolding('cash')">+ Add currency</button></div></div>`;
  return html;
}

window.addHolding = async function(type, existingId) {
  const isCrypto = type==='crypto', isStock = type==='stock', isCash = type==='cash';
  const existing = existingId ? [...PAGES.holdings.data.crypto,...PAGES.holdings.data.stocks,...PAGES.holdings.data.cash].find(x=>(x.id||x.symbol)===existingId) : null;
  const iconMap = {crypto:'₿', stock:'📈', cash:'💵'};
  const fieldDefs = isCash ?
    [{id:'currency',label:'Currency',type:'select',options:['ILS','USD','EUR','GBP','THB','AUD'],value:existing?.currency||'USD'},
     {id:'amount',label:'Amount',type:'number',placeholder:'1000',value:existing?.amount||''}] :
    [{id:'symbol',label:'Symbol',placeholder:isCrypto?'BTC':'AAPL',value:existing?.symbol||''},
     {id:'name',label:'Name',placeholder:isCrypto?'Bitcoin':'Apple Inc.',value:existing?.name||''},
     {id:'amount',label:isCrypto?'Quantity':'Shares',type:'number',placeholder:'0.1',value:existing?.amount||existing?.shares||''},
     {id:'price_usd',label:'Price (USD)',type:'number',placeholder:'95000',value:existing?.price||''},
     {id:'change_pct',label:'24h Change (%)',type:'number',placeholder:'0',value:existing?.change||'',step:'0.01'}];
  const r = await openModal({title:`${existingId?'Edit':'Add'} ${type}`, icon:iconMap[type], saveLabel:existingId?'Update':'Add',
    deleteLabel:existingId?'Delete':null,
    fields: fieldDefs
  });
  if (r.action==='cancel') return;
  if (r.action==='delete' && existingId) {
    PAGES.holdings.data.crypto = PAGES.holdings.data.crypto.filter(x=>x.id!==existingId);
    PAGES.holdings.data.stocks = PAGES.holdings.data.stocks.filter(x=>x.id!==existingId);
    PAGES.holdings.data.cash   = PAGES.holdings.data.cash.filter(x=>x.id!==existingId);
    sbDelete('cockpit_holdings', `id=eq.${existingId}`);
    return renderPage('holdings');
  }
  const v = r.values;
  let row = null;
  if (isCrypto) {
    const obj = {id:existingId,symbol:(v.symbol||'').toUpperCase(),name:v.name||v.symbol,amount:+v.amount,price:+v.price_usd,change:+v.change_pct,currency:'USD'};
    existingId ? (PAGES.holdings.data.crypto = PAGES.holdings.data.crypto.map(x=>x.id===existingId?obj:x)) : PAGES.holdings.data.crypto.push(obj);
    row = {asset_type:'crypto',symbol:obj.symbol,name:obj.name,amount:obj.amount,price_usd:obj.price,change_pct:obj.change,currency:'USD',sort_order:99};
  } else if (isStock) {
    const obj = {id:existingId,symbol:(v.symbol||'').toUpperCase(),name:v.name||v.symbol,shares:+v.amount,price:+v.price_usd,change:+v.change_pct,currency:'USD'};
    existingId ? (PAGES.holdings.data.stocks = PAGES.holdings.data.stocks.map(x=>x.id===existingId?obj:x)) : PAGES.holdings.data.stocks.push(obj);
    row = {asset_type:'stock',symbol:obj.symbol,name:obj.name,amount:obj.shares,price_usd:obj.price,change_pct:obj.change,currency:'USD',sort_order:99};
  } else {
    const obj = {id:existingId,currency:v.currency,amount:+v.amount};
    existingId ? (PAGES.holdings.data.cash = PAGES.holdings.data.cash.map(x=>x.id===existingId?obj:x)) : PAGES.holdings.data.cash.push(obj);
    row = {asset_type:'cash',symbol:v.currency,name:v.currency+' Cash',amount:+v.amount,price_usd:1,change_pct:0,currency:v.currency,sort_order:99};
  }
  if (existingId && row) { fetch(`${SUPA_URL}/rest/v1/cockpit_holdings?id=eq.${existingId}`,{method:'PATCH',headers:SUPA_HDR,body:JSON.stringify(row)}).catch(()=>{}); }
  else if (row) sbUpsert('cockpit_holdings', row);
  renderPage('holdings');
};

// ── Signal Bar ──────────────────────────────────────
function renderSignalBar(pageKey, y, m, data) {
  const income  = getMField(pageKey, y, m, 'income',   data.money?.month?.income  || 0);
  const expense = getMField(pageKey, y, m, 'expense',  data.money?.month?.expense || 0);
  const delayed = getMField(pageKey, y, m, 'delayed',  data.money?.month?.delayed || 0);
  const expected= getMField(pageKey, y, m, 'expected', data.money?.month?.expected|| 0);
  const net = income - expense;
  const hasPrev = y > 2024 || m > 0;
  let prevY = y, prevM = m - 1;
  if (prevM < 0) { prevM = 11; prevY--; }
  const prevIncome = getMField(pageKey, prevY, prevM, 'income', 0);
  const momPct = prevIncome > 0 ? Math.round(((income - prevIncome) / prevIncome) * 100) : null;

  const revCls  = income >= 5000 ? 'good' : income >= 2000 ? 'warn' : income > 0 ? 'bad' : 'muted';
  const delayCls = delayed === 0 ? 'good' : delayed < 3000 ? 'warn' : 'bad';
  const netCls   = net > 0 ? 'good' : net > -500 ? 'warn' : 'bad';
  const expCls   = expected > 0 ? 'warn' : 'muted';

  const momStr = momPct !== null ? ` ${momPct >= 0 ? '▲' : '▼'}${Math.abs(momPct)}% MoM` : '';

  return `<div class="signal-bar">
    <div class="signal ${revCls}"><div class="sig-dot"></div>${fmtK(income)}₪ in${momStr}</div>
    <span class="signal-sep">·</span>
    <div class="signal ${netCls}"><div class="sig-dot"></div>Net ${net >= 0 ? '+' : ''}${fmtK(net)}₪</div>
    <span class="signal-sep">·</span>
    <div class="signal ${delayCls}"><div class="sig-dot"></div>${delayed > 0 ? fmtK(delayed)+'₪ unpaid' : 'No delays'}</div>
    ${expected > 0 ? `<span class="signal-sep">·</span><div class="signal ${expCls}"><div class="sig-dot"></div>${fmtK(expected)}₪ expected</div>` : ''}
  </div>`;
}

// ── Checklist helpers ────────────────────────────────
function loadChecklist(key, defaults) {
  const stored = safe.get('cockpit.cl.'+key);
  if (stored) { try { return JSON.parse(stored); } catch {} }
  return defaults.map(x => ({...x}));
}
function saveChecklist(key, list) { safe.set('cockpit.cl.'+key, JSON.stringify(list)); }

function renderChecklist(key, defaults, pageKey) {
  const list = loadChecklist(key, defaults);
  let html = `<div class="checklist" id="cl-${key}">`;
  list.forEach((it, i) => {
    html += `<div class="cl-item ${it.done?'done-item':''}">
      <div class="cl-check ${it.done?'done':''}" onclick="toggleCL('${key}',${i},'${pageKey}')"></div>
      <div class="cl-text">${it.text}</div>
      <button class="cl-del" onclick="deleteCL('${key}',${i},'${pageKey}')">×</button>
    </div>`;
  });
  html += `<div class="cl-add-row">
    <input class="cl-add-input" id="cl-inp-${key}" placeholder="Add item…" onkeydown="if(event.key==='Enter')addCL('${key}','${pageKey}')">
    <button class="cl-add-btn" onclick="addCL('${key}','${pageKey}')">Add</button>
  </div></div>`;
  return html;
}

window.toggleCL = function(key, idx, page) {
  const list = loadChecklist(key, []);
  if (list[idx]) list[idx].done = !list[idx].done;
  saveChecklist(key, list);
  const item = list[idx];
  if (item) sbUpsert('cockpit_checklists', { list_key: key, item_id: item.id, text: item.text, done: item.done, sort_order: idx });
  renderPage(page);
};
window.deleteCL = function(key, idx, page) {
  const list = loadChecklist(key, []);
  const item = list[idx];
  list.splice(idx, 1);
  saveChecklist(key, list);
  if (item) sbDelete('cockpit_checklists', `list_key=eq.${key}&item_id=eq.${item.id}`);
  renderPage(page);
};
window.addCL = function(key, page) {
  const inp = document.getElementById('cl-inp-'+key);
  if (!inp || !inp.value.trim()) return;
  const list = loadChecklist(key, []);
  const item = {id:'cl-'+Date.now(), text:inp.value.trim(), done:false};
  list.push(item);
  saveChecklist(key, list);
  sbUpsert('cockpit_checklists', { list_key: key, item_id: item.id, text: item.text, done: false, sort_order: list.length-1 });
  renderPage(page);
};

  const html = `

        <div class="build-stat-num" style="color:var(--text-1)">${daysElapsed || '—'}</div>

      <div style="padding:10px 4px">${renderChecklist('bike-checklist', [{id:'b-1',text:'Source frame',done:false},{id:'b-2',text:'Engine rebuild',done:false},{id:'b-3',text:'Wiring',done:false},{id:'b-4',text:'Paint & finish',done:false},{id:'b-5',text:'Registration',done:false}], 'bike-build')}</div>
    </div>`;
  return html;
}

// ── Health ──────────────────────────────────────────
function svgRing(score, color, size) {
  const r = (size/2) - 8, cx = size/2, cy = size/2, sw = 10;
  const circ = 2 * Math.PI * r;
  const dash = Math.min(Math.max(score,0),100) / 100 * circ;
  const off = circ * 0.25;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2236" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
  </svg>`;
}

  const sleepQ = hv('sleep.quality', 0);
  const deepPct = hv('sleep.deep', 0);
  const remPct  = hv('sleep.rem', 0);
  const lightPct = Math.max(0, 100 - deepPct - remPct);

  const cal   = hv('cal', 0);
  const calT  = hv('calTarget', 2200);
  const prot  = hv('protein', 0);
  const protT = hv('proteinTarget', 170);
  const carb  = hv('carbs', 0);
  const carbT = hv('carbTarget', 220);
  const fat   = hv('fat', 0);
  const fatT  = hv('fatTarget', 70);

  const last7 = [];
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);

  const hsave = (k, v) => `safe.set('${hk(k)}',this.value);renderPage('health')`;
  const hrow = (label, key, def, unit) => `<div class="health-input-row">
    <span class="health-input-label">${label}</span>

  const todayDk = `${today.getFullYear()}.${today.getMonth()}.${today.getDate()}`;

  let html = `<div class="health-grid">

          </div>
        </div>
        <div class="sleep-details">

          <div class="sleep-detail-row"><span class="sleep-detail-label">REM</span><span class="sleep-detail-val" style="color:#38bdf8">${remPct}%</span></div>
          <div class="sleep-detail-row"><span class="sleep-detail-label">Light</span><span class="sleep-detail-val" style="color:#64748b">${lightPct}%</span></div>
        </div>
      </div>
      <div class="sleep-stages">
        <div class="stage-bar">
          <div class="stage-seg" style="flex:${deepPct||5};background:#a5b4fc"></div>
          <div class="stage-seg" style="flex:${remPct||5};background:#38bdf8"></div>
          <div class="stage-seg" style="flex:${lightPct||90};background:#334155"></div>
        </div>
        <div class="stage-legend">
          <div class="stage-item"><div class="stage-dot" style="background:#a5b4fc"></div>Deep</div>

        </div>
      </div>
      <div class="health-7days" style="margin-top:14px">
        <div class="h7-label">Last 7 nights</div>
        <div class="h7-bars">
          ${last7.map(d => { const h = d.h/maxH*100; const c = d.h>=7?'var(--good)':d.h>=6?'var(--warn)':d.h>0?'var(--bad)':'var(--bg-elev)'; return `<div class="h7-bar" style="height:${Math.max(h,4)}%;background:${c}" title="${d.h}h"></div>`; }).join('')}

function macroRing(label, cur, target, color, unit) {
  const pct = target > 0 ? Math.min(Math.round((cur/target)*100), 100) : 0;
  const r = 34, cx = 44, cy = 44, sw = 8, size = 88;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  const off = circ * 0.25;
  return `<div class="macro-item">
    <div class="macro-ring">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2236" stroke-width="${sw}"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
        <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700" font-family="Inter,sans-serif">${cur}</text>
        <text x="${cx}" y="${cy+9}" text-anchor="middle" fill="#64748b" font-size="7.5" font-family="JetBrains Mono,monospace">${unit}</text>
      </svg>
    </div>
    <div class="macro-label">${label}</div>
    <div style="font-size:9px;color:${color};font-family:var(--mono)">${pct}% · /${target}${unit}</div>
  </div>`;
}

      <div class="src-meta">this month</div>
    </div>

      <div class="src-label">RE Cash Flow</div>
      <div class="src-num" style="color:var(--good)">${fmtK(F.reCashflow)}<span class="cur">₪</span></div>

      <div class="att-detail">Crypto + stocks</div>

      <div class="att-num">${fmtK(F.reValue)}<span class="cur">₪</span></div>
      <div class="att-label">Real Estate</div>
      <div class="att-detail">${(PAGES['real-estate']?.data?.properties||[]).length} properties</div>
    </div>
    <div class="att tech" onclick="navigate('angel')" style="cursor:pointer">
      <div class="att-num">${fmtK(F.angelPaper)}<span class="cur">₪</span></div>
      <div class="att-label">Angel</div>
      <div class="att-detail">Paper value</div>
    </div>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:9px;font-size:12px">
    <span style="color:var(--text-3);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em">Other assets (manual):</span>
    <span class="editable" data-edit-key="fin.manualAssets" data-edit-num="${+getEdited('fin.manualAssets',0)}" style="font-size:14px;font-weight:700;color:var(--cyan)">${fmt(+getEdited('fin.manualAssets',0))}</span><span style="color:var(--text-3);font-size:11px">₪</span>
  </div>`;

    <div class="accounts-grid">`;

    html += `<div class="acct-row" onclick="addAccount('${a.id}')" style="cursor:pointer">
      <div class="acct-cell"><div class="acct-cell-label">Bank</div><div class="acct-cell-val">${a.bank}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Balance</div><div class="acct-cell-val">${renderEditable(`fin.acct.${a.id}.balance`,a.balance,{cur:'₪'})}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Savings</div><div class="acct-cell-val good">${renderEditable(`fin.acct.${a.id}.savings`,a.savings,{cur:'₪'})}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Credit</div><div class="acct-cell-val cyan">${renderEditable(`fin.acct.${a.id}.creditLine`,a.creditLine,{cur:'₪'})}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Card</div><div class="acct-cell-val">${renderEditable(`fin.acct.${a.id}.cardLimit`,a.cardLimit,{cur:'₪'})}</div></div>
    </div>`;
  });

  // DEBT

  F.debts.forEach(d => {
    const balance = +getEdited(`fin.debt.${d.id}.balance`,d.balance);
    const paidPct = d.originalBalance>0 ? Math.round(((d.originalBalance-balance)/d.originalBalance)*100) : 0;
    const yrsLeft = Math.round(d.monthsRemaining/12*10)/10;
    html += `<div class="debt-row" onclick="addDebt('${d.id}')" style="cursor:pointer">
      <div class="debt-top">
        <div class="debt-name">${d.name}</div>
        ${d.property?`<div class="debt-tag">${d.property}</div>`:''}
      </div>
      <div class="debt-nums">
        <div class="debt-num-item"><div class="debt-num-label">Remaining</div><div class="debt-num-val bad">${renderEditable(`fin.debt.${d.id}.balance`,d.balance,{cur:'₪'})}</div></div>
        <div class="debt-num-item"><div class="debt-num-label">Monthly</div><div class="debt-num-val">${fmt(d.monthly)}₪</div></div>
        <div class="debt-num-item"><div class="debt-num-label">Rate</div><div class="debt-num-val">${d.ratePercent}%</div></div>
        <div class="debt-num-item"><div class="debt-num-label">Left</div><div class="debt-num-val">${yrsLeft}yr</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="debt-timeline" style="flex:1"><div class="debt-paid" style="width:${paidPct}%"></div></div>
        <span style="font-size:10px;color:var(--good);font-family:var(--mono)">${paidPct}% paid</span>
      </div>
    </div>`;
  });
  html += `<button class="acct-add-btn" onclick="addDebt()">+ Add debt / loan</button></div>`;

  // RECURRING
  html += `<div class="section-h"><span><span class="num">05</span>Recurring</span><div class="line"></div><span class="meta">NET ${F.monthlyNet>=0?'+':''}${fmtK(F.monthlyNet)}₪/MO</span></div>
  <div class="recur-grid">

    </div>`;
  });
  html += `<button class="recur-add" onclick="addRecur('expense')">+ Add recurring expense</button></div>
  </div>`;

  // PROJECTION CHART
  const projData = [];
  const now2 = new Date();
  let bal = currentSav;
  for (let i = 0; i < 13; i++) {
    const d = new Date(now2.getFullYear(), now2.getMonth()+i, 1);
    projData.push({ month: d.getMonth(), balance: Math.round(bal) });
    bal += F.monthlyNet;
  }
  const maxPV = Math.max(...projData.map(p=>p.balance), target, 1);
  const minPV = Math.min(...projData.map(p=>p.balance), 0);
  const rangeV = maxPV - minPV || 1;
  const W2=540,H2=110,pL=55,pR=12,pT=14,pB=22;
  const cW=W2-pL-pR,cH=H2-pT-pB;
  const toX2=i=>pL+(i/(projData.length-1))*cW;
  const toY2=v=>pT+cH-((v-minPV)/rangeV)*cH;
  const pts2=projData.map((d,i)=>`${toX2(i).toFixed(1)},${toY2(d.balance).toFixed(1)}`).join(' ');
  const tY2=toY2(target);
  let pSvg=`<svg viewBox="0 0 ${W2} ${H2}" width="100%" style="display:block">`;
  [0,.25,.5,.75,1].forEach(t=>{const y2=pT+t*cH;const v=Math.round(maxPV-t*rangeV);pSvg+=`<line x1="${pL}" y1="${y2.toFixed(1)}" x2="${W2-pR}" y2="${y2.toFixed(1)}" stroke="#0f1626" stroke-width="1"/>`;pSvg+=`<text x="${pL-3}" y="${(y2+3.5).toFixed(1)}" text-anchor="end" fill="#64748b" font-size="8" font-family="JetBrains Mono,monospace">${fmtK(v)}₪</text>`;});
  if(target>minPV&&target<maxPV){pSvg+=`<line x1="${pL}" y1="${tY2.toFixed(1)}" x2="${W2-pR}" y2="${tY2.toFixed(1)}" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 3"/>`;pSvg+=`<text x="${W2-pR+3}" y="${(tY2+3.5).toFixed(1)}" fill="#fbbf24" font-size="7.5" font-family="JetBrains Mono,monospace">30k</text>`;}
  pSvg+=`<polygon points="${pL},${pT+cH} ${pts2} ${(W2-pR).toFixed(1)},${pT+cH}" fill="rgba(56,189,248,0.07)" stroke="none"/>`;
  pSvg+=`<polyline points="${pts2}" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  projData.forEach((d,i)=>{if(i%4===0||i===projData.length-1){pSvg+=`<circle cx="${toX2(i).toFixed(1)}" cy="${toY2(d.balance).toFixed(1)}" r="3" fill="#38bdf8"/>`;pSvg+=`<text x="${toX2(i).toFixed(1)}" y="${H2-4}" text-anchor="middle" fill="#64748b" font-size="8" font-family="JetBrains Mono,monospace">${MSHORT[d.month]}</text>`;}});
  pSvg+=`</svg>`;

  html += `<div class="section-h"><span><span class="num">06</span>12-Month Projection</span><div class="line"></div><span class="meta">NET ${F.monthlyNet>=0?'+':''}${fmtK(F.monthlyNet)}₪/MO</span></div>
  <div class="proj-chart-wrap">
    <div class="proj-chart-head">
      <div class="proj-chart-title">Savings Trajectory</div>
      <div class="proj-legend">
        <div class="proj-legend-item"><div class="proj-legend-line" style="background:#38bdf8"></div>Balance</div>
        <div class="proj-legend-item"><div class="proj-legend-line" style="border-top:2px dashed #fbbf24"></div>30k target</div>
      </div>
    </div>
    ${pSvg}
    <div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap">
      <span style="font-size:10px;color:var(--text-3);font-family:var(--mono)">Savings base:</span>
      <span class="editable" data-edit-key="fin.currentSavings" data-edit-num="${currentSav}" style="font-size:12px;font-weight:600;color:var(--cyan)">${fmt(currentSav)}</span>
      <span style="font-size:10px;color:var(--text-3);font-family:var(--mono)">₪ · Hit target in ~${F.monthlyNet>0?Math.max(0,Math.ceil((target-currentSav)/F.monthlyNet)):'∞'} months</span>
      <button onclick="AUTH.changePassword()" style="margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--text-3);border-radius:6px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:var(--mono)">🔑 Change password</button>
    </div>
  </div>`;

  return html;
}

// ── Notification Badges ──────────────────────────
function computeBadges() {
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth();
  const badges = {};
  const delayed = getMField('autoscale',y,m,'delayed',0);
  if (delayed > 0 && now.getDate() > 7) badges['autoscale'] = {count:1, type:'bad', tip:`${fmtK(delayed)}₪ delayed`};
  let tradePnl=0;
  for(let d=1;d<=31;d++){const v=safe.get(`cockpit.trade.${y}.${m}.${d}`);if(v)tradePnl+=parseFloat(v)||0;}
  if (tradePnl < -500) badges['trading'] = {count:1, type:'warn', tip:`${fmtK(tradePnl)}₪ P&L`};
  const skillsPage = PAGES['skills']?.data?.skills||[];
  const stalledSkills = skillsPage.filter(s=>s.pct===0).length;
  if (stalledSkills > 0) badges['skills'] = {count:stalledSkills, type:'info', tip:`${stalledSkills} skills at 0%`};
  return badges;
}
function updateBadges() {
  const badges = computeBadges();
  document.querySelectorAll('.nav-item').forEach(el => {
    const page = el.dataset.page;
    el.querySelector('.nav-badge')?.remove();
    if (badges[page]) {
      const b = document.createElement('span');
      b.className = `nav-badge ${badges[page].type}`;
      b.textContent = badges[page].count;
      b.title = badges[page].tip;
      el.appendChild(b);
    }
  });
}

// ── Relocation ETA ───────────────────────────────
function computeRelocationETA() {
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth();
  const currentSav = +getEdited('fin.currentSavings', 8000);
  const target = 30000; const mrrTarget = 6000;
  const F = computeFinancials();
  const bizIncome = getMField('autoscale', y, m, 'income', 7500);
  let prevY=y, prevM=m-1; if(prevM<0){prevM=11;prevY--;}
  const prevIncome = getMField('autoscale', prevY, prevM, 'income', 0);
  const mrrGrowth = bizIncome - prevIncome;
  const moToSav = F.monthlyNet>0 ? Math.max(0,Math.ceil((target-currentSav)/F.monthlyNet)) : 999;
  const moToMrr = bizIncome>=mrrTarget ? 0 : (mrrGrowth>0 ? Math.ceil((mrrTarget-bizIncome)/mrrGrowth) : 999);
  const moToGo  = Math.max(moToSav, moToMrr);
  const constraint = moToSav >= moToMrr ? 'savings' : 'MRR';
  const savPct = Math.min(Math.round((currentSav/target)*100),100);
  const mrrPct = Math.min(Math.round((bizIncome/mrrTarget)*100),100);
  return { moToGo, moToSav, moToMrr, constraint, savPct, mrrPct, currentSav, target, bizIncome, mrrTarget };
}
function renderRelocationETA() {
  const E = computeRelocationETA();
  const etaLabel = E.moToGo>=999?'∞':E.moToGo<=0?'🚀 Ready!':E.moToGo+' months';
  const etaColor = E.moToGo<=6?'var(--good)':E.moToGo<=18?'var(--warn)':'var(--bad)';
  const constraintNote = E.moToGo<=0?'Both targets hit!': `${E.constraint}: ${E.constraint==='savings'?fmtK(E.currentSav)+'/30k₪':fmtK(E.bizIncome)+'/6k₪'}`;
  return `<div class="relocation-eta">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div><div class="eta-headline" style="color:${etaColor}">${etaLabel}</div><div class="eta-sub">to Thailand at current pace · ${constraintNote}</div></div>
      <div class="signal ${E.moToGo<=12?'good':E.moToGo<=24?'warn':'bad'}"><div class="sig-dot"></div>${E.moToGo<=0?'Ready to go!':'On track'}</div>
    </div>
    <div class="eta-bars">
      <div class="eta-bar-item"><div class="eta-bar-label"><span>Savings</span><span style="color:var(--text-1)">${fmtK(E.currentSav)} / 30k₪</span></div><div class="eta-bar-track"><div class="eta-bar-fill" style="width:${E.savPct}%;background:${E.savPct>=100?'var(--good)':'var(--cyan)'}"></div></div></div>
      <div class="eta-bar-item"><div class="eta-bar-label"><span>MRR</span><span style="color:var(--text-1)">${fmtK(E.bizIncome)} / 6k₪</span></div><div class="eta-bar-track"><div class="eta-bar-fill" style="width:${E.mrrPct}%;background:${E.mrrPct>=100?'var(--good)':'var(--tech)'}"></div></div></div>
    </div>
  </div>`;
}

let _pipeline = [];

function renderPipeline(pageKey) {
  const leads = _pipeline;
  const wonVal = leads.filter(l=>l.stage==='won').reduce((s,l)=>s+l.expected_value,0);
  const pipeVal = leads.filter(l=>l.stage!=='won'&&l.stage!=='lost').reduce((s,l)=>s+l.expected_value,0);
  const wonN = leads.filter(l=>l.stage==='won').length;
  const closedN = leads.filter(l=>l.stage==='won'||l.stage==='lost').length;
  const conv = closedN>0?Math.round((wonN/closedN)*100):0;
  let html = `<div class="section-h"><span><span class="num">05</span>Pipeline</span><div class="line"></div><span class="meta">OPEN ${fmtK(pipeVal)}₪ · WON ${fmtK(wonVal)}₪ · CONV ${conv}%</span></div>
    <div class="pipeline-board">`;
  STAGES.forEach(stage => {
    const sl = leads.filter(l=>l.stage===stage);
    const sv = sl.reduce((s,l)=>s+l.expected_value,0);
    html += `<div class="pipeline-col ${stage}"><div class="pipeline-col-head"><div class="pipeline-col-title" style="color:${STAGE_COLORS[stage]}">${stage}</div><div class="pipeline-col-count">${sl.length}${sv>0?' · '+fmtK(sv)+'₪':''}</div></div>`;

    html += `</div>`;
  });
  html += `</div><button class="acct-add-btn" onclick="editLead(null,'${pageKey}')">+ Add lead</button>`;
  return html;

// ── Trading Journal ──────────────────────────────
let _trades = [];
function renderTradingJournal(pageKey, y, m) {
  const monthStr=`${y}-${String(m+1).padStart(2,'0')}`;
  const mt=_trades.filter(t=>t.trade_date?.startsWith(monthStr)).sort((a,b)=>a.trade_date.localeCompare(b.trade_date));
  const wins=mt.filter(t=>t.pnl>0), losses=mt.filter(t=>t.pnl<0);
  const wr=mt.length>0?Math.round((wins.length/mt.length)*100):0;
  const avgW=wins.length>0?Math.round(wins.reduce((s,t)=>s+t.pnl,0)/wins.length):0;
  const avgL=losses.length>0?Math.round(losses.reduce((s,t)=>s+t.pnl,0)/losses.length):0;
  const avgR=mt.length>0?(mt.reduce((s,t)=>s+(t.risk_amount?t.pnl/t.risk_amount:0),0)/mt.length).toFixed(2):'—';
  const INSTR_COLORS={NQ:'var(--cyan)',ES:'var(--tech)',MNQ:'var(--cap)',MES:'var(--good)',YM:'var(--warn)',OTHER:'var(--text-2)'};
  let html=`<div class="section-h"><span><span class="num">02</span>Trade Journal</span><div class="line"></div><span class="meta">${mt.length} TRADES · ${wr}% WIN</span></div>
  <div class="trade-stats-row" style="margin-bottom:12px">
    <div class="ts-card"><div class="ts-num">${mt.length}</div><div class="ts-label">Trades</div></div>
    <div class="ts-card"><div class="ts-num ${wr>=50?'good':'bad'}">${wr}%</div><div class="ts-label">Win Rate</div></div>
    <div class="ts-card"><div class="ts-num good">${avgW>0?'+'+avgW+'₪':'—'}</div><div class="ts-label">Avg Winner</div></div>
    <div class="ts-card"><div class="ts-num">${avgR}R</div><div class="ts-label">Avg R</div></div>
  </div>
  <div class="trade-log"><div class="trade-log-head"><div class="trade-log-title">Trade Log — ${MNAMES[m]} ${y}</div>
    <button class="ap-add" onclick="editTradeEntry(null,'${y}-${String(m+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}')">+ Log trade</button></div>`;
  if(!mt.length) html+=`<div style="text-align:center;padding:24px;color:var(--text-3);font-size:12px;font-family:var(--mono)">No trades logged — click + Log trade</div>`;
  else {
    html+=`<table class="trade-table"><tr><th>Date</th><th>Instr.</th><th>Dir</th><th>Entry</th><th>Exit</th><th>P&L</th><th>R</th><th>Notes</th></tr>`;
    mt.forEach(t=>{
      const r2=t.risk_amount&&t.risk_amount>0?(t.pnl/t.risk_amount).toFixed(1):'—';
      html+=`<tr onclick="editTradeEntry('${t.id}','${t.trade_date}')">
        <td>${t.trade_date?.slice(8)||'?'}</td>
        <td style="color:${INSTR_COLORS[t.instrument]||'var(--text-2)'}">● ${t.instrument}</td>
        <td class="trade-dir-${t.direction}">${t.direction==='long'?'▲':'▼'} ${t.direction}</td>
        <td>${t.entry_price||'—'}</td><td>${t.exit_price||'—'}</td>
        <td class="trade-pnl ${t.pnl>=0?'pos':'neg'}">${t.pnl>=0?'+':''}${fmt(t.pnl)}₪</td>
        <td style="color:${r2>0?'var(--good)':r2<0?'var(--bad)':'var(--text-3)'}">${r2!=='—'?r2+'R':r2}</td>
        <td style="color:var(--text-3);font-size:10px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.notes||''}</td>
      </tr>`;
    });
    html+=`</table>`;
  }
  html+=`</div>`;
  return html;
}
window.editTradeEntry = async function(id, defaultDate) {
  const t = id?_trades.find(x=>x.id===id):null;
  const r = await openModal({title:id?'Edit Trade':'Log Trade', icon:'📊', saveLabel:id?'Update':'Save', deleteLabel:id?'Delete':null,
    fields:[
      {id:'date',       label:'Date',              type:'date',   value:t?.trade_date||defaultDate||new Date().toISOString().split('T')[0]},
      {id:'instrument', label:'Instrument',         type:'select', options:['NQ','ES','MNQ','MES','YM','RTY','CL','GC','OTHER'], value:t?.instrument||'NQ'},
      {id:'direction',  label:'Direction',          type:'select', options:['long','short'], value:t?.direction||'long'},
      {id:'entry',      label:'Entry Price',        type:'number', placeholder:'21050', value:t?.entry_price||'', step:'0.25'},
      {id:'exit',       label:'Exit Price',         type:'number', placeholder:'21120', value:t?.exit_price||'', step:'0.25'},
      {id:'size',       label:'Contracts',          type:'number', placeholder:'1',     value:t?.size||1},

      {id:'notes',      label:'Notes',              type:'textarea',value:t?.notes||'',rows:2},

  if(r.action==='cancel') return;
  const d=t?.trade_date||defaultDate||'';
  if(r.action==='delete'&&id){ _trades=_trades.filter(x=>x.id!==id); sbDelete('cockpit_trades',`id=eq.${id}`);
    const dTrades=_trades.filter(x=>x.trade_date===d); const dPnl=dTrades.reduce((s,x)=>s+x.pnl,0);
    const dd=new Date(d); safe.set(`cockpit.trade.${dd.getFullYear()}.${dd.getMonth()}.${dd.getDate()}`,dPnl);

  if(id){ _trades=_trades.map(x=>x.id===id?{...row,id}:x); fetch(`${SUPA_URL}/rest/v1/cockpit_trades?id=eq.${id}`,{method:'PATCH',headers:SUPA_HDR,body:JSON.stringify(row)}).catch(()=>{}); }
  else { _trades.push({...row,id:'tmp-'+Date.now()}); sbUpsert('cockpit_trades',row); }
  const dd=new Date(v.date); const dt=_trades.filter(x=>x.trade_date===v.date); const dp=dt.reduce((s,x)=>s+x.pnl,0);

};

// ── Editables ────────────────────────────────────────
function wireEditables() {
  mainEl.querySelectorAll('.editable').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (el.classList.contains('editing')) return;
      startEdit(el);
    });
  });
}

function startEdit(el) {
  const key = el.dataset.editKey;
  const orig = el.dataset.editNum;
  const cur = el.querySelector('.cur');
  const curHtml = cur ? cur.outerHTML : '';
  el.classList.add('editing');
  el.innerHTML = `<input type="text" value="${orig}" style="width:${Math.max(el.offsetWidth-24,50)}px;background:transparent;border:none;outline:none;color:var(--cyan);font:inherit;font-weight:inherit;letter-spacing:inherit">${curHtml}`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();

  function commit() {
    const raw = inp.value.replace(/[, ]/g,'').trim();
    const num = raw === '' ? '0' : raw;
    setEdited(key, num);
    el.classList.remove('editing');
    renderPage(safe.get('cockpit.page') || 'autoscale');
  }
  function cancel() {
    el.classList.remove('editing');
    el.innerHTML = fmt(orig) + curHtml;
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter')  { ev.preventDefault(); inp.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
  });
}

// ── Nav wiring ───────────────────────────────────────
function wireNav() {
  document.querySelectorAll('.side-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const which = tab.dataset.tab;
      document.querySelectorAll('.side-tab').forEach(t => t.classList.toggle('active', t===tab));
      document.querySelectorAll('.nav-pane').forEach(p => { p.style.display = p.dataset.pane===which ? '' : 'none'; });
      safe.set('cockpit.tab', which);
      const first = document.querySelector(`.nav-pane[data-pane="${which}"] .nav-item`);
      if (first) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); first.classList.add('active'); renderPage(first.dataset.page); }
    });
  });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      renderPage(item.dataset.page);
    });
  });

  document.querySelectorAll('.folder').forEach(f => {
    f.addEventListener('click', () => f.classList.toggle('collapsed'));
  });
}

// ── Clock ────────────────────────────────────────────
function pad(n) { return n.toString().padStart(2,'0'); }
function tick() {
  const now = new Date();
  document.getElementById('clock-time').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock-date').textContent = days[now.getDay()]+' · '+pad(now.getDate())+' '+months[now.getMonth()];
}
tick();
setInterval(tick, 30000);

// ── Init ─────────────────────────────────────────────
wireNav();

async function bootApp() {
  // Render from cache first (instant)
  const savedTab  = safe.get('cockpit.tab') || 'work';
  const savedPage = safe.get('cockpit.page') || 'autoscale';
  const startEl = document.querySelector(`.nav-item[data-page="${savedPage}"]`);
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  if (startEl) { startEl.classList.add('active'); renderPage(savedPage); }
  else renderPage('autoscale');
  if (savedTab !== 'work') document.querySelector(`.side-tab[data-tab="${savedTab}"]`)?.click();
  // Then hydrate from Supabase
  await loadAllData();
  renderPage(safe.get('cockpit.page') || 'autoscale');
  updateBadges();
}

// Start auth first, then boot
AUTH.init().then(() => bootApp());

if ('serviceWorker' in navigator) {
