<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cockpit</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app:    #0a0f1c;
  --bg-deeper: #060912;
  --bg-card:   #111827;
  --bg-elev:   #1a2236;
  --bg-input:  #0f1626;
  --line:      rgba(255,255,255,0.06);
  --line-2:    rgba(255,255,255,0.10);
  --line-3:    rgba(255,255,255,0.14);
  --cyan:      #38bdf8;
  --cyan-soft: #38bdf820;
  --cyan-mid:  #38bdf840;
  --cyan-glow: rgba(56,189,248,0.35);
  --cyan-deep: #0284c7;
  --good:  #4ade80;
  --warn:  #fbbf24;
  --bad:   #f87171;
  --tech:  #a5b4fc;
  --tech-bg: rgba(165,180,252,0.08);
  --cap:   #6ee7b7;
  --cap-bg: rgba(110,231,183,0.08);
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --text-4: #334155;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  /* iPad 11" landscape: 1194×834. Main area = 1194-160-240 = 794px */
  --sidebar-w: 160px;
  --rail-w: 240px;
  --hero-num:  clamp(28px,3.2vw,60px);
  --kpi-num:   clamp(18px,1.6vw,30px);
  --money-num: clamp(15px,1.3vw,24px);
  --proj-name: clamp(12px,0.9vw,14px);
  --touch: 44px; /* minimum touch target */
  --safe-top:    env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
  --safe-left:   env(safe-area-inset-left,0px);
  --safe-right:  env(safe-area-inset-right,0px);
}
  --line-3:    rgba(255,255,255,0.14);
  --cyan:      #38bdf8;
  --cyan-soft: #38bdf820;
  --cyan-mid:  #38bdf840;
  --cyan-glow: rgba(56,189,248,0.35);
  --cyan-deep: #0284c7;
  --good:  #4ade80;
  --warn:  #fbbf24;
  --bad:   #f87171;
  --tech:  #a5b4fc;
  --tech-bg: rgba(165,180,252,0.08);
  --cap:   #6ee7b7;
  --cap-bg: rgba(110,231,183,0.08);
  --sec:   #fdba74;
  --nfp:   #fcd34d;
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --text-4: #334155;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --hero-num:  clamp(32px,4vw,72px);
  --kpi-num:   clamp(18px,1.6vw,32px);
  --money-num: clamp(16px,1.4vw,28px);
  --proj-name: clamp(12px,0.9vw,15px);
  --safe-top:    env(safe-area-inset-top,0px);
  --safe-bottom: env(safe-area-inset-bottom,0px);
  --safe-left:   env(safe-area-inset-left,0px);
  --safe-right:  env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-app);color:var(--text-1);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;font-feature-settings:"tnum" 1,"ss01" 1;letter-spacing:-0.005em}
@supports(padding:max(0px)){body{padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 0% 0%,rgba(56,189,248,0.06) 0%,transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(56,189,248,0.03) 0%,transparent 50%);pointer-events:none;z-index:0}

/* ── APP SHELL ── */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr var(--rail-w);grid-template-rows:52px 1fr;grid-template-areas:"side topbar topbar" "side main rail";min-height:100vh}

/* ── SIDEBAR ── */
.side{grid-area:side;background:var(--bg-deeper);border-right:1px solid var(--line);padding:12px 9px max(12px,var(--safe-bottom)) max(9px,var(--safe-left));display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:8px;padding:0 6px;margin-bottom:14px}
.logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--cyan) 0%,var(--cyan-deep) 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px var(--cyan-glow);flex-shrink:0}
.logo-mark::after{content:"";width:10px;height:10px;border:1.5px solid var(--bg-deeper);border-radius:50%}
.logo-text{font-size:13px;font-weight:700;letter-spacing:0.06em;color:var(--text-1)}
.logo-text small{display:block;font-size:8px;font-weight:400;color:var(--text-3);letter-spacing:0.18em;margin-top:1px}
.side-tabs{display:flex;gap:2px;background:var(--bg-app);border:1px solid var(--line);border-radius:7px;padding:2px;margin-bottom:12px}
.side-tab{flex:1;height:26px;border:none;background:transparent;color:var(--text-3);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:all 0.2s}
.side-tab:hover{color:var(--text-2)}
.side-tab.active{background:var(--cyan);color:var(--bg-deeper);box-shadow:0 0 12px var(--cyan-glow)}
.nav-item,.folder{height:30px;border-radius:6px;padding:0 8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);cursor:pointer;transition:background 0.15s,color 0.15s;border:none;background:transparent;width:100%;font-family:var(--sans);text-align:left}
.nav-item:hover,.folder:hover{color:var(--text-1);background:rgba(255,255,255,0.025)}
.nav-item .ico{width:12px;height:12px;flex-shrink:0;opacity:0.5}
.nav-item.active{color:var(--text-1);background:var(--cyan-soft);border-left:2px solid var(--cyan);padding-left:6px}
.nav-item.active .ico{opacity:1;color:var(--cyan)}
.folder{font-weight:600;color:var(--text-1);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;margin-top:8px}
.folder .arrow{font-size:9px;color:var(--text-3);transition:transform 0.2s;margin-left:auto}
.folder.collapsed .arrow{transform:rotate(-90deg)}
.folder .swatch{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.folder.tech .swatch{background:var(--tech)}
.folder.cap .swatch{background:var(--cap)}
.folder.dim{opacity:0.35}
.folder-body{overflow:hidden;transition:max-height 0.3s ease;max-height:300px;margin-left:12px;padding-left:6px;border-left:1px solid var(--line)}
.folder.collapsed + .folder-body{max-height:0}
.folder-body .nav-item{height:26px;font-size:11.5px;color:var(--text-3)}
.folder-body .nav-item:hover{color:var(--text-1)}
.folder-body .nav-item.active{color:var(--text-1);border-left:2px solid var(--cyan);padding-left:6px}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side-foot .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--tech),var(--cyan));display:flex;align-items:center;justify-content:center;color:var(--bg-deeper);font-weight:700;font-size:12px;flex-shrink:0}
.side-foot .who{font-size:11px;color:var(--text-1);font-weight:500}
.side-foot .who small{display:block;font-size:9px;color:var(--text-3);margin-top:1px;font-weight:400}

/* ── TOPBAR ── */
.topbar{grid-area:topbar;background:var(--bg-deeper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;padding-right:max(20px,var(--safe-right))}
.crumbs{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);font-weight:500}
.crumbs .sep{color:var(--text-4)}
.crumbs .here{color:var(--text-1);font-weight:600}
.arm-tag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;border:1px solid}
.arm-tag.tech{color:var(--tech);border-color:var(--tech);background:var(--tech-bg)}
.arm-tag.cap{color:var(--cap);border-color:var(--cap);background:var(--cap-bg)}
.arm-tag.life{color:var(--cyan);border-color:var(--cyan);background:var(--cyan-soft)}
.topbar-spacer{flex:1}
.pill{height:30px;padding:0 10px;background:var(--bg-card);border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);font-family:var(--mono);font-weight:500}
.pill .live-dot{width:5px;height:5px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* ── MAIN ── */
.main{grid-area:main;padding:20px 22px 30px;overflow-y:auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.page-head-left{display:flex;flex-direction:column;gap:4px}
.page-arm-strip{width:32px;height:2.5px;border-radius:2px;margin-bottom:6px}
.page-arm-strip.tech{background:var(--tech)}
.page-arm-strip.cap{background:var(--cap)}
.page-arm-strip.life{background:var(--cyan)}
.page-title{font-size:clamp(20px,1.8vw,28px);font-weight:700;color:var(--text-1);letter-spacing:-0.025em;line-height:1}
.page-sub{font-size:11px;color:var(--text-3);margin-top:4px}
.page-edit-hint{font-size:10px;color:var(--text-3);font-family:var(--mono);letter-spacing:0.08em;display:flex;align-items:center;gap:5px}
.page-edit-hint::before{content:"✎";color:var(--cyan);font-size:10px}

/* ── SECTION HEADERS ── */
.section-h{display:flex;align-items:center;gap:12px;margin:22px 0 10px;font-size:10px;letter-spacing:0.16em;color:var(--text-3);text-transform:uppercase;font-weight:600;font-family:var(--sans)}
.section-h:first-of-type{margin-top:0}
.section-h .num{color:var(--cyan);font-weight:700;margin-right:3px}
.section-h .num.alert{color:var(--bad)}
.section-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.section-h .meta{font-size:9px;color:var(--text-3);letter-spacing:0.14em;font-weight:400}

/* ── ATTENTION ── */
.attention{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.att{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;transition:transform 0.2s,border-color 0.2s;cursor:pointer}
.att:hover{border-color:var(--line-3);transform:translateY(-1px)}
.att-num{font-size:var(--kpi-num);font-weight:700;line-height:1;letter-spacing:-0.025em;color:var(--text-1);font-family:var(--sans);font-feature-settings:"tnum" 1}
.att-num .cur{font-size:0.55em;color:var(--text-3);margin-left:2px;font-weight:500}
.att-label{font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);margin-top:10px}
.att-detail{font-size:10px;color:var(--text-3);margin-top:2px}
.att.warn .att-num{color:var(--warn)}
.att.bad  .att-num{color:var(--bad)}
.att.good .att-num{color:var(--good)}
.att.cyan .att-num{color:var(--cyan)}
.att.tech .att-num{color:var(--tech)}

/* ── MONTH NAVIGATOR ── */
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.mnav-btn{width:26px;height:26px;border-radius:6px;background:var(--bg-card);border:1px solid var(--line);color:var(--text-2);font-size:15px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;line-height:1}
.mnav-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.mnav-label{font-size:13px;font-weight:600;color:var(--text-1);min-width:130px;text-align:center;letter-spacing:-0.005em}

/* ── CHARTS ROW ── */
.charts-row{display:grid;grid-template-columns:1fr 136px;gap:12px;margin-bottom:14px}
.chart-card{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.chart-label{font-size:9px;font-weight:600;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:10px;font-family:var(--mono)}
.donut-card{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.donut-legend{width:100%;display:flex;flex-direction:column;gap:3px}
.dl-item{display:flex;align-items:center;gap:5px;font-size:8.5px;color:var(--text-3);font-family:var(--mono);white-space:nowrap;overflow:hidden}
.dl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── MONEY ── */
.money-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:12px}
.money-card{background:var(--bg-card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;position:relative;overflow:hidden}
.money-card.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 100% 0%,var(--cyan-soft),transparent 60%);pointer-events:none}
.money-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;position:relative}
.money-period{font-size:14px;font-weight:600;color:var(--text-1);letter-spacing:-0.005em}
.money-period .scope{color:var(--text-3);font-weight:400;margin-left:5px;font-size:12px}
.money-tag{font-size:9px;font-weight:500;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase;font-family:var(--mono)}
.money-rows{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:14px;border-bottom:1px dashed var(--line);margin-bottom:14px;position:relative}
.money-rows.three{grid-template-columns:repeat(3,1fr)}
.money-rows.four{grid-template-columns:repeat(2,1fr);gap:10px 16px}
.money-rows.four-lg{grid-template-columns:repeat(4,1fr)}
.row-label{font-size:9px;font-weight:600;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono)}
.row-val{font-size:var(--money-num);font-weight:700;color:var(--text-1);letter-spacing:-0.025em;font-family:var(--sans);font-feature-settings:"tnum" 1}
.row-val .cur{font-size:0.5em;color:var(--text-3);margin-left:2px;font-weight:500}
.row-val.income{color:var(--good)}
.row-val.expense{color:var(--bad)}
.row-val.expected{color:var(--warn)}
.row-val.delayed{color:var(--bad);opacity:0.7}
.net-row{display:flex;align-items:center;gap:10px;position:relative}
.net-num{font-size:var(--hero-num);font-weight:800;color:var(--cyan);line-height:0.95;letter-spacing:-0.04em;font-family:var(--sans);font-feature-settings:"tnum" 1;text-shadow:0 0 32px var(--cyan-glow)}
.net-num .cur{font-size:0.4em;color:var(--cyan-deep);margin-left:3px;font-weight:600}
.net-tag{text-align:right;margin-left:auto}
.net-tag-label{font-size:9px;font-weight:600;color:var(--text-3);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:2px;font-family:var(--mono)}
.net-tag-val{font-size:12px;font-weight:700;color:var(--cyan)}
.save-bar{display:flex;gap:2px;height:6px;margin-top:10px}
.save-seg{flex:1;background:var(--bg-deeper);border:1px solid var(--line);border-radius:1px}
.save-seg.fill{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 4px var(--cyan-glow)}

/* ── EDITABLE ── */
.editable{cursor:text;border-radius:3px;padding:0 3px;margin:0 -3px;transition:background 0.15s;position:relative;display:inline-block}
.editable:hover,.editable:focus{background:rgba(56,189,248,0.06)}
/* Always show edit hint on touch devices */
@media(hover:none){.editable::after{content:"✎";position:absolute;top:-1px;right:-14px;font-size:8px;color:var(--cyan);opacity:0.45}}
.editable::after{content:"✎";position:absolute;top:0;right:-14px;font-size:8px;color:var(--cyan);opacity:0;transition:opacity 0.15s}
.editable:hover::after{opacity:0.5}
.editable.editing{background:var(--bg-input);outline:1px solid var(--cyan)}

/* ── SOURCES ── */
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.src{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-left:2.5px solid var(--cyan);transition:transform 0.2s,border-color 0.2s}
.src:hover{transform:translateY(-1px)}
.src.tech{border-left-color:var(--tech)}
.src.cap{border-left-color:var(--cap)}
.src-label{font-size:9px;font-weight:600;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px;font-family:var(--mono)}
.src-num{font-size:18px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;line-height:1;font-feature-settings:"tnum" 1}
.src-num .cur{font-size:0.55em;color:var(--text-3);margin-left:2px;font-weight:500}
.src-meta{font-size:10px;color:var(--text-3);margin-top:5px}

/* ── PROJECTS ── */
.panel{background:var(--bg-card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.panel-head{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:13px;font-weight:600;color:var(--text-1)}
.panel-meta{font-size:9px;font-weight:500;color:var(--text-3);letter-spacing:0.12em;font-family:var(--mono)}
.panel-body{padding:6px 20px 16px}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.project{padding:11px 0;border-bottom:1px dashed var(--line)}
.project:last-child{border-bottom:none}
.project-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.project-name{font-size:var(--proj-name);font-weight:500;color:var(--text-1);display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.dot.active{background:var(--good);box-shadow:0 0 5px var(--good)}
.dot.risk{background:var(--warn);box-shadow:0 0 5px var(--warn)}
.dot.idle{background:var(--text-3)}
.project-pct{font-size:12px;font-weight:600;color:var(--text-2);font-feature-settings:"tnum" 1}
.progress-bar{display:flex;gap:2px;margin-bottom:5px}
.seg{flex:1;height:5px;background:var(--bg-deeper);border:1px solid var(--line);border-radius:1px}
.seg.fill{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 4px var(--cyan-glow)}
.project-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-family:var(--mono)}
.project-meta .urgent{color:var(--warn)}

/* ── TRADING CALENDAR ── */
.trade-cal-wrap{margin-bottom:16px}
.trade-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-hdr{font-size:8.5px;font-weight:600;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;text-align:center;padding:5px 0;font-family:var(--mono)}
.cal-day{border-radius:6px;min-height:44px;padding:5px 5px 4px;position:relative;display:flex;flex-direction:column;border:1px solid transparent;transition:all 0.13s;cursor:default}
.cal-day.clickable{cursor:pointer}
.cal-day.empty{background:transparent;border-color:transparent}
.cal-day.future{background:rgba(10,15,28,0.4);border-color:transparent}
.cal-day.weekend{background:rgba(10,15,28,0.3);border-color:var(--line)}
.cal-day.no-trade{background:rgba(17,24,39,0.7);border-color:var(--line);cursor:pointer}
.cal-day.no-trade:hover{border-color:var(--line-2)}
.cal-day.profit{background:rgba(74,222,128,0.09);border-color:rgba(74,222,128,0.22);cursor:pointer}
.cal-day.profit:hover{border-color:var(--good)}
.cal-day.loss{background:rgba(248,113,113,0.09);border-color:rgba(248,113,113,0.22);cursor:pointer}
.cal-day.loss:hover{border-color:var(--bad)}
.cal-day.breakeven{background:rgba(251,191,36,0.07);border-color:rgba(251,191,36,0.18);cursor:pointer}
.cal-day.today{box-shadow:0 0 0 1.5px var(--cyan)}
.cal-dn{font-size:9.5px;color:var(--text-3);font-family:var(--mono);line-height:1}
.cal-day.profit .cal-dn,.cal-day.profit .cal-pnl{color:var(--good)}
.cal-day.loss   .cal-dn,.cal-day.loss   .cal-pnl{color:var(--bad)}
.cal-day.today  .cal-dn{color:var(--cyan)}
.cal-pnl{font-size:7.5px;font-family:var(--mono);margin-top:auto;line-height:1}
.trade-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.ts-card{background:var(--bg-card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.ts-num{font-size:17px;font-weight:700;color:var(--text-1);font-family:var(--sans);font-feature-settings:"tnum" 1;letter-spacing:-0.02em}
.ts-num.good{color:var(--good)}
.ts-num.bad{color:var(--bad)}
.ts-label{font-size:8.5px;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;margin-top:5px;font-family:var(--mono);font-weight:600}

/* ── HOLDINGS ── */
.hld-sections{display:flex;flex-direction:column;gap:12px}
.hld-block{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hld-head{padding:11px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.hld-title{font-size:10px;font-weight:700;color:var(--text-1);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono)}
.hld-htotal{font-size:12px;font-weight:600;color:var(--cyan);font-family:var(--mono)}
.hld-table{width:100%;border-collapse:collapse}
.hld-table th{padding:5px 18px;font-size:8.5px;font-weight:600;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono);text-align:left;background:var(--bg-deeper);border-bottom:1px solid var(--line)}
.hld-table th:not(:first-child){text-align:right}
.hld-table td{padding:9px 18px;font-size:12px;font-family:var(--mono);border-bottom:1px dashed var(--line);color:var(--text-1)}
.hld-table tr:last-child td{border-bottom:none}
.hld-table td:not(:first-child){text-align:right}
.hld-sym{font-weight:600;font-size:13px}
.hld-change.pos{color:var(--good)}
.hld-change.neg{color:var(--bad)}
.hld-add{display:flex;align-items:center;gap:6px;padding:8px 18px;font-size:10.5px;color:var(--text-3);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:var(--sans);transition:color 0.15s}
.hld-add:hover{color:var(--cyan)}
.port-total{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:20px}
.pt-num{font-size:var(--hero-num);font-weight:800;color:var(--cyan);line-height:1;letter-spacing:-0.04em;text-shadow:0 0 32px var(--cyan-glow)}
.pt-num .cur{font-size:0.4em;color:var(--cyan-deep);margin-left:3px;font-weight:600}
.pt-pills{display:flex;flex-wrap:wrap;gap:8px}
.pt-pill{display:flex;flex-direction:column;gap:2px;padding:8px 14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:8px}
.pt-pill-label{font-size:8.5px;font-weight:600;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono)}
.pt-pill-val{font-size:14px;font-weight:700;color:var(--text-1);font-family:var(--mono)}

/* ── ANGEL ── */
.angel-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.angel-panel{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.ap-head{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ap-title{font-size:10px;font-weight:700;color:var(--text-1);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono)}
.ap-add{height:26px;padding:0 10px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--text-3);font-size:10px;cursor:pointer;transition:all 0.15s;font-family:var(--sans)}
.ap-add:hover{border-color:var(--cyan);color:var(--cyan)}
.invest-table{width:100%;border-collapse:collapse}
.invest-table th{padding:5px 18px;font-size:8.5px;font-weight:600;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono);text-align:left;background:var(--bg-deeper)}
.invest-table th:not(:first-child){text-align:right}
.invest-table td{padding:10px 18px;font-size:12px;border-bottom:1px dashed var(--line);color:var(--text-1);vertical-align:middle}
.invest-table tr:last-child td{border-bottom:none}
.invest-table td:not(:first-child){text-align:right;font-family:var(--mono)}
.invest-name{font-weight:500;font-size:13px}
.invest-stage{display:inline-block;font-size:8px;padding:2px 5px;border-radius:3px;background:var(--tech-bg);color:var(--tech);border:1px solid rgba(165,180,252,0.2);font-family:var(--mono);margin-top:2px}
.invest-roi.pos{color:var(--good)}
.invest-roi.neg{color:var(--bad)}
.invest-del{background:transparent;border:none;color:var(--text-4);cursor:pointer;font-size:12px;transition:color 0.15s;padding:2px 4px}
.invest-del:hover{color:var(--bad)}

/* ── REAL ESTATE ── */
.re-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.prop-list{display:flex;flex-direction:column;gap:10px}
.prop-card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prop-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.prop-head-left{display:flex;align-items:center;gap:8px}
.prop-name{font-size:13px;font-weight:600;color:var(--text-1)}
.prop-status{font-size:9px;font-family:var(--mono);padding:2px 7px;border-radius:4px}
.prop-status.active{color:var(--good);background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.2)}
.prop-status.sold{color:var(--text-3);background:var(--bg-elev);border:1px solid var(--line)}
.prop-cells{display:grid;grid-template-columns:repeat(5,1fr)}
.prop-cell{padding:11px 16px;border-right:1px dashed var(--line)}
.prop-cell:last-child{border-right:none}
.prop-cell-label{font-size:8.5px;font-weight:600;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px;font-family:var(--mono)}
.prop-cell-val{font-size:14px;font-weight:700;color:var(--text-1);font-family:var(--sans);letter-spacing:-0.02em;font-feature-settings:"tnum" 1}
.prop-cell-val.good{color:var(--good)}
.prop-cell-val.bad{color:var(--bad)}
.prop-cell-val.cyan{color:var(--cyan)}
.prop-add{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:1.5px dashed var(--line-2);border-radius:11px;color:var(--text-3);cursor:pointer;font-size:12px;font-family:var(--sans);transition:all 0.15s;background:transparent;width:100%}
.prop-add:hover{border-color:var(--cyan);color:var(--cyan)}

/* ── RAIL ── */
.rail{grid-area:rail;background:var(--bg-deeper);border-left:1px solid var(--line);padding:18px 16px max(18px,var(--safe-bottom)) 16px;padding-right:max(16px,var(--safe-right));display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.rail-block{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.rail-block h4{font-size:10px;font-weight:700;color:var(--text-1);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.rail-block h4 .badge{font-size:8.5px;color:var(--cyan);background:var(--cyan-soft);border:1px solid var(--cyan-mid);padding:2px 6px;border-radius:4px;font-family:var(--mono);letter-spacing:0.04em;font-weight:500}
.activity-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:11.5px}
.activity-row:last-child{border-bottom:none;padding-bottom:0}
.activity-row:first-child{padding-top:0}
.activity-icon{width:26px;height:26px;border-radius:6px;background:var(--bg-elev);border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:12px;margin-top:1px}
.activity-icon.tech{background:var(--tech-bg);color:var(--tech);border-color:rgba(165,180,252,0.2)}
.activity-icon.good{color:var(--good)}
.activity-row .grow{flex:1;min-width:0}
.activity-row .t{color:var(--text-1);font-weight:500;line-height:1.3}
.activity-row .d{color:var(--text-3);font-size:10px;margin-top:1px}
.activity-row .val{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--cyan);flex-shrink:0}

/* ── EMPTY STATE ── */
.empty-state{margin-top:48px;text-align:center;padding:50px 28px;background:var(--bg-card);border:1px dashed var(--line-2);border-radius:13px;max-width:520px;margin-left:auto;margin-right:auto}
.empty-icon{width:48px;height:48px;border-radius:12px;background:var(--bg-elev);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--cyan);font-size:22px}
.empty-title{font-size:17px;font-weight:700;color:var(--text-1);margin-bottom:7px;letter-spacing:-0.01em}
.empty-body{font-size:12px;color:var(--text-2);line-height:1.6;max-width:360px;margin:0 auto}

/* ── ANIMATIONS ── */
.att,.money-card,.src,.panel,.rail-block{animation:rise 0.45s cubic-bezier(0.16,1,0.3,1) backwards}
.att:nth-child(1){animation-delay:0.04s}.att:nth-child(2){animation-delay:0.08s}.att:nth-child(3){animation-delay:0.12s}.att:nth-child(4){animation-delay:0.16s}
.money-card:nth-child(1){animation-delay:0.20s}.money-card:nth-child(2){animation-delay:0.25s}
.src:nth-child(1){animation-delay:0.28s}.src:nth-child(2){animation-delay:0.31s}.src:nth-child(3){animation-delay:0.34s}.src:nth-child(4){animation-delay:0.37s}
.panel{animation-delay:0.42s}
.rail-block:nth-child(1){animation-delay:0.18s}.rail-block:nth-child(2){animation-delay:0.26s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-mid)}

/* ── SIGNAL BAR ── */
.signal-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:9px;margin-bottom:16px;flex-wrap:wrap}
.signal{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);font-weight:500;padding:3px 8px;border-radius:5px}
.signal.good{color:var(--good);background:rgba(74,222,128,0.08)}
.signal.warn{color:var(--warn);background:rgba(251,191,36,0.08)}
.signal.bad{color:var(--bad);background:rgba(248,113,113,0.08)}
.signal.muted{color:var(--text-3);background:var(--bg-elev)}
.sig-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.signal.good .sig-dot{background:var(--good);box-shadow:0 0 6px var(--good)}
.signal.warn .sig-dot{background:var(--warn)}
.signal.bad  .sig-dot{background:var(--bad)}
.signal.muted .sig-dot{background:var(--text-3)}
.signal-sep{color:var(--text-4);font-size:12px}

/* ── RESPONSIVE (iPad landscape 1194px → desktop 1440px+) ── */
@media(max-width:1250px){
  .app{grid-template-columns:var(--sidebar-w) 1fr 210px}
  .money-grid{grid-template-columns:1fr}
  .proj-grid{grid-template-columns:1fr;gap:0}
  .charts-row{grid-template-columns:1fr 110px}
  .fin-hero{grid-template-columns:1fr 1fr}
  .trade-stats{grid-template-columns:repeat(2,1fr)}
  .acct-row{grid-template-columns:1.5fr 1fr 1fr 1fr auto}
  .acct-row .acct-cell:nth-child(4){display:none}
}
@media(max-width:900px){
  .app{grid-template-columns:var(--sidebar-w) 1fr;grid-template-areas:"side topbar" "side main" "side rail"}
  .rail{border-left:none;border-top:1px solid var(--line)}
  .health-grid{grid-template-columns:1fr}
  .re-kpis{grid-template-columns:repeat(2,1fr)}
  .angel-kpis{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"topbar" "main" "rail"}
  .side{display:none}
  .main{padding:14px}
  .money-rows.four{grid-template-columns:1fr 1fr}
}
@media(hover:none){.att:hover,.src:hover{transform:none}}
/* Touch targets */
@media(hover:none){
  .nav-item,.folder,.cl-check,.mnav-btn,.hld-add,.recur-add,.acct-add-btn,.ap-add,.prop-add{min-height:var(--touch)}
  .cl-item{padding:10px 12px}
  .recur-item{padding:10px 16px}
}

/* ── SKILLS HUB ── */
.skill-list{display:flex;flex-direction:column;gap:12px}
.skill-row{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:14px 18px;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}
.skill-icon{font-size:18px;line-height:1}
.skill-info{display:flex;flex-direction:column;gap:6px}
.skill-name{font-size:13px;font-weight:600;color:var(--text-1)}
.skill-track{height:7px;background:var(--bg-deeper);border-radius:4px;overflow:hidden;position:relative}
.skill-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.skill-sub{font-size:10px;color:var(--text-3);font-family:var(--mono);margin-top:2px}
.skill-pct{font-size:20px;font-weight:700;color:var(--text-1);font-family:var(--sans);letter-spacing:-0.02em;min-width:48px;text-align:right}
.skill-pct span{font-size:11px;color:var(--text-3);font-weight:400}

/* ── CHECKLIST ── */
.checklist{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.cl-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;transition:background 0.15s}
.cl-item:hover{background:rgba(255,255,255,0.03)}
.cl-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.cl-check.done{background:var(--good);border-color:var(--good)}
.cl-check.done::after{content:'✓';font-size:10px;color:var(--bg-deeper);font-weight:700}
.cl-text{font-size:13px;color:var(--text-1);flex:1;line-height:1.4}
.cl-item.done-item .cl-text{color:var(--text-3);text-decoration:line-through}
.cl-del{background:transparent;border:none;color:var(--text-4);cursor:pointer;font-size:13px;padding:2px 5px;transition:color 0.15s;flex-shrink:0}
.cl-del:hover{color:var(--bad)}
.cl-add-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px dashed var(--line);margin-top:4px}
.cl-add-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-1);font-size:12px;font-family:var(--sans)}
.cl-add-input::placeholder{color:var(--text-4)}
.cl-add-btn{height:22px;padding:0 10px;background:var(--cyan-soft);border:1px solid var(--cyan-mid);color:var(--cyan);font-size:10px;border-radius:5px;cursor:pointer;font-family:var(--sans);transition:all 0.15s}
.cl-add-btn:hover{background:var(--cyan);color:var(--bg-deeper)}

/* ── NOTES AREA ── */
.notes-card{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:10px}
.notes-label{font-size:9px;font-weight:600;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;font-family:var(--mono)}
.notes-text{width:100%;min-height:80px;background:var(--bg-deeper);border:1px solid var(--line);border-radius:7px;color:var(--text-1);font-family:var(--sans);font-size:13px;padding:10px 12px;resize:vertical;outline:none;transition:border-color 0.15s;line-height:1.6}
.notes-text:focus{border-color:var(--cyan-mid)}

/* ── RELOCATION ── */
.dest-list{display:flex;flex-direction:column;gap:12px}
.dest-card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dest-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dest-icon{font-size:20px;line-height:1}
.dest-name{font-size:14px;font-weight:600;color:var(--text-1)}
.dest-sub{font-size:10px;color:var(--text-3);margin-top:1px}
.dest-badge{margin-left:auto;font-size:9px;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.dest-badge.primary{background:rgba(56,189,248,0.12);color:var(--cyan);border:1px solid var(--cyan-mid)}
.dest-badge.planned{background:rgba(251,191,36,0.1);color:var(--warn);border:1px solid rgba(251,191,36,0.25)}
.dest-badge.later{background:var(--bg-elev);color:var(--text-3);border:1px solid var(--line)}
.dest-body{padding:14px 18px}

/* ── BIKE BUILD ── */
.build-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.build-stat{background:var(--bg-card);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.build-stat-num{font-size:20px;font-weight:700;color:var(--text-1);font-family:var(--sans);letter-spacing:-0.02em}
.build-stat-num input{background:transparent;border:none;outline:none;color:var(--cyan);font:inherit;width:100%}
.build-stat-label{font-size:9px;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;margin-top:5px;font-family:var(--mono);font-weight:600}
.build-progress{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:12px}
.build-bar{height:10px;background:var(--bg-deeper);border-radius:5px;overflow:hidden;margin:10px 0}
.build-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--tech));transition:width 0.6s}

/* ── HEALTH ── */
.health-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.health-card{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.health-title{font-size:10px;font-weight:700;color:var(--text-1);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:14px;font-family:var(--mono)}
.sleep-score{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.sleep-ring-wrap{position:relative;width:90px;height:90px;flex-shrink:0}
.sleep-ring-wrap svg{display:block}
.sleep-score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sleep-score-num .big{font-size:22px;font-weight:800;color:var(--text-1);line-height:1}
.sleep-score-num .sm{font-size:8px;color:var(--text-3);font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase}
.sleep-details{display:flex;flex-direction:column;gap:6px;flex:1}
.sleep-detail-row{display:flex;justify-content:space-between;align-items:center}
.sleep-detail-label{font-size:10px;color:var(--text-3);font-family:var(--mono)}
.sleep-detail-val{font-size:12px;font-weight:600;color:var(--text-1);font-family:var(--mono)}
.sleep-stages{margin-top:8px}
.stage-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0}
.stage-seg{height:100%;border-radius:2px;transition:flex 0.5s}
.stage-legend{display:flex;gap:10px;flex-wrap:wrap}
.stage-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text-3);font-family:var(--mono)}
.stage-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.macros-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.macro-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.macro-ring{position:relative}
.macro-ring svg{display:block}
.macro-label{font-size:9px;font-weight:600;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono);text-align:center}
.health-7days{margin-top:12px}
.h7-label{font-size:9px;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono);font-weight:600;margin-bottom:8px}

const pageMonth = {};

function getPM(key) {
  if (!pageMonth[key]) { const n = new Date(); pageMonth[key] = { y: n.getFullYear(), m: n.getMonth() }; }
  return pageMonth[key];
}
function navMonth(dir) {
  const page = safe.get('cockpit.page') || 'autoscale';
  const pm = getPM(page);
  pm.m += dir;
  if (pm.m > 11) { pm.m = 0; pm.y++; }
  if (pm.m < 0)  { pm.m = 11; pm.y--; }
  renderPage(page);
}
window.navMonth = navMonth;

// ── Storage ────────────────────────────────────────
const safe = {
  get(k)  { try { return localStorage.getItem(k); } catch { return null; } },

};

function setEdited(key, v)        { safe.set('cockpit.val.'+key, v); }

function mKey(page, y, m, field) { return `${page}.${y}.${m}.${field}`; }
function getMField(page, y, m, field, def) {
  const now = new Date();
  const isNow = y === now.getFullYear() && m === now.getMonth();
  const stored = safe.get('cockpit.val.' + mKey(page, y, m, field));
  if (stored !== null) return +stored;
  return isNow ? (def || 0) : 0;
}

  const result = [];

// ── Formatting ─────────────────────────────────────
function fmt(n) {
  if (n === null || n === undefined || n === '') return '0';
  if (typeof n === 'string') return n;
  return n.toLocaleString('en-US');
}
function fmtK(n) {
  n = +n;
  if (n >= 10000) return (n/1000).toFixed(0)+'k';
  if (n >= 1000)  return (n/1000).toFixed(1)+'k';
  return String(n);
}

// ── Render helpers ──────────────────────────────────
function renderEditable(key, value, opts={}) {
  const v = getEdited(key, value);
  const cur = opts.cur ? `<span class="cur">${opts.cur}</span>` : '';
  return `<span class="editable" data-edit-key="${key}" data-edit-num="${v}">${fmt(v)}${cur}</span>`;
}

function svgBarChart(history, curY, curM) {
  const maxVal = Math.max(...history.map(h => h.income), 1);
  const W = 300, H = 68, bW = 28, gap = 16;
  const n = history.length;
  const totalW = n * bW + (n - 1) * gap;
  const startX = (W - totalW) / 2;
  let svg = `<svg viewBox="0 0 ${W} ${H+22}" width="100%" style="overflow:visible;display:block">`;
  history.forEach((d, i) => {
    const x = startX + i * (bW + gap);
    const barH = d.income > 0 ? Math.max(Math.round((d.income / maxVal) * H), 3) : 3;
    const y = H - barH;
    const isCurrent = d.y === curY && d.m === curM;
    const fill = isCurrent ? '#38bdf8' : 'rgba(56,189,248,0.2)';
    const txtFill = isCurrent ? '#38bdf8' : '#64748b';
    svg += `<rect x="${x}" y="${y}" width="${bW}" height="${barH}" fill="${fill}" rx="4"/>`;
    if (d.income > 0) svg += `<text x="${x+bW/2}" y="${y-5}" text-anchor="middle" fill="${txtFill}" font-size="8" font-family="JetBrains Mono,monospace" font-weight="500">${fmtK(d.income)}</text>`;
    svg += `<text x="${x+bW/2}" y="${H+15}" text-anchor="middle" fill="${isCurrent?'#94a3b8':'#64748b'}" font-size="9" font-family="JetBrains Mono,monospace">${MSHORT[d.m]}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function svgDonut(segments) {
  const total = segments.reduce((s,x) => s + Math.max(0,x.amount), 0);
  const cx=60, cy=60, r=42, sw=14;
  const circ = 2 * Math.PI * r;
  let svg = `<svg viewBox="0 0 120 120" width="120" height="120">`;
  svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#0f1626" stroke-width="${sw}"/>`;
  if (total > 0) {
    let cum = 0;
    segments.forEach(seg => {
      if (seg.amount <= 0) return;
      const pct = seg.amount / total;
      const dash = (pct * circ).toFixed(2);
      const gap2 = (circ - pct * circ).toFixed(2);
      const off = (circ * 0.25 - cum * circ).toFixed(2);
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap2}" stroke-dashoffset="${off}"/>`;
      cum += pct;
    });
  }
  const totalStr = total >= 1000 ? fmtK(total) : String(total);
  svg += `<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700" font-family="Inter,sans-serif">${totalStr}</text>`;
  svg += `<text x="${cx}" y="${cy+10}" text-anchor="middle" fill="#64748b" font-size="7" font-family="JetBrains Mono,monospace" letter-spacing="0.08em">₪ INCOME</text>`;
  svg += `</svg>`;
  return svg;
}

// ── Trading Calendar ────────────────────────────────
function renderTradingCalendar(pageKey, y, m) {
  const DAYS = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  const firstDay = new Date(y, m, 1).getDay();
  const mondayOff = (firstDay + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();

  // Collect trade data
  let totalPnl = 0, winDays = 0, lossDays = 0, bestDay = 0, worstDay = 0, tradeDays = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `cockpit.trade.${y}.${m}.${d}`;
    const stored = safe.get(key);
    if (stored !== null) {
      const pnl = parseFloat(stored);
      if (!isNaN(pnl) && pnl !== 0) {
        totalPnl += pnl; tradeDays++;
        if (pnl > 0) { winDays++; if (pnl > bestDay) bestDay = pnl; }
        if (pnl < 0) { lossDays++; if (pnl < worstDay) worstDay = pnl; }
      }
    }
  }
  const winRate = tradeDays > 0 ? Math.round((winDays / tradeDays) * 100) : 0;

  let html = `<div class="section-h"><span><span class="num">01</span>Trade Calendar</span><div class="line"></div><span class="meta">${MNAMES[m].toUpperCase()} ${y}</span></div>`;
  html += `<div class="trade-cal-wrap"><div class="trade-cal">`;
  DAYS.forEach(d => html += `<div class="cal-hdr">${d}</div>`);
  for (let i = 0; i < mondayOff; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const dow = date.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isFuture = date > today;
    const isToday = date.toDateString() === today.toDateString();
    const pnlKey = `cockpit.trade.${y}.${m}.${d}`;
    const stored = safe.get(pnlKey);
    const pnl = stored !== null ? parseFloat(stored) : null;

    let cls = 'cal-day';
    if (isFuture) cls += ' future';
    else if (isWeekend) cls += ' weekend';
    else if (pnl === null) { cls += ' no-trade clickable'; }
    else if (pnl > 0) cls += ' profit clickable';
    else if (pnl < 0) cls += ' loss clickable';
    else cls += ' breakeven clickable';
    if (isToday) cls += ' today';

    const pnlStr = pnl !== null && pnl !== 0 ? (pnl > 0 ? '+' : '') + pnl : '';
    const click = (!isFuture && !isWeekend) ? `onclick="editTrade(${y},${m},${d})"` : '';

    html += `<div class="${cls}" ${click}><span class="cal-dn">${d}</span>${pnlStr ? `<span class="cal-pnl">${pnlStr}</span>` : ''}</div>`;
  }

  html += `</div></div>`;
  html += `<div class="trade-stats">
    <div class="ts-card"><div class="ts-num ${totalPnl>=0?'good':'bad'}">${totalPnl>=0?'+':''}${fmt(totalPnl)}<span style="font-size:0.5em;margin-left:2px;color:var(--text-3)">₪</span></div><div class="ts-label">Net P&L</div></div>
    <div class="ts-card"><div class="ts-num">${winRate}<span style="font-size:0.6em;color:var(--text-3)">%</span></div><div class="ts-label">Win Rate</div></div>
    <div class="ts-card"><div class="ts-num good">${bestDay>0?'+'+bestDay:'-'}</div><div class="ts-label">Best Day</div></div>

// ── Holdings ────────────────────────────────────────
function renderHoldings(data, pageKey) {
  const rate = data.usdToIls || 3.7;
  const toIls = (amt, cur) => cur === 'USD' ? amt * rate : cur === 'EUR' ? amt * rate * 1.08 : amt;

  let cryptoTotal = 0, stockTotal = 0, cashTotal = 0;
  data.crypto.forEach(c => { cryptoTotal += c.amount * c.price * (c.currency==='USD'?rate:1); });
  data.stocks.forEach(s => { stockTotal  += s.shares * s.price * (s.currency==='USD'?rate:1); });
  data.cash.forEach(c   => { cashTotal   += toIls(c.amount, c.currency); });
  const total = cryptoTotal + stockTotal + cashTotal;

  let html = `
    <div class="port-total">
      <div class="net-num">${fmt(Math.round(total))}<span class="cur">₪</span></div>
      <div class="pt-pills">
        <div class="pt-pill"><div class="pt-pill-label">Crypto</div><div class="pt-pill-val" style="color:var(--warn)">${fmt(Math.round(cryptoTotal))}₪</div></div>
        <div class="pt-pill"><div class="pt-pill-label">Stocks</div><div class="pt-pill-val" style="color:var(--tech)">${fmt(Math.round(stockTotal))}₪</div></div>
        <div class="pt-pill"><div class="pt-pill-label">Cash</div><div class="pt-pill-val" style="color:var(--good)">${fmt(Math.round(cashTotal))}₪</div></div>
      </div>
    </div>
    <div class="hld-sections">`;

  // Crypto
  html += `<div class="hld-block"><div class="hld-head"><div class="hld-title">Crypto</div><div class="hld-htotal">${fmt(Math.round(cryptoTotal))}₪</div></div>
    <table class="hld-table"><tr><th>Asset</th><th>Amount</th><th>Price ($)</th><th>Value (₪)</th><th>24h</th></tr>`;
  data.crypto.forEach((c,i) => {
    const val = Math.round(c.amount * c.price * rate);
    const ch = c.change;
    html += `<tr><td><div class="hld-sym">${c.symbol}</div><div style="font-size:10px;color:var(--text-3)">${c.name}</div></td>
      <td>${c.amount}</td><td>$${fmt(c.price)}</td><td>${fmt(val)}₪</td>
      <td class="hld-change ${ch>=0?'pos':'neg'}">${ch>=0?'+':''}${ch}%</td></tr>`;
  });
  html += `</table><button class="hld-add" onclick="addHolding('crypto')">+ Add crypto</button></div>`;

  // Stocks
  html += `<div class="hld-block"><div class="hld-head"><div class="hld-title">Stocks</div><div class="hld-htotal">${fmt(Math.round(stockTotal))}₪</div></div>
    <table class="hld-table"><tr><th>Ticker</th><th>Shares</th><th>Price ($)</th><th>Value (₪)</th><th>1d</th></tr>`;
  data.stocks.forEach(s => {
    const val = Math.round(s.shares * s.price * rate);
    html += `<tr><td><div class="hld-sym">${s.symbol}</div><div style="font-size:10px;color:var(--text-3)">${s.name}</div></td>
      <td>${s.shares}</td><td>$${fmt(s.price)}</td><td>${fmt(val)}₪</td>
      <td class="hld-change ${s.change>=0?'pos':'neg'}">${s.change>=0?'+':''}${s.change}%</td></tr>`;
  });
  html += `</table><button class="hld-add" onclick="addHolding('stock')">+ Add stock</button></div>`;

  // Cash
  html += `<div class="hld-block"><div class="hld-head"><div class="hld-title">Cash</div><div class="hld-htotal">${fmt(Math.round(cashTotal))}₪</div></div>
    <table class="hld-table"><tr><th>Currency</th><th>Amount</th><th>Rate</th><th>Value (₪)</th></tr>`;
  data.cash.forEach(c => {
    const r = c.currency==='ILS'?1 : c.currency==='USD'?rate : rate*1.08;
    html += `<tr><td class="hld-sym">${c.currency}</td><td>${fmt(c.amount)}</td><td>${c.currency==='ILS'?'1.00':r.toFixed(2)}</td><td>${fmt(Math.round(c.amount*r))}₪</td></tr>`;
  });
  html += `</table><button class="hld-add" onclick="addHolding('cash')">+ Add currency</button></div></div>`;
  return html;
}

window.addHolding = function(type) {
  const labels = {crypto:'Symbol, Amount, Price(USD)', stock:'Ticker, Shares, Price(USD)', cash:'Currency (ILS/USD/EUR), Amount'};
  const val = prompt(`Add ${type}\n${labels[type]}\nExample: ${type==='cash'?'USD, 1000':'BTC, 0.1, 95000'}`);
  if (!val) return;
  const parts = val.split(',').map(x => x.trim());
  const page = PAGES.holdings;
  if (type === 'crypto') { const [sym,amt,price] = parts; if (sym&&amt&&price) { page.data.crypto.push({symbol:sym.toUpperCase(),name:sym,amount:+amt,price:+price,change:0,currency:'USD'}); }}
  else if (type === 'stock') { const [sym,sh,price] = parts; if (sym&&sh&&price) { page.data.stocks.push({symbol:sym.toUpperCase(),name:sym,shares:+sh,price:+price,change:0,currency:'USD'}); }}
  else if (type === 'cash') { const [cur,amt] = parts; if (cur&&amt) { page.data.cash.push({currency:cur.toUpperCase(),amount:+amt}); }}
  renderPage('holdings');
};

// ── Signal Bar ──────────────────────────────────────
function renderSignalBar(pageKey, y, m, data) {
  const income  = getMField(pageKey, y, m, 'income',   data.money?.month?.income  || 0);
  const expense = getMField(pageKey, y, m, 'expense',  data.money?.month?.expense || 0);
  const delayed = getMField(pageKey, y, m, 'delayed',  data.money?.month?.delayed || 0);
  const expected= getMField(pageKey, y, m, 'expected', data.money?.month?.expected|| 0);
  const net = income - expense;
  const hasPrev = y > 2024 || m > 0;
  let prevY = y, prevM = m - 1;
  if (prevM < 0) { prevM = 11; prevY--; }
  const prevIncome = getMField(pageKey, prevY, prevM, 'income', 0);
  const momPct = prevIncome > 0 ? Math.round(((income - prevIncome) / prevIncome) * 100) : null;

  const revCls  = income >= 5000 ? 'good' : income >= 2000 ? 'warn' : income > 0 ? 'bad' : 'muted';
  const delayCls = delayed === 0 ? 'good' : delayed < 3000 ? 'warn' : 'bad';
  const netCls   = net > 0 ? 'good' : net > -500 ? 'warn' : 'bad';
  const expCls   = expected > 0 ? 'warn' : 'muted';

  const momStr = momPct !== null ? ` ${momPct >= 0 ? '▲' : '▼'}${Math.abs(momPct)}% MoM` : '';

  return `<div class="signal-bar">
    <div class="signal ${revCls}"><div class="sig-dot"></div>${fmtK(income)}₪ in${momStr}</div>
    <span class="signal-sep">·</span>
    <div class="signal ${netCls}"><div class="sig-dot"></div>Net ${net >= 0 ? '+' : ''}${fmtK(net)}₪</div>
    <span class="signal-sep">·</span>
    <div class="signal ${delayCls}"><div class="sig-dot"></div>${delayed > 0 ? fmtK(delayed)+'₪ unpaid' : 'No delays'}</div>
    ${expected > 0 ? `<span class="signal-sep">·</span><div class="signal ${expCls}"><div class="sig-dot"></div>${fmtK(expected)}₪ expected</div>` : ''}
  </div>`;
}

// ── Checklist helpers ────────────────────────────────
function loadChecklist(key, defaults) {
  const stored = safe.get('cockpit.cl.'+key);
  if (stored) { try { return JSON.parse(stored); } catch {} }
  return defaults.map(x => ({...x}));
}
function saveChecklist(key, list) { safe.set('cockpit.cl.'+key, JSON.stringify(list)); }

function renderChecklist(key, defaults, pageKey) {
  const list = loadChecklist(key, defaults);
  let html = `<div class="checklist" id="cl-${key}">`;
  list.forEach((it, i) => {
    html += `<div class="cl-item ${it.done?'done-item':''}">
      <div class="cl-check ${it.done?'done':''}" onclick="toggleCL('${key}',${i},'${pageKey}')"></div>
      <div class="cl-text">${it.text}</div>
      <button class="cl-del" onclick="deleteCL('${key}',${i},'${pageKey}')">×</button>
    </div>`;
  });
  html += `<div class="cl-add-row">
    <input class="cl-add-input" id="cl-inp-${key}" placeholder="Add item…" onkeydown="if(event.key==='Enter')addCL('${key}','${pageKey}')">
    <button class="cl-add-btn" onclick="addCL('${key}','${pageKey}')">Add</button>
  </div></div>`;
  return html;
}

window.toggleCL = function(key, idx, page) {
  const list = loadChecklist(key, []);
  if (list[idx]) list[idx].done = !list[idx].done;
  saveChecklist(key, list);
  renderPage(page);
};
window.deleteCL = function(key, idx, page) {
  const list = loadChecklist(key, []);
  list.splice(idx, 1);
  saveChecklist(key, list);
  renderPage(page);
};
window.addCL = function(key, page) {
  const inp = document.getElementById('cl-inp-'+key);
  if (!inp || !inp.value.trim()) return;
  const list = loadChecklist(key, []);
  list.push({id:'cl-'+Date.now(), text:inp.value.trim(), done:false});
  saveChecklist(key, list);
  renderPage(page);
};

  if (targetDate) {
    const end = new Date(targetDate);
    daysLeft = Math.max(0, Math.floor((end - Date.now()) / 86400000));
  }

  const html = `
    <div class="build-stats">
      <div class="build-stat">
        <div class="build-stat-num"><input type="date" value="${startDate}" onchange="safe.set('bike.start',this.value);renderPage('bike-build')" style="background:transparent;border:none;outline:none;color:${startDate?'var(--cyan)':'var(--text-3)'};font-family:var(--mono);font-size:13px;width:100%"></div>

        <div class="build-stat-label">Target Finish</div>
      </div>
      <div class="build-stat">
        <div class="build-stat-num" style="color:var(--text-1)">${daysElapsed || '—'}</div>
        <div class="build-stat-label">Days In · ${daysLeft||'—'} Left</div>
      </div>

    <div class="build-progress">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono)">Build Progress</div>
        <span class="editable" data-edit-key="bike.pct" data-edit-num="${pct}" style="font-size:18px;font-weight:700;color:var(--cyan)">${pct}<span style="font-size:11px;color:var(--text-3)">%</span></span>
      </div>
      <div class="build-bar"><div class="build-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="notes-card">
      <div class="notes-label">Notes & Log</div>
      <textarea class="notes-text" rows="5" onblur="safe.set('bike.notes',this.value)" placeholder="Build log, parts sourced, issues…">${notes}</textarea>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--line);border-radius:11px;overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line)"><div style="font-size:10px;font-weight:700;color:var(--text-1);letter-spacing:0.12em;text-transform:uppercase;font-family:var(--mono)">Build Checklist</div></div>
      <div style="padding:10px 4px">${renderChecklist('bike-checklist', [{id:'b-1',text:'Source frame',done:false},{id:'b-2',text:'Engine rebuild',done:false},{id:'b-3',text:'Wiring',done:false},{id:'b-4',text:'Paint & finish',done:false},{id:'b-5',text:'Registration',done:false}], 'bike-build')}</div>
    </div>`;
  return html;
}

// ── Health ──────────────────────────────────────────
function svgRing(score, color, size) {
  const r = (size/2) - 8, cx = size/2, cy = size/2, sw = 10;
  const circ = 2 * Math.PI * r;
  const dash = Math.min(Math.max(score,0),100) / 100 * circ;
  const off = circ * 0.25;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2236" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
  </svg>`;
}

  const calT  = hv('calTarget', 2200);

  const protT = hv('proteinTarget', 170);

        <div class="stage-legend">

          <div class="stage-item"><div class="stage-dot" style="background:#38bdf8"></div>REM</div>

        </div>
      </div>
      <div class="health-7days" style="margin-top:14px">
        <div class="h7-label">Last 7 nights</div>
        <div class="h7-bars">
          ${last7.map(d => { const h = d.h/maxH*100; const c = d.h>=7?'var(--good)':d.h>=6?'var(--warn)':d.h>0?'var(--bad)':'var(--bg-elev)'; return `<div class="h7-bar" style="height:${Math.max(h,4)}%;background:${c}" title="${d.h}h"></div>`; }).join('')}

        ${hrow('Protein target', 'proteinTarget', 170, 'g')}
