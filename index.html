window.calCellClick = async function(dateStr) {
  if (_drawMode) return;

  // Quick-place sticker mode: if a sticker is selected, just place/remove it
  if (_activeSticker) {
    const existing = _calData[dateStr] || { cal_date: dateStr };
    const isPlacing = existing.sticker_emoji !== _activeSticker.emoji;

    if (isPlacing) {
      existing.sticker_emoji = _activeSticker.emoji || '';
      existing.sticker_color = _activeSticker.color || '';
      existing.sticker_id    = _activeSticker.id;
    } else {
      // Remove sticker
      // First delete the gcal event if any
      if (existing.gcal_event_id) {
        await GCAL.deleteEvent(existing.gcal_event_id);
        existing.gcal_event_id = null;
      }
      existing.sticker_emoji = '';
      existing.sticker_color = '';
      existing.sticker_id    = '';
    }
    _calData[dateStr] = existing;

    await sbUpsert('cockpit_calendar', {
      cal_date: dateStr, year: _calYear,
      label: existing.label || '',
      sticker_emoji: existing.sticker_emoji,
      sticker_color: existing.sticker_color,
      note: existing.note || '',
      location: existing.location || '',
      end_date: existing.end_date || null,
      gcal_event_id: existing.gcal_event_id || null
    });

    // Sync to GCal if placing
    if (isPlacing && GCAL.isValid()) {
      const summary = (existing.sticker_emoji ? existing.sticker_emoji + ' ' : '') + (existing.label || _activeSticker.name || 'Cockpit');
      const eventId = await GCAL.createEvent(dateStr, {
        summary,
        note: existing.note || '',
        location: existing.location || '',
        endDate: existing.end_date || null,
        colorId: _activeSticker.gcal_color_id || ''
      });
      if (eventId) {
        existing.gcal_event_id = eventId;
        _calData[dateStr] = existing;
        sbUpsert('cockpit_calendar', { cal_date: dateStr, year: _calYear, gcal_event_id: eventId });
      }
    }

    return renderPage('big-calendar');
  }

  // Full edit modal
  const cellData = _calData[dateStr] || {};
  const stickerOpts = [{value:'', label:'(none)'}].concat(_stickers.map(s => ({
    value: s.id,
    label: (s.emoji||'•') + '  ' + (s.name||'')
  })));

  const r = await openModal({
    title: 'Edit ' + dateStr,
    icon: '&#128197;',
    saveLabel: 'Save',
    deleteLabel: (cellData.label || cellData.sticker_emoji || cellData.note || cellData.location) ? 'Clear day' : null,
    fields: [
      {id:'label',    label:'Label',                    placeholder:'Birthday, meeting, etc.', value:cellData.label||''},
      {id:'sticker',  label:'Sticker',  type:'select',  options:stickerOpts, value:cellData.sticker_id||''},
      {id:'location', label:'Location',                  placeholder:'Tel Aviv',  value:cellData.location||''},
      {id:'endDate',  label:'End Date (optional, for multi-day)', type:'date', value:cellData.end_date||''},
      {id:'note',     label:'Note',     type:'textarea', rows:4, value:cellData.note||''}
    ]
  });

  if (r.action === 'cancel') return;

  // Always delete the prior GCal event so we recreate fresh (simpler than diff/PATCH)
  if (cellData.gcal_event_id) {
    await GCAL.deleteEvent(cellData.gcal_event_id);
    cellData.gcal_event_id = null;
  }

  if (r.action === 'delete') {
    delete _calData[dateStr];
    await sbDelete('cockpit_calendar', 'cal_date=eq.'+dateStr);
    return renderPage('big-calendar');
  }

  const v = r.values;
  const sticker = v.sticker ? _stickers.find(s => s.id === v.sticker) : null;
  const updated = Object.assign({}, cellData, {
    cal_date: dateStr,
    label: v.label || '',
    sticker_id: v.sticker || '',
    sticker_emoji: sticker ? (sticker.emoji||'') : '',
    sticker_color: sticker ? (sticker.color||'') : '',
    location: v.location || '',
    end_date: v.endDate || null,
    note: v.note || '',
    gcal_event_id: null
  });

  // Save to Supabase first
  await sbUpsert('cockpit_calendar', {
    cal_date: dateStr, year: _calYear,
    label: updated.label,
    sticker_emoji: updated.sticker_emoji,
    sticker_color: updated.sticker_color,
    note: updated.note,
    location: updated.location,
    end_date: updated.end_date,
    gcal_event_id: null,
    last_synced_at: new Date().toISOString()
  });

  // Push to GCal if there's content
  if (GCAL.isValid() && (updated.label || updated.sticker_emoji || updated.note)) {
    const summary = (updated.sticker_emoji ? updated.sticker_emoji + ' ' : '') + (updated.label || (sticker && sticker.name) || 'Cockpit');
    const eventId = await GCAL.createEvent(dateStr, {
      summary,
      note: updated.note,
      location: updated.location,
      endDate: updated.end_date,
      colorId: sticker ? (sticker.gcal_color_id||'') : ''
    });
    if (eventId) {
      updated.gcal_event_id = eventId;
      await sbUpsert('cockpit_calendar', { cal_date: dateStr, year: _calYear, gcal_event_id: eventId });
    }
  }

  _calData[dateStr] = updated;
  renderPage('big-calendar');
};

window._smAct = function(action) {
  const ov = document.getElementById('app-modal');
  if (!ov) return;
  let result = null;
  if (action === 'save') {
    result = {
      name:  document.getElementById('sm-name').value.trim(),
      emoji: document.getElementById('sm-emoji').value.trim(),
      color: document.getElementById('sm-color').value,
      gcal:  document.getElementById('sm-gcal').value

  } else if (action === 'delete') {
    result = { _delete: true };

  ov.remove();
  if (_modalResolve) { _modalResolve(result); _modalResolve = null; }
};

function initCalCanvas() {
  const canvas = document.getElementById('cal-draw-canvas');
  const grid = document.getElementById('cal-grid');
  if (!canvas || !grid) return;
  const rect = grid.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
  canvas.classList.add('active');
  const ctx = canvas.getContext('2d');
  let drawing = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', e => {
    drawing = true; lx = e.offsetX; ly = e.offsetY;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    ctx.beginPath();
    ctx.strokeStyle = _drawColor;
    ctx.lineWidth = (e.pressure > 0 ? e.pressure * 5 : 2);
    ctx.moveTo(lx, ly); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
    lx = e.offsetX; ly = e.offsetY;
  });
  canvas.addEventListener('pointerup', () => drawing = false);
  canvas.addEventListener('pointercancel', () => drawing = false);
}

// ══════════════════════════════════════════════════
// FINANCIAL COMPUTATION
// ══════════════════════════════════════════════════
function computeFinancials() {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  const fin = PAGES.finance.data;

  const accounts = fin.accounts || [];
  const debts = fin.debt || [];
  const ri = fin.recurringIncome || [];
  const re = fin.recurringExpenses || [];

  const bankBalance = accounts.reduce((s,a)=>s+(+getEdited('fin.acct.'+a.id+'.balance', a.balance)||0), 0);
  const bankSavings = accounts.reduce((s,a)=>s+(+getEdited('fin.acct.'+a.id+'.savings', a.savings)||0), 0);
  const bankCredit  = accounts.reduce((s,a)=>s+(+getEdited('fin.acct.'+a.id+'.creditLine', a.creditLine)||0), 0);

  // Business income across pages
  const bizPages = ['autoscale','wa-saas','rsvp','crm-saas','construction'];
  let totalBizIncome = 0, totalBizExpense = 0;
  bizPages.forEach(k => {
    const pg = PAGES[k];
    if (pg && pg.data && pg.data.money) {
      totalBizIncome  += getMField(k, y, m, 'income',  pg.data.money.month.income);
      totalBizExpense += getMField(k, y, m, 'expense', pg.data.money.month.expense);
    }
  });

  // Trading P&L this month
  let tradePnl = 0;
  for (let d=1; d<=31; d++) {
    const v = safe.get('cockpit.trade.'+y+'.'+m+'.'+d);
    if (v) tradePnl += parseFloat(v) || 0;
  }

  const totalRI = ri.filter(r=>r.active).reduce((s,r)=>s+(r.amount||0), 0);
  const totalRE = re.filter(r=>r.active).reduce((s,r)=>s+(r.amount||0), 0);

  // Holdings (simplified — use stored values)
  const angelPaper = (_investments||[]).reduce((s,i)=>s+(i.current_value||i.invested||0), 0);
  const reValue = (_properties||[]).reduce((s,p)=>s+(p.current_value||p.value||0), 0);
  const reCashflow = (_properties||[]).reduce((s,p)=>s+(p.monthly_revenue||p.monthlyRev||0)-(p.monthly_expenses||p.monthlyExp||0), 0);

  const totalDebt = debts.reduce((s,d)=>s+(+getEdited('fin.debt.'+d.id+'.balance', d.balance)||0), 0);
  const cashAvail = bankBalance + bankSavings;
  const totalAssets = cashAvail + reValue + angelPaper;
  const netWorth = totalAssets - totalDebt;
  const monthlyNet = totalBizIncome + tradePnl + totalRI + reCashflow - totalBizExpense - totalRE;

  return {
    netWorth, cashAvail, totalAssets, totalDebt, monthlyNet,
    bankBalance, bankSavings, bankCredit,
    totalBizIncome, totalBizExpense, tradePnl,
    totalRI, totalRE, reValue, reCashflow, angelPaper,
    accounts, debts, ri, re
  };
}

function computeRelocationETA() {
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth();
  const currentSav = +getEdited('fin.currentSavings', PAGES.finance.data.currentSavings||0);
  const target = PAGES.finance.data.targetSavings || 30000;
  const mrrTarget = 6000;
  let F;
  try { F = computeFinancials(); } catch(e) { F = { monthlyNet:0, totalBizIncome:0 }; }
  const bizIncome = getMField('autoscale', y, m, 'income', PAGES.autoscale.data.money.month.income);
  let prevY=y, prevM=m-1; if(prevM<0){prevM=11;prevY--;}
  const prevIncome = getMField('autoscale', prevY, prevM, 'income', 0);
  const mrrGrowth = bizIncome - prevIncome;
  const moToSav = F.monthlyNet>0 ? Math.max(0, Math.ceil((target-currentSav)/F.monthlyNet)) : 999;
  const moToMrr = bizIncome>=mrrTarget ? 0 : (mrrGrowth>0 ? Math.ceil((mrrTarget-bizIncome)/mrrGrowth) : 999);
  const moToGo = Math.max(moToSav, moToMrr);
  const constraint = moToSav >= moToMrr ? 'savings' : 'MRR';
  const savPct = Math.min(Math.round((currentSav/target)*100), 100);
  const mrrPct = Math.min(Math.round((bizIncome/mrrTarget)*100), 100);
  return { moToGo, moToSav, moToMrr, constraint, savPct, mrrPct, currentSav, target, bizIncome, mrrTarget };
}

function buildAgentSystemPrompt() {
  let F, E;

    '- Active futures trader on Apex funded accounts\n' +
    '- Building toward relocating to Koh Samui, Thailand when savings >= 30,000 ILS AND MRR >= 6,000 ILS\n' +

    '- Trading P&L (this month): ' + (F.tradePnl>=0?'+':'') + fmtK(Math.round(F.tradePnl)) + ' ILS\n' +
    '- Savings: ' + fmtK(E.currentSav) + ' / 30,000 ILS (' + E.savPct + '%)\n' +
    '- MRR: ' + fmtK(E.bizIncome) + ' / 6,000 ILS (' + E.mrrPct + '%)\n' +

    'INSTRUCTIONS: Be direct, concise, data-driven. Reference actual numbers. Tell him what he needs to hear, not what he wants. Keep replies short.';

function toggleAgent() {
  const panel = document.getElementById('agent-panel');
  agentOpen = !agentOpen;
  panel.style.transform = agentOpen ? 'translateX(0)' : 'translateX(100%)';
  if (agentOpen) setTimeout(() => document.getElementById('agent-input').focus(), 350);
}

async function sendToAgent() {
  if (agentBusy) return;
  const input = document.getElementById('agent-input');
  const msg = input && input.value && input.value.trim();
  if (!msg) return;

  let apiKey = safe.get('cockpit.agent.key');
  if (!apiKey) {
    appendAgentMsg('claude', 'Need an Anthropic API key first. Open Settings \u2192 API Keys.');
    return;
  }

  input.value = '';
  appendAgentMsg('user', msg);
  agentHistory.push({ role: 'user', content: msg });

  agentBusy = true;
  document.getElementById('agent-send').disabled = true;
  const thinkId = appendAgentMsg('claude', '...', true);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        system: buildAgentSystemPrompt(),
        messages: agentHistory
      })
    });
    if (res.status === 401) { safe.del('cockpit.agent.key'); throw new Error('Invalid API key. Cleared — try again.'); }
    if (!res.ok) throw new Error('API error '+res.status);
    const data = await res.json();
    const reply = (data.content && data.content[0] && data.content[0].text) || '(No response)';
    removeAgentMsg(thinkId);
    appendAgentMsg('claude', reply);
    agentHistory.push({ role: 'assistant', content: reply });
    if (agentHistory.length > 20) agentHistory = agentHistory.slice(-20);
  } catch(e) {
    removeAgentMsg(thinkId);
    appendAgentMsg('claude', '\u26A0\uFE0F ' + e.message);
  } finally {
    agentBusy = false;
    document.getElementById('agent-send').disabled = false;
  }
}

function appendAgentMsg(role, text, isThinking) {
  const msgs = document.getElementById('agent-msgs');
  if (!msgs) return null;
  const id = 'amsg-' + Date.now() + Math.random();
  const div = document.createElement('div');
  div.id = id;
  const isUser = role === 'user';
  const bg = isUser ? 'var(--cyan)' : 'var(--bg-elev)';
  const color = isUser ? '#060912' : 'var(--text-1)';
  const align = isUser ? 'flex-end' : 'flex-start';
  div.style.cssText = 'max-width:90%;align-self:'+align;
  div.innerHTML = '<div style="padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55;background:'+bg+';color:'+color+';white-space:pre-wrap'+(isThinking?';opacity:0.5':'')+'">'+escapeHtml(text)+'</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}
function removeAgentMsg(id) { const el = id && document.getElementById(id); if (el) el.remove(); }

const mainEl = document.getElementById('main');

function switchPane(pane, btn) {
  document.querySelectorAll('.side-tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-pane').forEach(el => el.classList.remove('open'));
  if (btn) btn.classList.add('active');
  else {
    const target = document.querySelector('.side-tab[data-pane="'+pane+'"]');
    if (target) target.classList.add('active');
  }
  const p = document.getElementById('pane-'+pane);
  if (p) p.classList.add('open');
  safe.set('cockpit.pane', pane);
}

function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const workPages = ['autoscale','wa-saas','rsvp','crm-saas','construction','trading','holdings','angel','real-estate','finance'];
  const lifePages = ['life-overview','health','skills','bike-build','relocation','big-calendar'];
  if (workPages.indexOf(page) >= 0) switchPane('work');
  else if (lifePages.indexOf(page) >= 0) switchPane('life');
  renderPage(page);
}

function renderPage(key) {
  safe.set('cockpit.page', key);
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === key));
  const page = PAGES[key] || placeholderPage(key);
  const pm = getPM(key);

  let html = '<div class="page-head"><div class="page-head-left">';
  html += '<div class="page-arm-strip '+page.arm+'"></div>';
  html += '<div class="page-title">'+page.title+'</div>';
  html += '<div class="page-sub">'+page.sub+'</div></div>';
  html += '<div class="page-edit-hint">Tap any number to edit</div></div>';

  page.sections.forEach(s => {
    if (s === 'attention')        html += renderAttention(page.data.attention, key);
    else if (s === 'money')       html += renderMoney(page.data.money, key, pm.y, pm.m);
    else if (s === 'sources')     html += renderSources(page.data.sources, key, pm.y, pm.m);
    else if (s === 'projects')    html += renderProjectsSection(page.data.projects, key);
    else if (s === 'big-calendar') html += renderBigCalendar();
    else if (s === 'cockpit-overview') html += renderCockpitOverview();
    else if (s === 'finance')     html += renderFinanceHub();
    else if (s === 'holdings')    html += renderHoldings();
    else if (s === 'angel')       html += renderAngel();
    else if (s === 'real-estate') html += renderRealEstate();
    else if (s === 'trading-overview') html += renderTradingOverview();
    else if (s === 'connections') html += renderConnections();
    else if (s === 'life-overview') html += renderLifeOverview();
    else if (s === 'empty')       html += renderEmptyState(page.title);
  });

  mainEl.innerHTML = html;
  if (key === 'big-calendar' && _drawMode) setTimeout(initCalCanvas, 50);
  wireEditables();
}

function renderLifeOverview() {
  const E = computeRelocationETA();
  let html = renderRelocationETA();
  html += '<div class="section-h"><span><span class="num">01</span>Quick Access</span><div class="line"></div></div>';
  html += '<div class="attention">' +
    '<div class="att cyan" onclick="navigate(\'big-calendar\')" style="cursor:pointer"><div class="att-num">\u{1F4C5}</div><div class="att-label">Big A$ Calendar</div></div>' +
    '<div class="att tech" onclick="navigate(\'health\')" style="cursor:pointer"><div class="att-num">\u2764</div><div class="att-label">Health</div></div>' +
    '<div class="att good" onclick="navigate(\'skills\')" style="cursor:pointer"><div class="att-num">\u2691</div><div class="att-label">Skills</div></div>' +
    '<div class="att warn" onclick="navigate(\'relocation\')" style="cursor:pointer"><div class="att-num">\u2708</div><div class="att-label">Relocation</div></div>' +
    '</div>';
  return html;
}

function wireEditables() {
  mainEl.querySelectorAll('.editable').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (el.classList.contains('editing')) return;
      startEdit(el);
    });
  });
}
function startEdit(el) {
  const key = el.dataset.editKey;
  const orig = el.dataset.editNum;
  const cur = el.querySelector('.cur');
  const curHtml = cur ? cur.outerHTML : '';
  el.classList.add('editing');
  el.innerHTML = '<input type="text" value="'+orig+'" style="width:'+Math.max(el.offsetWidth-24,50)+'px;background:transparent;border:none;outline:none;color:var(--cyan);font:inherit;font-weight:inherit;letter-spacing:inherit">'+curHtml;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();
  const commit = () => {
    const raw = inp.value.replace(/,/g,'').replace(/\s/g,'').trim();
    setEdited(key, raw === '' ? '0' : raw);
    el.classList.remove('editing');
    renderPage(safe.get('cockpit.page') || 'autoscale');
  };
  const cancel = () => { el.classList.remove('editing'); el.innerHTML = fmt(orig) + curHtml; };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter')  { ev.preventDefault(); inp.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
  });
}

// CLOCK
// ══════════════════════════════════════════════════
function tick() {
  const now = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ct = document.getElementById('clock-time');
  const cd = document.getElementById('clock-date');
  if (ct) ct.textContent = pad2(now.getHours())+':'+pad2(now.getMinutes());
  if (cd) cd.textContent = days[now.getDay()]+' \u00B7 '+pad2(now.getDate())+' '+months[now.getMonth()];
}

// ══════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════
async function bootApp() {
  // Handle GCal OAuth redirect FIRST (before anything else)
  GCAL.handleRedirect();

  // Render saved page from cache
  const savedPane = safe.get('cockpit.pane') || 'work';
  const savedPage = safe.get('cockpit.page') || 'cockpit-overview';
  switchPane(savedPane);
  navigate(savedPage);

  // Hydrate from Supabase
  await loadAllData();
  navigate(safe.get('cockpit.page') || savedPage);

  // Start GCal auto-sync (every 5 min)
  setInterval(() => { if (GCAL.isValid()) GCAL.pullChanges(); }, 5 * 60 * 1000);

  // If just authenticated, immediately pull
  if (GCAL.isValid()) GCAL.pullChanges();

  // Clock
  tick();
  setInterval(tick, 30000);
}

// Start: auth first, then boot
AUTH.init().then(bootApp);
