function macroRing(label, cur, target, color, unit) {
  const pct = target > 0 ? Math.min(Math.round((cur/target)*100), 100) : 0;
  const r = 34, cx = 44, cy = 44, sw = 8, size = 88;
  const circ = 2 * Math.PI * r;
  const dash = (pct / 100) * circ;
  const off = circ * 0.25;
  return `<div class="macro-item">
    <div class="macro-ring">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2236" stroke-width="${sw}"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
        <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700" font-family="Inter,sans-serif">${cur}</text>
        <text x="${cx}" y="${cy+9}" text-anchor="middle" fill="#64748b" font-size="7.5" font-family="JetBrains Mono,monospace">${unit}</text>
      </svg>
    </div>
    <div class="macro-label">${label}</div>
    <div style="font-size:9px;color:${color};font-family:var(--mono)">${pct}% · /${target}${unit}</div>
  </div>`;
}

// ── Finance Hub ─────────────────────────────────────
function renderFinanceHub(data) {
  const rate = data.usdToIls || 3.7;

  // Aggregate accounts
  const accounts = (data.accounts || []).map(a => {
    const b = +getEdited(`fin.acct.${a.id}.balance`, a.balance);
    const s = +getEdited(`fin.acct.${a.id}.savings`, a.savings);
    const cl = +getEdited(`fin.acct.${a.id}.creditLine`, a.creditLine);
    const card = +getEdited(`fin.acct.${a.id}.cardLimit`, a.cardLimit);
    return { ...a, balance:b, savings:s, creditLine:cl, cardLimit:card };
  });
  const cashArr = data.cash || [];

  const totalBalance  = accounts.reduce((s,a) => s+a.balance, 0);
  const totalSavings  = accounts.reduce((s,a) => s+a.savings, 0);
  const totalCreditLines = accounts.reduce((s,a) => s+a.creditLine, 0);
  const totalCardLimits  = accounts.reduce((s,a) => s+a.cardLimit, 0);
  const totalCash = cashArr.reduce((s,c) => s + (c.currency==='ILS'?c.amount : c.amount*rate), 0);

  const spendingPower = totalBalance + totalCreditLines + totalCardLimits;
  const cashAvailable = totalBalance + totalCash;

  // Debt
  const debts = (data.debt || []);
  const totalDebt = debts.reduce((s,d) => s + +getEdited(`fin.debt.${d.id}.balance`, d.balance), 0);

  // From holdings/real estate (manual approximation)
  const holdingsApprox = 0; // user enters in holdings page
  const reApprox = 0; // user enters in real estate

  // Net worth = cash + savings + (enter assets manually) - debt
  const manualAssets = +getEdited('fin.manualAssets', 0);
  const netWorth = totalBalance + totalSavings + totalCash + manualAssets - totalDebt;

  // Recurring
  const recurInc = (data.recurringIncome || []).map(r => ({ ...r, amount: +getEdited(`fin.ri.${r.id}.amount`, r.amount) }));
  const recurExp = (data.recurringExpenses || []).map(r => ({ ...r, amount: +getEdited(`fin.re.${r.id}.amount`, r.amount) }));
  const totalRI = recurInc.filter(r => r.active).reduce((s,r) => s+r.amount, 0);
  const totalRE = recurExp.filter(r => r.active).reduce((s,r) => s+r.amount, 0);
  const monthlyNet = totalRI - totalRE;

  // Projection
  const currentSav = +getEdited('fin.currentSavings', data.currentSavings || 0);
  const target = data.targetSavings || 30000;
  const projData = [];
  const now2 = new Date();
  let bal = currentSav;
  for (let i = 0; i < 13; i++) {
    const d = new Date(now2.getFullYear(), now2.getMonth() + i, 1);
    projData.push({ month: d.getMonth(), balance: Math.round(bal) });
    bal += monthlyNet;
  }

  let html = `
  <div class="fin-hero">
    <div class="fin-kpi primary">
      <div class="fin-kpi-num">${fmt(Math.round(netWorth))}₪</div>
      <div class="fin-kpi-label">Net Worth</div>
      <div class="fin-kpi-sub">Cash + Savings + Assets − Debt</div>
    </div>
    <div class="fin-kpi">
      <div class="fin-kpi-num good">${fmt(Math.round(cashAvailable))}₪</div>
      <div class="fin-kpi-label">Cash Available</div>
      <div class="fin-kpi-sub">Balances + physical cash</div>
    </div>
    <div class="fin-kpi">
      <div class="fin-kpi-num">${fmt(Math.round(spendingPower))}₪</div>
      <div class="fin-kpi-label">Spending Power</div>
      <div class="fin-kpi-sub">Cash + credit lines + cards</div>
    </div>
  </div>`;

  // Finance signal bar
  const runway = totalRE > 0 ? Math.round((totalBalance + totalSavings) / totalRE) : 99;
  const runwayCls = runway >= 6 ? 'good' : runway >= 3 ? 'warn' : 'bad';
  const netCls2 = monthlyNet > 0 ? 'good' : monthlyNet > -500 ? 'warn' : 'bad';
  const moToTarget = monthlyNet > 0 ? Math.max(0, Math.ceil((target - currentSav) / monthlyNet)) : 999;
  const targetCls = moToTarget <= 12 ? 'good' : moToTarget <= 24 ? 'warn' : 'bad';
  html += `<div class="signal-bar">
    <div class="signal ${netCls2}"><div class="sig-dot"></div>${monthlyNet >= 0 ? '+' : ''}${fmtK(monthlyNet)}₪/mo net</div>
    <span class="signal-sep">·</span>
    <div class="signal ${runwayCls}"><div class="sig-dot"></div>${runway < 99 ? runway+'mo runway' : 'Runway OK'}</div>
    <span class="signal-sep">·</span>
    <div class="signal ${targetCls}"><div class="sig-dot"></div>${moToTarget < 999 ? moToTarget+'mo to 30k target' : 'Add income to project'}</div>
  </div>`;

  // Additional assets note
  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--text-2)">
    <span style="color:var(--text-3);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.12em">Assets (crypto/stocks/RE · manual):</span>
    <span class="editable" data-edit-key="fin.manualAssets" data-edit-num="${manualAssets}" style="font-size:14px;font-weight:700;color:var(--cyan)">${fmt(manualAssets)}</span><span style="color:var(--text-3);font-size:11px">₪</span>
  </div>`;

  // ACCOUNTS
  html += `<div class="section-h"><span><span class="num">01</span>Accounts</span><div class="line"></div><span class="meta">BALANCE ${fmt(totalBalance)}₪ · SAVINGS ${fmt(totalSavings)}₪</span></div>
    <div class="accounts-grid">`;
  accounts.forEach(a => {
    html += `<div class="acct-row">
      <div class="acct-cell"><div class="acct-cell-label">Bank</div><div class="acct-cell-val">${a.bank}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Balance</div><div class="acct-cell-val">${renderEditable(`fin.acct.${a.id}.balance`, a.balance, {cur:'₪'})}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Savings</div><div class="acct-cell-val good">${renderEditable(`fin.acct.${a.id}.savings`, a.savings, {cur:'₪'})}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Credit Line</div><div class="acct-cell-val cyan">${renderEditable(`fin.acct.${a.id}.creditLine`, a.creditLine, {cur:'₪'})}</div></div>
      <div class="acct-cell"><div class="acct-cell-label">Card Limit</div><div class="acct-cell-val">${renderEditable(`fin.acct.${a.id}.cardLimit`, a.cardLimit, {cur:'₪'})}</div></div>
      <div class="acct-cell"><button class="acct-del-btn" onclick="delAccount('${a.id}')">×</button></div>
    </div>`;
  });
  html += `<button class="acct-add-btn" onclick="addAccount()">+ Add bank account</button></div>`;

  // DEBT
  html += `<div class="section-h"><span><span class="num">02</span>Debt</span><div class="line"></div><span class="meta">TOTAL ${fmt(totalDebt)}₪</span></div>
    <div class="debt-list">`;
  debts.forEach(d => {
    const balance = +getEdited(`fin.debt.${d.id}.balance`, d.balance);
    const paidPct = d.originalBalance > 0 ? Math.round(((d.originalBalance - balance) / d.originalBalance) * 100) : 0;
    const yrsLeft = Math.round(d.monthsRemaining / 12 * 10) / 10;
    html += `<div class="debt-row">
      <div class="debt-top">
        <div class="debt-name">${d.name}</div>
        ${d.property ? `<div class="debt-tag">${d.property}</div>` : ''}
      </div>
      <div class="debt-nums">
        <div class="debt-num-item"><div class="debt-num-label">Remaining</div><div class="debt-num-val bad">${renderEditable(`fin.debt.${d.id}.balance`, d.balance, {cur:'₪'})}</div></div>
        <div class="debt-num-item"><div class="debt-num-label">Monthly</div><div class="debt-num-val">${fmt(d.monthly)}₪</div></div>
        <div class="debt-num-item"><div class="debt-num-label">Rate</div><div class="debt-num-val">${d.ratePercent}%</div></div>
        <div class="debt-num-item"><div class="debt-num-label">Remaining</div><div class="debt-num-val">${yrsLeft}yr</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="debt-timeline" style="flex:1"><div class="debt-paid" style="width:${paidPct}%"></div></div>
        <span style="font-size:10px;color:var(--good);font-family:var(--mono)">${paidPct}% paid</span>
      </div>
    </div>`;
  });
  html += `<button class="acct-add-btn" onclick="addDebt()">+ Add debt / loan</button></div>`;

  // RECURRING
  html += `<div class="section-h"><span><span class="num">03</span>Recurring</span><div class="line"></div><span class="meta">NET ${monthlyNet>=0?'+':''}${fmt(monthlyNet)}₪/MO</span></div>
    <div class="recur-grid">
      <div class="recur-block">
        <div class="recur-head"><div class="recur-title">Income</div><div class="recur-total income-t">+${fmt(totalRI)}₪/mo</div></div>`;
  recurInc.forEach(r => {
    html += `<div class="recur-item">
      <span class="recur-item-name">${r.name}</span>
      <span class="recur-item-freq">${r.frequency}</span>
      <span class="recur-item-amt">${renderEditable(`fin.ri.${r.id}.amount`, r.amount, {cur:'₪'})}</span>
      <button class="recur-del" onclick="delRecur('income','${r.id}')">×</button>
    </div>`;
  });
  html += `<button class="recur-add" onclick="addRecur('income')">+ Add recurring income</button></div>
      <div class="recur-block">
        <div class="recur-head"><div class="recur-title">Expenses</div><div class="recur-total expense-t">−${fmt(totalRE)}₪/mo</div></div>`;
  recurExp.forEach(r => {
    html += `<div class="recur-item">
      <span class="recur-item-name">${r.name}${r.fromDebt?' 🔗':''}</span>
      <span class="recur-item-freq">${r.frequency}</span>
      <span class="recur-item-amt">${renderEditable(`fin.re.${r.id}.amount`, r.amount, {cur:'₪'})}</span>
      <button class="recur-del" onclick="delRecur('expense','${r.id}')">×</button>
    </div>`;
  });
  html += `<button class="recur-add" onclick="addRecur('expense')">+ Add recurring expense</button></div>
    </div>`;

  // PROJECTION CHART
  const maxProjVal = Math.max(...projData.map(p => p.balance), target, 1);
  const minProjVal = Math.min(...projData.map(p => p.balance), 0);
  const projRange = maxProjVal - minProjVal || 1;
  const W2 = 520, H2 = 110, pL = 55, pR = 10, pT = 14, pB = 22;
  const cW = W2 - pL - pR, cH = H2 - pT - pB;
  const toX2 = i => pL + (i / (projData.length-1)) * cW;
  const toY2 = v => pT + cH - ((v - minProjVal) / projRange) * cH;
  const pts2 = projData.map((d,i) => `${toX2(i).toFixed(1)},${toY2(d.balance).toFixed(1)}`).join(' ');
  const targetY2 = toY2(target);
  const areaBottom = pT + cH;

  let projSvg = `<svg viewBox="0 0 ${W2} ${H2}" width="100%" style="display:block">`;
  [0,0.25,0.5,0.75,1].forEach(t => {
    const y = pT + t*cH;
    const v = Math.round(maxProjVal - t*projRange);
    projSvg += `<line x1="${pL}" y1="${y.toFixed(1)}" x2="${W2-pR}" y2="${y.toFixed(1)}" stroke="#0f1626" stroke-width="1"/>`;
    projSvg += `<text x="${pL-3}" y="${(y+3.5).toFixed(1)}" text-anchor="end" fill="#64748b" font-size="8" font-family="JetBrains Mono,monospace">${fmtK(v)}₪</text>`;
  });
  if (target > minProjVal && target < maxProjVal) {
    projSvg += `<line x1="${pL}" y1="${targetY2.toFixed(1)}" x2="${W2-pR}" y2="${targetY2.toFixed(1)}" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5 3"/>`;
    projSvg += `<text x="${W2-pR+2}" y="${(targetY2+3.5).toFixed(1)}" fill="#fbbf24" font-size="7.5" font-family="JetBrains Mono,monospace">30k</text>`;
  }
  projSvg += `<polygon points="${pL},${areaBottom} ${pts2} ${(W2-pR).toFixed(1)},${areaBottom}" fill="rgba(56,189,248,0.06)" stroke="none"/>`;
  projSvg += `<polyline points="${pts2}" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  projData.forEach((d,i) => {
    if (i % 4 === 0 || i === projData.length-1) {
      projSvg += `<circle cx="${toX2(i).toFixed(1)}" cy="${toY2(d.balance).toFixed(1)}" r="3" fill="#38bdf8"/>`;
      projSvg += `<text x="${toX2(i).toFixed(1)}" y="${H2-4}" text-anchor="middle" fill="#64748b" font-size="8" font-family="JetBrains Mono,monospace">${MSHORT[d.month]}</text>`;
    }
  });
  projSvg += `</svg>`;

  html += `<div class="section-h"><span><span class="num">04</span>12-Month Projection</span><div class="line"></div><span class="meta">NET ${monthlyNet>=0?'+':''}${fmtK(monthlyNet)}₪/MO</span></div>
    <div class="proj-chart-wrap">
      <div class="proj-chart-head">
        <div class="proj-chart-title">Savings Trajectory</div>
        <div class="proj-legend">
          <div class="proj-legend-item"><div class="proj-legend-line" style="background:#38bdf8"></div>Balance</div>
          <div class="proj-legend-item"><div class="proj-legend-line" style="background:transparent;border-top:2px dashed #fbbf24"></div>30k target</div>
        </div>
      </div>
      ${projSvg}
      <div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
        <span style="font-size:10px;color:var(--text-3);font-family:var(--mono)">Current savings basis:</span>
        <span class="editable" data-edit-key="fin.currentSavings" data-edit-num="${currentSav}" style="font-size:12px;font-weight:600;color:var(--cyan)">${fmt(currentSav)}</span>
        <span style="font-size:10px;color:var(--text-3);font-family:var(--mono)">₪ · Hit target in ~${monthlyNet > 0 ? Math.max(0,Math.ceil((target-currentSav)/monthlyNet)) : '∞'} months</span>
      </div>
    </div>`;

  return html;
}

// Finance action handlers
window.addAccount = function() {
  const name = prompt('Bank name:');
  if (!name) return;
  const balance = +(prompt('Current balance (₪):') || 0);
  const savings = +(prompt('Savings balance (₪):') || 0);
  const cl = +(prompt('Credit line (₪):') || 0);
  const card = +(prompt('Card limit (₪):') || 0);
  const id = 'acct-'+Date.now();
  PAGES['finance'].data.accounts.push({id, bank:name, balance, savings, creditLine:cl, cardLimit:card});
  renderPage('finance');
};
window.delAccount = function(id) {
  PAGES['finance'].data.accounts = PAGES['finance'].data.accounts.filter(a => a.id !== id);
  renderPage('finance');
};
window.addDebt = function() {
  const name = prompt('Debt name (e.g. Mortgage, Car loan):');
  if (!name) return;
  const balance    = +(prompt('Current balance (₪):') || 0);
  const monthly    = +(prompt('Monthly payment (₪):') || 0);
  const months     = +(prompt('Months remaining:') || 0);
  const rate       = +(prompt('Interest rate (%):') || 0);
  const property   = prompt('Linked property (optional):') || '';
  const id = 'd-'+Date.now();
  PAGES['finance'].data.debt.push({id, name, balance, originalBalance:balance, monthly, monthsRemaining:months, ratePercent:rate, property});
  if (monthly > 0) PAGES['finance'].data.recurringExpenses.push({id:'re-'+id, name, amount:monthly, frequency:'monthly', active:true, fromDebt:true});
  renderPage('finance');
};
window.addRecur = function(type) {
  const name = prompt(`${type==='income'?'Income':'Expense'} name:`);
  if (!name) return;
  const amount = +(prompt('Amount (₪):') || 0);
  const frequency = prompt('Frequency (monthly/quarterly/annual):') || 'monthly';
  const id = (type==='income'?'ri-':'re-')+Date.now();
  if (type==='income') PAGES['finance'].data.recurringIncome.push({id, name, amount, frequency, active:true});
  else PAGES['finance'].data.recurringExpenses.push({id, name, amount, frequency, active:true, fromDebt:false});
  renderPage('finance');
};
window.delRecur = function(type, id) {
  if (type==='income') PAGES['finance'].data.recurringIncome = PAGES['finance'].data.recurringIncome.filter(r => r.id !== id);
  else PAGES['finance'].data.recurringExpenses = PAGES['finance'].data.recurringExpenses.filter(r => r.id !== id);
  renderPage('finance');
};
const mainEl  = document.getElementById('main');
const railEl  = document.getElementById('rail');
const crumbEl = document.getElementById('crumbs');

function renderPage(key) {
  const page = PAGES[key] || placeholderPage(key.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), 'tech','Placeholder');
  const pm = getPM(key);

  crumbEl.innerHTML = `<span>${page.armLabel.startsWith('Life')?'Life':'Work'}</span><span class="sep">/</span><span class="arm-tag ${page.arm}">${page.armLabel}</span><span class="sep">/</span><span class="here">${page.title}</span>`;

  let html = `<div class="page-head"><div class="page-head-left"><div class="page-arm-strip ${page.arm}"></div><div class="page-title">${page.title}</div><div class="page-sub">${page.sub}</div></div><div class="page-edit-hint">Tap any number to edit</div></div>`;

  page.sections.forEach(s => {
    if (s === 'attention')   html += renderAttention(page.data.attention, key);
    if (s === 'charts')      html += renderChartsSection(key, pm.y, pm.m, page.data.sources, page.data.money);
    if (s === 'money')       html += renderMoney(page.data.money, key, pm.y, pm.m);
    if (s === 'sources')     html += renderSources(page.data.sources, key, pm.y, pm.m);
    if (s === 'projects')    html += renderProjects(page.data.projects, key);
    if (s === 'trading-cal') html += renderTradingCalendar(key, pm.y, pm.m);
    if (s === 'holdings')    html += renderHoldings(page.data, key);
    if (s === 'angel')       html += renderAngel(page.data, key);
    if (s === 'real-estate') html += renderRealEstate(page.data, key);
    if (s === 'life-overview') html += renderLifeOverview();
    if (s === 'skills-hub')  html += renderSkillsHub(page.data);
    if (s === 'relocation')  html += renderRelocation(page.data);
    if (s === 'bike-build')  html += renderBikeBuild();
    if (s === 'health')      html += renderHealth();
    if (s === 'finance')     html += renderFinanceHub(page.data);
    if (s === 'empty')       html += renderEmptyState(page.title);
  });

  mainEl.innerHTML = html;
  railEl.innerHTML = renderRail(page.data.rail);

  // Save bars
  mainEl.querySelectorAll('.save-bar').forEach(bar => {
    const n = parseInt(bar.dataset.save, 10) || 0;
    let h = '';
    for (let i = 0; i < 10; i++) h += `<div class="save-seg${i<n?' fill':''}"></div>`;
    bar.innerHTML = h;
  });

  wireEditables();
  safe.set('cockpit.page', key);
}

// ── Editables ────────────────────────────────────────
function wireEditables() {
  mainEl.querySelectorAll('.editable').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (el.classList.contains('editing')) return;
      startEdit(el);
    });
  });
}

function startEdit(el) {
  const key = el.dataset.editKey;
  const orig = el.dataset.editNum;
  const cur = el.querySelector('.cur');
  const curHtml = cur ? cur.outerHTML : '';
  el.classList.add('editing');
  el.innerHTML = `<input type="text" value="${orig}" style="width:${Math.max(el.offsetWidth-24,50)}px;background:transparent;border:none;outline:none;color:var(--cyan);font:inherit;font-weight:inherit;letter-spacing:inherit">${curHtml}`;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();

  function commit() {
    const raw = inp.value.replace(/[, ]/g,'').trim();
    const num = raw === '' ? '0' : raw;
    setEdited(key, num);
    el.classList.remove('editing');
    renderPage(safe.get('cockpit.page') || 'autoscale');
  }
  function cancel() {
    el.classList.remove('editing');
    el.innerHTML = fmt(orig) + curHtml;
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter')  { ev.preventDefault(); inp.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
  });
}

// ── Nav wiring ───────────────────────────────────────
function wireNav() {
  document.querySelectorAll('.side-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const which = tab.dataset.tab;
      document.querySelectorAll('.side-tab').forEach(t => t.classList.toggle('active', t===tab));
      document.querySelectorAll('.nav-pane').forEach(p => { p.style.display = p.dataset.pane===which ? '' : 'none'; });
      safe.set('cockpit.tab', which);
      const first = document.querySelector(`.nav-pane[data-pane="${which}"] .nav-item`);
      if (first) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); first.classList.add('active'); renderPage(first.dataset.page); }
    });
  });

  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      renderPage(item.dataset.page);
    });
  });

  document.querySelectorAll('.folder').forEach(f => {
    f.addEventListener('click', () => f.classList.toggle('collapsed'));
  });
}

// ── Clock ────────────────────────────────────────────
function pad(n) { return n.toString().padStart(2,'0'); }
function tick() {
  const now = new Date();
  document.getElementById('clock-time').textContent = pad(now.getHours())+':'+pad(now.getMinutes());
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock-date').textContent = days[now.getDay()]+' · '+pad(now.getDate())+' '+months[now.getMonth()];
}
tick();
setInterval(tick, 30000);

// ── Init ─────────────────────────────────────────────
wireNav();
const savedTab  = safe.get('cockpit.tab') || 'work';
if (savedTab !== 'work') { document.querySelector(`.side-tab[data-tab="${savedTab}"]`).click(); }
const savedPage = safe.get('cockpit.page') || 'autoscale';
const startEl   = document.querySelector(`.nav-item[data-page="${savedPage}"]`);
document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
if (startEl) { startEl.classList.add('active'); renderPage(savedPage); }
else renderPage('autoscale');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
