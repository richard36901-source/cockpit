  .nav-section-label { font-size: 8px; padding: 6px 9px 2px; }
  .nav-item { padding: 6px 9px; font-size: 11px; gap: 7px; }
  .side-bottom { padding: 7px; }
  .side-settings-btn { padding: 7px 9px; font-size: 11px; }

  /* Topbar */
  .topbar { margin: 8px 8px 0 0; padding: 0 12px; gap: 8px; border-radius: 14px; }
  .pill { height: 26px; padding: 0 9px; font-size: 10px; border-radius: 8px; }
  .agent-open-btn { height: 26px; padding: 0 11px; font-size: 10.5px; border-radius: 8px; }
  .review-btn { height: 26px; padding: 0 11px; font-size: 10px; border-radius: 8px; }

  /* Main — limited height, scroll only inside if absolutely needed */
  .main {
    margin: 0 8px 8px 0;
    padding: 12px 16px 14px;
    border-radius: 16px;
    overflow-y: auto;
    height: calc(100vh - 64px);
  }

  /* Page head — much tighter */
  .page-head {
    padding-bottom: 9px;
    margin-bottom: 12px;
    gap: 10px;
  }
  .page-arm-strip { width: 26px; height: 2px; }
  .page-title { font-size: clamp(16px,1.5vw,20px); }
  .page-sub { font-size: 10.5px; margin-top: 2px; }
  .page-edit-hint { font-size: 9px; padding: 4px 8px; }

  /* Section headers — very compact */
  .section-h {
    margin: 12px 0 8px;
    font-size: 8.5px;
    gap: 10px;
  }
  .section-h:first-of-type { margin-top: 0; }

  /* Attention grid — tighter cards */
  .attention { gap: 8px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .att { padding: 11px 13px; border-radius: 12px; }
  .att-num { font-size: clamp(15px,1.5vw,22px); }
  .att-label { font-size: 9px; margin-top: 7px; letter-spacing: 0.10em; }
  .att-detail { font-size: 9.5px; margin-top: 2px; }

  /* Sources */
  .sources { gap: 7px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .src { padding: 10px 12px; border-radius: 11px; }
  .src-label { font-size: 8.5px; margin-bottom: 5px; }
  .src-num { font-size: 16px; }
  .src-meta { font-size: 9.5px; margin-top: 4px; }

  /* Money cards */
  .money-grid { gap: 10px; }
  .money-card { padding: 14px 16px; border-radius: 14px; }
  .money-head { margin-bottom: 11px; }
  .money-period { font-size: 12px; }
  .money-tag { font-size: 8px; }
  .money-rows { gap: 10px; padding-bottom: 10px; margin-bottom: 10px; }
  .row-label { font-size: 8.5px; margin-bottom: 4px; }
  .row-val { font-size: clamp(13px,1.3vw,19px); }
  .net-num { font-size: clamp(22px,2.5vw,40px); }
  .net-tag-label { font-size: 8.5px; }
  .net-tag-val { font-size: 11px; }

  /* Trading calendar — compact */
  .tcal-wrap { padding: 11px 13px; margin-bottom: 10px; border-radius: 12px; }
  .tcal-head { gap: 8px; margin-bottom: 9px; }
  .tcal-month-label { font-size: 14px; }
  .tcal-month-label small { font-size: 8.5px; }
  .tcal-nav-btn { width: 26px; height: 26px; font-size: 12px; border-radius: 7px; }
  .tcal-pnl-badge { padding: 6px 12px; border-radius: 9px; }
  .tcal-pnl-num { font-size: 15px; }
  .tcal-pnl-sub { font-size: 8px; }
  .tcal-grid { gap: 3px; }
  .tcal-dow { font-size: 8px; padding: 2px 1px 4px; }
  .tcal-cell { min-height: 56px; padding: 5px 6px; border-radius: 7px; }
  .tcal-day-num { font-size: 9.5px; }
  .tcal-cell-pnl { font-size: 11.5px; }
  .tcal-trade-count { font-size: 8px; margin-top: 2px; }

  /* Trading dashboard KPIs */
  .tz-grid { gap: 7px; margin-bottom: 11px; }
  .tz-card { padding: 11px 13px; border-radius: 11px; }
  .tz-val { font-size: 17px; margin-bottom: 3px; }
  .tz-label { font-size: 8px; }
  .tz-sub { font-size: 9px; margin-top: 2px; }
  .eq-curve-big { height: 92px; border-radius: 11px; margin-bottom: 11px; }

  /* Rules analytics + setup list */
  .rules-analytics { border-radius: 11px; margin-bottom: 11px; }
  .ra-head { padding: 10px 14px; }
  .ra-title { font-size: 9.5px; }
  .ra-row { padding: 7px 14px; font-size: 10.5px; gap: 5px; }
  .ra-row.ra-header { font-size: 8px; padding: 6px 14px; }
  .dow-grid { gap: 4px; margin-bottom: 11px; }
  .dow-card { padding: 8px 6px; border-radius: 9px; }
  .dow-label { font-size: 8px; margin-bottom: 4px; }
  .dow-val { font-size: 11px; }
  .dow-n { font-size: 8px; margin-top: 2px; }
  .setup-list { gap: 5px; margin-bottom: 11px; }
  .setup-row { padding: 7px 12px; border-radius: 9px; gap: 9px; }
  .setup-name { font-size: 11px; }
  .setup-stats { font-size: 9px; gap: 9px; }

  /* Trade log */
  .trade-log { border-radius: 11px; margin-bottom: 10px; }
  .trade-log-head { padding: 10px 14px; }
  .trade-log-title { font-size: 9.5px; }
  .trade-table th { padding: 6px 11px; font-size: 8px; }
  .trade-table td { padding: 7px 11px; font-size: 10.5px; }

  /* Holdings */
  .port-total { padding: 13px 16px; margin-bottom: 11px; border-radius: 14px; gap: 11px; }
  .pt-pill { padding: 6px 9px; border-radius: 9px; }
  .pt-pill-label { font-size: 8px; }
  .pt-pill-val { font-size: 11.5px; }
  .hld-sections { gap: 10px; }
  .hld-block { border-radius: 11px; }
  .hld-head { padding: 9px 14px; }
  .hld-title { font-size: 9.5px; }
  .hld-htotal { font-size: 10.5px; }
  .hld-table th { padding: 6px 12px; font-size: 8px; }
  .hld-table td { padding: 8px 12px; font-size: 10.5px; }
  .hld-add { margin: 9px 12px; height: 28px; padding: 0 11px; font-size: 10px; }

  /* Angel + Real Estate */
  .angel-grid, .prop-grid { gap: 8px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .angel-card, .prop-card { padding: 13px 15px; border-radius: 12px; }
  .angel-name, .prop-name { font-size: 12px; margin-bottom: 4px; }
  .angel-row, .prop-row { font-size: 10.5px; margin-top: 5px; }

  /* Modals + connections */
  .modal-box { padding: 22px 24px; border-radius: 18px; }
  .modal-title { font-size: 16px; margin-bottom: 18px; }
  .modal-field { margin-bottom: 12px; }
  .modal-label { font-size: 8.5px; margin-bottom: 5px; }
  .modal-input { font-size: 12.5px; padding: 9px 12px; border-radius: 9px; }
  .modal-actions { gap: 7px; margin-top: 18px; }
  .modal-btn { height: 38px; font-size: 12px; border-radius: 9px; }

  .conn-grid { gap: 9px; margin-bottom: 14px; grid-template-columns: 1fr 1fr; }
  .conn-card { padding: 14px; border-radius: 13px; }
  .conn-logo { width: 34px; height: 34px; font-size: 16px; border-radius: 9px; }
  .conn-name { font-size: 12.5px; }
  .conn-status { font-size: 9.5px; }
  .conn-desc { font-size: 10.5px; margin-bottom: 11px; line-height: 1.5; }
  .conn-input { font-size: 11px; padding: 7px 11px; }
  .conn-btn { height: 30px; padding: 0 13px; font-size: 10.5px; }

  /* Calendar tighter on iPad */
  .cal-cell { min-height: 88px; padding: 5px 5px 6px; }
  .cal-day-num { font-size: 9.5px; }
  .cal-sticker-display { font-size: 18px; }
  .cal-label-display { font-size: 9.5px; margin-top: 3px; }
  .cal-mcell { min-height: 100px; padding: 6px 8px 8px; }
  .cal-mday-num { font-size: 12px; }
  .cal-mlabel { font-size: 11px; }
  .cal-mnote { font-size: 9.5px; }

  /* Insight card more compact */
  .insight-card { padding: 13px 17px; margin-bottom: 14px; gap: 11px; }
  .insight-avatar { width: 30px; height: 30px; font-size: 13px; }
  .insight-label { font-size: 8.5px; margin-bottom: 5px; }
  .insight-text { font-size: 12.5px; line-height: 1.55; }
  .insight-actions { margin-top: 10px; }
  .insight-ask { height: 28px; padding: 0 13px; font-size: 10.5px; }
}

/* iPad PORTRAIT (834×1194) — more vertical room, slightly less compaction */
@media (min-width: 800px) and (max-width: 900px) and (orientation: portrait) {
  :root { --sidebar-w: 0px; }
  .side { display: none; }
  .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
}


/* iPad / mobile: prevent double-tap zoom and rubber-band scrolling */
html, body {
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
input, textarea, select, [contenteditable="true"], .editable {
  -webkit-user-select: text;
  user-select: text;
  touch-action: auto;
}

/* ── COLLAPSIBLE SIDEBAR ── */
.side-collapse-btn {
  position: absolute; top: 18px; right: 10px;
  width: 22px; height: 22px;
  border-radius: 7px;
  background: var(--glass-2); border: 1px solid var(--stroke-2);
  color: var(--text-3); cursor: pointer;
  font-size: 11px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.16s ease;
  z-index: 10;
  box-shadow: var(--hl-top);
}
.side-collapse-btn:hover { color: var(--cyan); border-color: rgba(56,189,248,0.40); }

.app.sidebar-collapsed { grid-template-columns: 56px 1fr; }
.app.sidebar-collapsed .side { padding: 0; }
.app.sidebar-collapsed .side-logo { padding: 14px 0; justify-content: center; }
.app.sidebar-collapsed .side-logo-name,
.app.sidebar-collapsed .side-logo-sub,
.app.sidebar-collapsed .side-tabs,
.app.sidebar-collapsed .nav-pane,
.app.sidebar-collapsed .side-bottom { display: none; }
.app.sidebar-collapsed .side-collapse-btn { right: 50%; transform: translateX(50%); top: 60px; }
.app.sidebar-collapsed .side-logo { cursor: pointer; }

/* Mini icon-row for collapsed mode */
.side-mini {
  display: none;
  flex-direction: column;
  gap: 6px;
  padding: 12px 8px;
}
.app.sidebar-collapsed .side-mini { display: flex; }
.side-mini-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: all 0.16s ease;
}
.side-mini-btn:hover { background: var(--glass-2); color: var(--text-1); border-color: var(--stroke-2); }
.side-mini-btn.active { background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(56,189,248,0.06)); border-color: rgba(56,189,248,0.30); color: var(--cyan); }


/* Day-of-week mini label inside each year-view cell */
.cal-day-head {
  display: flex;
  align-items: baseline;
  gap: 5px;
  align-self: flex-start;
  line-height: 1;
}
.cal-dow-mini {
  font-size: 8.5px;
  color: var(--text-3);
  font-family: var(--mono);
  letter-spacing: 0.06em;
  font-weight: 700;
  opacity: 0.50;
}
.cal-cell.has-sticker .cal-dow-mini { opacity: 0.75; }
.cal-cell.weekend .cal-dow-mini { color: var(--violet); opacity: 0.55; }
.cal-cell.today-cell .cal-dow-mini { color: var(--cyan); opacity: 0.95; }
/* iPad scale */
@media (min-width: 1024px) and (max-width: 1300px) and (max-height: 900px),
       (min-width: 800px) and (max-width: 1300px) and (orientation: landscape) {
  .cal-dow-mini { font-size: 7.5px; gap: 4px; }
}


/* Ensure iPad never scrolls the outer page — only the .main can scroll if needed */
@media (min-width: 800px) and (max-width: 1300px) {
  html, body {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden !important;
    position: fixed;
    width: 100%;
  }
  .app {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }
  .main {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
}


/* Fullscreen calendar */
.cal-grid-wrap:fullscreen,
.cal-grid-wrap:-webkit-full-screen {
  background: #0a0d18;
  padding: 24px;
  overflow: auto;
  border-radius: 0;
}
.cal-grid-wrap:fullscreen .cal-grid,
.cal-grid-wrap:fullscreen .cal-month-grid,
.cal-grid-wrap:-webkit-full-screen .cal-grid,
.cal-grid-wrap:-webkit-full-screen .cal-month-grid { margin: 0; }

.cal-fs-exit {
  position: fixed; top: 16px; right: 16px;
  z-index: 9999;
  height: 38px; padding: 0 16px;
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 11px;
  color: #fff; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: var(--mono);
  letter-spacing: 0.04em;
  display: none;
}
:fullscreen .cal-fs-exit,
:-webkit-full-screen .cal-fs-exit { display: flex; align-items: center; gap: 7px; }

/* Eraser cursor & active state */
#cal-draw-canvas.eraser-mode { cursor: cell; }
.cal-draw-btn.tool-active {
  background: linear-gradient(135deg, rgba(251,146,60,0.20), rgba(251,146,60,0.10));
  border-color: rgba(251,146,60,0.40);
  color: #fb923c;
}

/* Save indicator (small toast) */
.cal-save-toast {
  position: absolute; top: 8px; right: 8px;
  z-index: 300;
  padding: 6px 11px;
  background: rgba(74,222,128,0.18);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(74,222,128,0.40);
  border-radius: 9px;
  color: var(--good);
  font-size: 10px; font-weight: 600;
  font-family: var(--mono);
  letter-spacing: 0.06em;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.18s ease, transform 0.18s ease;
  pointer-events: none;
}
.cal-save-toast.show { opacity: 1; transform: translateY(0); }


/* ── Stacked event pills (multi-entry calendar style, like Google/Yearful) ── */
.cal-evt-stack {
  display: flex; flex-direction: column;
  gap: 2px;
  margin-top: 3px;
  width: 100%;
  pointer-events: auto;
}
.cal-evt-pill {
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
  cursor: pointer;
  text-shadow: 0 1px 2px rgba(0,0,0,0.30);
  transition: filter 0.15s ease;
  display: flex; align-items: center; gap: 4px;
}
.cal-evt-pill:hover { filter: brightness(1.15); }
.cal-evt-pill.continuation { opacity: 0.65; font-style: italic; }
.cal-evt-pill .ep-emoji { font-size: 11px; flex-shrink: 0; }
.cal-evt-pill .ep-text { overflow: hidden; text-overflow: ellipsis; }
.cal-evt-more {
  font-size: 9px;
  color: var(--text-3);
  font-family: var(--mono);
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 1px 4px;
  cursor: pointer;
}
.cal-evt-more:hover { color: var(--cyan); }

/* Drag-to-select highlight */
.cal-cell.drag-highlight,
.cal-mcell.drag-highlight {
  background: rgba(56,189,248,0.16) !important;
  border-color: rgba(56,189,248,0.55) !important;
  box-shadow: 0 0 0 1px rgba(56,189,248,0.35);
}

/* Sticker counts footer */
.sticker-counts-bar {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 12px 14px;
  margin-top: 12px;
  background: var(--glass-1);
  backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--stroke-2);
  border-radius: 12px;
  box-shadow: var(--hl-top);
}
.sc-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  background: var(--glass-2);
  border: 1px solid var(--stroke-2);
  border-radius: 9px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.16s ease;
  font-family: var(--mono);
}
.sc-pill:hover { background: var(--glass-3); }
.sc-pill.hidden { opacity: 0.40; text-decoration: line-through; }
.sc-pill .sc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.sc-pill .sc-name { color: var(--text-2); }
.sc-pill .sc-count { color: var(--text-1); font-weight: 700; margin-left: 2px; }

</style>
</head>

// ── Formatting helpers ─────────────────────────────
function fmt(n) {
  if (n === null || n === undefined || n === '') return '0';
  if (typeof n === 'string') return n;
  return n.toLocaleString('en-US');
}
function fmtK(n) {
  n = +n;
  if (Math.abs(n) >= 10000) return (n/1000).toFixed(0)+'k';
  if (Math.abs(n) >= 1000)  return (n/1000).toFixed(1)+'k';
  return String(Math.round(n));
}
function pad2(n) { return String(n).padStart(2,'0'); }
function nextDayStr(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');

  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function syncKeyToSupabase(key, val) {
  const monthMatch = key.match(/^([^.]+)\.(\d{4})\.(\d+)\.(income|expense|expected|delayed|ytd_income|ytd_expense)$/);
  if (monthMatch) {
    const row = { page_key: monthMatch[1], year: +monthMatch[2], month: +monthMatch[3] };
    row[monthMatch[4]] = +val;
    sbUpsert('cockpit_monthly', row); return;
  }
  const srcMatch = key.match(/^([^.]+)\.(\d{4})\.(\d+)\.src\.(.+)$/);
  if (srcMatch) {
    sbUpsert('cockpit_sources', { page_key:srcMatch[1], year:+srcMatch[2], month:+srcMatch[3], source_label:srcMatch[4], amount:+val });
    return;
  }
  const skillMatch = key.match(/^skill\.(.+)\.pct$/);
  if (skillMatch) { sbUpsert('cockpit_skills', { skill_name: skillMatch[1], pct: +val }); return; }
  if (key === 'bike.pct') { sbPatch('cockpit_bike_build','id=gt.0',{pct:+val}); return; }
}

// GOOGLE CALENDAR — bidirectional sync
// ══════════════════════════════════════════════════
const GCAL_COLORS = [
  {id:'1', name:'Lavender', color:'#7986CB'},
  {id:'2', name:'Sage',     color:'#33B679'},
  {id:'3', name:'Grape',    color:'#8E24AA'},

];

const GCAL = {
  get token()    { return safe.get('gcal.token'); },
  get expires()  { return parseInt(safe.get('gcal.tokenExpires')||'0'); },
  get calId()    { return safe.get('gcal.calId'); },
  get lastSync() { return safe.get('gcal.lastSync'); },

  isValid() { return this.token && Date.now() < this.expires; },

  authUrl() {
    const clientId = safe.get('conn.gcal.clientId');
    if (!clientId) return null;
    const redirect = location.origin + location.pathname;
    const scope = 'https://www.googleapis.com/auth/calendar';
    return 'https://accounts.google.com/o/oauth2/v2/auth' +
      '?client_id=' + encodeURIComponent(clientId) +
      '&redirect_uri=' + encodeURIComponent(redirect) +
      '&response_type=token' +
      '&scope=' + encodeURIComponent(scope) +
      '&include_granted_scopes=true' +
      '&prompt=consent';
  },

  // Handle OAuth redirect (token comes back in URL hash)
  handleRedirect() {
    if (!location.hash || location.hash.indexOf('access_token=') < 0) return false;
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('access_token');
    if (!token) return false;
    const expiresIn = parseInt(params.get('expires_in')||'3600');
    safe.set('gcal.token', token);
    safe.set('gcal.tokenExpires', String(Date.now() + expiresIn * 1000 - 60000));
    history.replaceState(null, '', location.pathname + location.search);
    // Fire-and-forget calendar setup
    this.ensureCalendar().then(()=>{ this.pullChanges(); });
    return true;
  },

  async ensureCalendar() {
    if (!this.isValid()) return null;
    if (this.calId) return this.calId;
    try {
      const list = await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList', {
        headers: { 'Authorization': 'Bearer '+this.token }
      });
      if (list.ok) {
        const data = await list.json();
        const found = (data.items||[]).find(c => c.summary === 'Cockpit RTHQ');
        if (found) { safe.set('gcal.calId', found.id); return found.id; }
      }
      const r = await fetch('https://www.googleapis.com/calendar/v3/calendars', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer '+this.token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ summary: 'Cockpit RTHQ', description: 'Synced from Cockpit RTHQ dashboard', timeZone: 'Asia/Jerusalem' })
      });
      if (r.ok) { const cal = await r.json(); safe.set('gcal.calId', cal.id); return cal.id; }
    } catch(e) { console.error('GCAL ensureCalendar:', e); }
    return null;
  },

  async createEvent(dateStr, payload) {
    if (!this.isValid() || !this.calId) return null;
    const body = {
      summary: payload.summary || 'Cockpit',
      description: payload.note || '',
      location: payload.location || '',
      start: { date: dateStr },
      end:   { date: payload.endDate ? nextDayStr(payload.endDate) : nextDayStr(dateStr) }
    };
    if (payload.colorId) body.colorId = payload.colorId;
    try {
      const r = await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(this.calId)+'/events', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer '+this.token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (r.ok) { const ev = await r.json(); return ev.id; }
    } catch(e) { console.error('GCAL createEvent:', e); }
    return null;
  },

  async deleteEvent(eventId) {
    if (!this.isValid() || !this.calId || !eventId) return;
    try {
      await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(this.calId)+'/events/'+encodeURIComponent(eventId), {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer '+this.token }
      });
    } catch(e) { console.error('GCAL deleteEvent:', e); }
  },

  async pullChanges() {
    if (!this.isValid() || !this.calId) return;
    let url = 'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(this.calId)+'/events?singleEvents=true&maxResults=250&showDeleted=true';
    if (this.lastSync) url += '&updatedMin=' + encodeURIComponent(this.lastSync);
    try {
      const r = await fetch(url, { headers: { 'Authorization': 'Bearer '+this.token } });
      if (!r.ok) return;
      const data = await r.json();
      for (const ev of (data.items||[])) {
        if (!ev.start || !ev.start.date) continue; // only all-day
        const dateStr = ev.start.date;
        if (ev.status === 'cancelled') {
          // Remove any local cell that referenced this event
          Object.keys(_calData).forEach(k => {
            if (_calData[k].gcal_event_id === ev.id) {
              delete _calData[k];
              sbDelete('cockpit_calendar', 'cal_date=eq.'+k);
            }
          });
          continue;
        }
        const existing = _calData[dateStr] || {};
        existing.label    = ev.summary || existing.label || '';
        existing.note     = ev.description || existing.note || '';
        existing.location = ev.location || existing.location || '';
        existing.end_date = (ev.end && ev.end.date && ev.end.date !== nextDayStr(dateStr)) ? ev.end.date : existing.end_date || null;
        existing.gcal_event_id = ev.id;
        _calData[dateStr] = existing;
        await sbUpsert('cockpit_calendar', {
          cal_date: dateStr, year: parseInt(dateStr.slice(0,4)),
          label: existing.label,
          sticker_emoji: existing.sticker_emoji||'',
          sticker_color: existing.sticker_color||'',
          note: existing.note,
          location: existing.location,
          end_date: existing.end_date,
          gcal_event_id: existing.gcal_event_id,
          last_synced_at: new Date().toISOString()
        });
      }
      safe.set('gcal.lastSync', new Date().toISOString());
      if (safe.get('cockpit.page') === 'big-calendar') renderPage('big-calendar');
    } catch(e) { console.error('GCAL pullChanges:', e); }
  }
};
window.GCAL = GCAL;

const AUTH = {
  isLocked: false, _timer: null, TIMEOUT: 2*60*1000,

  async init() {
    const h = safe.get('cockpit.auth.hash');

    this._bindActivity();

  _strength(pwd) {
    const checks = {
      length:  pwd.length >= 12,
      upper:   pwd !== pwd.toLowerCase(),
      lower:   pwd !== pwd.toUpperCase(),
      number:  '0123456789'.split('').some(c => pwd.includes(c)),
      special: '!@#$%^&*()_+-=[]{}|;:,.<>?'.split('').some(c => pwd.includes(c))
    };
    const score = Object.values(checks).filter(Boolean).length;
    const colors = ['','#ef4444','#f59e0b','#38bdf8','#4ade80','#4ade80'];
    const pcts   = [0, 20, 45, 70, 90, 100];
    return { checks, score, color: colors[score]||'#ef4444', pct: pcts[score]||0 };
  },

  async setup() { this._showSetupUI(); },

  _showSetupUI() {
    document.getElementById('lock-screen').style.display = 'flex';
    document.getElementById('lock-form-area').style.display = 'none';
    document.getElementById('lock-change-pwd').style.display = 'block';
    this._showNewPwdStep(true);
  },

  async _hash(pwd) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cockpit-rthq-2026-' + pwd));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  },

  lock() {
    this.isLocked = true;
    clearTimeout(this._timer);
    document.getElementById('lock-screen').style.display = 'flex';
    this._showMain();
    const credId = safe.get('cockpit.auth.credId');
    if (credId && window.PublicKeyCredential) {
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(ok => {
        const btn = document.getElementById('lock-bio-btn');
        if (btn) btn.style.display = 'block';
        if (ok && !this._bioShown) {
          this._bioShown = true;
          setTimeout(() => this.tryBiometric(true), 300);
        }
      });
    }
    setTimeout(() => { const el = document.getElementById('lock-input'); if (el) el.focus(); }, 350);
  },

  _showMain() {
    document.getElementById('lock-form-area').style.display = 'block';
    document.getElementById('lock-change-pwd').style.display = 'none';
    document.getElementById('lock-error').textContent = '';
    document.getElementById('lock-attempts').textContent = '';
  },

  unlock() {
    this.isLocked = false;
    this._bioShown = false;
    this._attempts = 0;
    clearTimeout(this._timer);
    clearInterval(this._cdTimer);
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-error').textContent = '';
    this.resetTimer();
  },

  resetTimer() { clearTimeout(this._timer); this._timer = setTimeout(() => this.lock(), this.TIMEOUT); },

  _bindActivity() {
    ['click','touchstart','keydown','scroll'].forEach(e =>
      document.addEventListener(e, () => { if (!this.isLocked) this.resetTimer(); }, {passive:true})
    );
  },

  async tryUnlock() {
    if (this._lockedUntil && Date.now() < this._lockedUntil) {
      const rem = Math.ceil((this._lockedUntil - Date.now()) / 1000);
      document.getElementById('lock-error').textContent = 'Too many attempts — wait ' + rem + 's';
      return;
    }
    const inp = document.getElementById('lock-input');
    if (!inp || !inp.value) return;
    const h = await this._hash(inp.value);
    if (h === safe.get('cockpit.auth.hash')) this.unlock();
    else {
      this._attempts++;
      inp.value = ''; inp.focus();
      if (this._attempts >= 5) {
        this._lockedUntil = Date.now() + 30000;
        this._attempts = 0;
        this._startCountdown(30);
      } else {
        document.getElementById('lock-error').textContent = 'Wrong password (' + this._attempts + '/5)';
      }
    }
  },

  _startCountdown(secs) {
    let rem = secs;
    clearInterval(this._cdTimer);
    document.getElementById('lock-error').textContent = 'Too many attempts';
    document.getElementById('lock-attempts').textContent = 'Try again in ' + rem + 's';
    this._cdTimer = setInterval(() => {
      rem--;
      document.getElementById('lock-attempts').textContent = rem > 0 ? 'Try again in ' + rem + 's' : '';
      if (rem <= 0) clearInterval(this._cdTimer);
    }, 1000);
  },

  async tryBiometric(auto) {
    const stored = safe.get('cockpit.auth.credId');
    if (!stored) { await this._registerBio(); return; }
    try {
      const credId = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
      const a = await navigator.credentials.get({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{type:'public-key', id: credId}],
        userVerification: 'required', timeout: 30000
      }});
      if (a) this.unlock();
    } catch(e) {
      if (!auto) document.getElementById('lock-error').textContent = 'Biometric failed';
    }
  },

  async _registerBio() {
    try {
      const c = await navigator.credentials.create({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: {name:'Cockpit RTHQ', id: location.hostname},
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'richard@cockpit', displayName: 'Richard' },
        pubKeyCredParams: [{type:'public-key', alg:-7},{type:'public-key', alg:-257}],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }});
      if (c) {
        safe.set('cockpit.auth.credId', btoa(String.fromCharCode.apply(null, new Uint8Array(c.rawId))));
        this.unlock();
      }
    } catch(e) {}
  },

  toggleReveal() {
    const inp = document.getElementById('lock-input');
    if (!inp) return;
    inp.type = inp.type === 'password' ? 'text' : 'password';
  },

  showChangePassword() {
    document.getElementById('lock-form-area').style.display = 'none';
    document.getElementById('lock-change-pwd').style.display = 'block';
    this._showVerifyStep();
  },

  cancelChangePassword() { this._showMain(); },

  _showVerifyStep() {
    const panel = document.getElementById('lock-change-pwd');
    const hash = safe.get('cockpit.auth.hash');
    panel.innerHTML = '<button class="pwd-back" onclick="AUTH.cancelChangePassword()">&larr; Back</button>' +
      (hash ? '<input class="pwd-input" type="password" id="cp-current" placeholder="Current password" onkeydown="if(event.keyCode===13)AUTH._verifyCurrentPwd()">' : '') +
      '<div id="cp-err" style="color:#f87171;font-size:12px;font-family:var(--mono);min-height:18px;text-align:center"></div>' +
      '<button class="lock-btn" onclick="AUTH._verifyCurrentPwd()">' + (hash ? 'Verify' : 'Set Password') + '</button>';
    if (!hash) { setTimeout(() => this._showNewPwdStep(true), 50); return; }
    setTimeout(() => { const el = document.getElementById('cp-current'); if (el) el.focus(); }, 100);
  },

  async _verifyCurrentPwd() {
    const inp = document.getElementById('cp-current');
    if (!inp || !inp.value) { document.getElementById('cp-err').textContent = 'Enter current password'; return; }
    const h = await this._hash(inp.value);
    if (h !== safe.get('cockpit.auth.hash')) {
      document.getElementById('cp-err').textContent = 'Wrong password';
      inp.value = ''; inp.focus(); return;
    }
    this._showNewPwdStep(false);
  },

  _showNewPwdStep(isSetup) {
    const panel = document.getElementById('lock-change-pwd');
    panel.innerHTML = (isSetup ? '' : '<button class="pwd-back" onclick="AUTH._showVerifyStep()">&larr; Back</button>') +
      '<div style="text-align:center;margin-bottom:18px;font-size:11px;color:rgba(255,255,255,0.3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.1em">' + (isSetup ? 'Create your password' : 'New Password') + '</div>' +
      '<input class="pwd-input" type="password" id="cp-new" placeholder="New password (12+ chars)" oninput="AUTH._onNewPwdInput(this.value)" onkeydown="if(event.keyCode===13)AUTH._confirmNewPwd()">' +
      '<div class="pwd-strength-bar"><div class="pwd-strength-fill" id="pwd-strength-fill"></div></div>' +
      '<div class="pwd-reqs">' +
        '<div class="pwd-req unmet" id="preq-length">&#10007; 12+ characters</div>' +
        '<div class="pwd-req unmet" id="preq-upper">&#10007; Uppercase letter</div>' +
        '<div class="pwd-req unmet" id="preq-lower">&#10007; Lowercase letter</div>' +
        '<div class="pwd-req unmet" id="preq-number">&#10007; Number</div>' +
        '<div class="pwd-req unmet" id="preq-special">&#10007; Special character</div>' +
      '</div>' +
      '<input class="pwd-input" type="password" id="cp-confirm" placeholder="Confirm password" onkeydown="if(event.keyCode===13)AUTH._confirmNewPwd()">' +
      '<div id="cp-err2" style="color:#f87171;font-size:12px;font-family:var(--mono);min-height:18px;text-align:center"></div>' +
      '<button class="lock-btn" id="pwd-save-btn" onclick="AUTH._confirmNewPwd()" style="opacity:0.4;cursor:not-allowed">' + (isSetup ? 'Create Password' : 'Save Password') + '</button>';
    setTimeout(() => { const el = document.getElementById('cp-new'); if (el) el.focus(); }, 100);
  },

  _onNewPwdInput(val) {
    const s = this._strength(val);
    const fill = document.getElementById('pwd-strength-fill');
    if (fill) { fill.style.width = s.pct + '%'; fill.style.background = s.color; }
    const reqMap = {length:'preq-length', upper:'preq-upper', lower:'preq-lower', number:'preq-number', special:'preq-special'};
    const labels = {length:'12+ characters', upper:'Uppercase letter', lower:'Lowercase letter', number:'Number', special:'Special character'};
    Object.entries(s.checks).forEach(([key, met]) => {
      const el = document.getElementById(reqMap[key]);
      if (!el) return;
      el.className = 'pwd-req ' + (met ? 'met' : 'unmet');
      el.innerHTML = (met ? '&#10003;' : '&#10007;') + ' ' + labels[key];
    });
    const saveBtn = document.getElementById('pwd-save-btn');
    if (saveBtn) {
      const isStrong = s.score >= 4;
      saveBtn.style.opacity = isStrong ? '1' : '0.4';
      saveBtn.style.cursor = isStrong ? 'pointer' : 'not-allowed';
    }
  },

  async _confirmNewPwd() {
    const newPwd = document.getElementById('cp-new').value || '';
    const confirm = document.getElementById('cp-confirm').value || '';
    const errEl = document.getElementById('cp-err2');
    const s = this._strength(newPwd);
    if (s.score < 4) { errEl.textContent = 'Password not strong enough'; return; }
    if (newPwd !== confirm) { errEl.textContent = 'Passwords do not match'; return; }
    const h = await this._hash(newPwd);
    safe.set('cockpit.auth.hash', h);
    safe.del('cockpit.auth.credId');
    document.getElementById('lock-change-pwd').innerHTML = '<div style="text-align:center;padding:20px;font-size:32px">&#10003;</div><div style="text-align:center;color:var(--good);font-size:16px;font-weight:700">Password saved</div>';
    setTimeout(() => { if (!safe.get('cockpit.auth.hash')) this._showSetupUI(); else this.unlock(); }, 1500);
  }
};
window.AUTH = AUTH;

async function loadAllData() {
  showLoadingOverlay(true);
  try {
    // Resilient: each table failure returns [] instead of breaking the whole load
    const safeGet = (table, q) => sbGet(table, q || '').catch(err => {
      console.warn('Table missing or RLS denied:', table, err && err.message ? err.message : '');
      return [];
    });
    const [monthly, sources, trades, skills, notes, accounts, debt, recurring,
           holdings, investments, properties, config, clients, pipeline,
           tradeEntries, weeklyReviews, projectsData, tradeRulesData,
           calData, stickerData, constructionJobs] = await Promise.all([
      safeGet('cockpit_monthly'),
      safeGet('cockpit_sources'),
      safeGet('cockpit_trade_days'),
      safeGet('cockpit_skills'),
      safeGet('cockpit_notes'),
      safeGet('cockpit_bank_accounts','?order=sort_order'),
      safeGet('cockpit_debt'),
      safeGet('cockpit_recurring','?order=sort_order'),
      safeGet('cockpit_holdings','?order=asset_type,sort_order'),
      safeGet('cockpit_investments','?order=created_at'),
      safeGet('cockpit_properties','?order=created_at'),
      safeGet('cockpit_config'),
      safeGet('cockpit_clients','?order=created_at'),
      safeGet('cockpit_pipeline','?order=created_at'),
      safeGet('cockpit_trades','?order=trade_date.desc&limit=100'),
      safeGet('cockpit_weekly_reviews','?order=week_start.desc&limit=12'),
      safeGet('cockpit_projects','?order=page_key,sort_order'),
      safeGet('cockpit_trade_rules','?order=sort_order'),
      safeGet('cockpit_calendar','?order=cal_date&limit=500'),
      safeGet('cockpit_stickers','?order=sort_order'),
      safeGet('cockpit_construction_jobs','?order=created_at')
    ]);

    monthly.forEach(r => {
      const prefix = 'cockpit.val.'+r.page_key+'.'+r.year+'.'+r.month;
      ['income','expense','expected','delayed'].forEach(f => {
        if (r[f] != null) safe.set(prefix+'.'+f, r[f]);
      });
    });
    sources.forEach(r => safe.set('cockpit.val.'+r.page_key+'.'+r.year+'.'+r.month+'.src.'+r.source_label, r.amount));
    skills.forEach(r => safe.set('cockpit.val.skill.'+r.skill_name+'.pct', r.pct));
    notes.forEach(r => safe.set('cockpit.note.'+r.note_key, r.content));
    trades.forEach(r => {
      const d = new Date(r.trade_date);
      safe.set('cockpit.trade.'+d.getFullYear()+'.'+d.getMonth()+'.'+d.getDate(), r.pnl);
    });

    if (accounts.length) PAGES.finance.data.accounts = accounts.map(a => ({id:a.id, bank:a.bank_name, balance:a.balance, savings:a.savings, creditLine:a.credit_line, cardLimit:a.card_limit}));
    if (debt.length) PAGES.finance.data.debt = debt.map(d => ({id:d.id, name:d.name, balance:d.balance, originalBalance:d.original_balance, monthly:d.monthly_payment, ratePercent:d.rate_percent, monthsRemaining:d.months_remaining, property:d.property_link||''}));
    // Hydrate holdings into PAGES.holdings.data
    PAGES.holdings.data.crypto = holdings.filter(h => h.asset_type==='crypto').map(h => ({id:h.id, symbol:h.symbol, name:h.name, amount:+h.amount||0, price:+h.price_usd||0, change:+h.change_pct||0, currency:h.currency||'USD'}));
    PAGES.holdings.data.stocks = holdings.filter(h => h.asset_type==='stock').map(h => ({id:h.id, symbol:h.symbol, name:h.name, shares:+h.amount||0, price:+h.price_usd||0, change:+h.change_pct||0, currency:h.currency||'USD'}));
    PAGES.holdings.data.cash   = holdings.filter(h => h.asset_type==='cash').map(h => ({id:h.id, currency:h.symbol, amount:+h.amount||0}));
    PAGES.finance.data.recurringIncome   = recurring.filter(r=>r.type==='income').map(r=>({id:r.id, name:r.name, amount:r.amount, frequency:r.frequency, active:r.active}));
    PAGES.finance.data.recurringExpenses = recurring.filter(r=>r.type==='expense').map(r=>({id:r.id, name:r.name, amount:r.amount, frequency:r.frequency, active:r.active, fromDebt:r.from_debt}));
    config.forEach(r => {
      if (r.key === 'target_savings') PAGES.finance.data.targetSavings = +r.value;
      if (r.key === 'current_savings') PAGES.finance.data.currentSavings = +r.value;
    });

    _projects     = projectsData;
    _tradeRules   = tradeRulesData;
    _investments  = investments;
    _properties   = properties;
    _stickers     = stickerData;
    _clients      = clients;
    _pipeline     = pipeline;
    _trades       = tradeEntries;
    _weeklyReviews= weeklyReviews;

    _constructionJobs = constructionJobs || [];
    _calData = {};
    (calData||[]).forEach(r => {
      if (!_calData[r.cal_date]) _calData[r.cal_date] = [];
      _calData[r.cal_date].push(r);
    });

  } catch(e) { console.error('loadAllData:', e); }
  showLoadingOverlay(false);
}

function showLoadingOverlay(show) {
  let el = document.getElementById('load-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'load-overlay';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(6,9,18,0.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:12px';
    el.innerHTML = '<div style="width:32px;height:32px;border:2px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite"></div><div style="font-family:JetBrains Mono,monospace;font-size:11px;color:#64748b;letter-spacing:0.12em">LOADING DATA</div>';
    document.body.appendChild(el);
    const s = document.createElement('style'); s.textContent = '@keyframes spin{to{transform:rotate(360deg)}}'; document.head.appendChild(s);
  }
  el.style.display = show ? 'flex' : 'none';
}

function mKey(page, y, m, field) { return page+'.'+y+'.'+m+'.'+field; }
function getMField(page, y, m, field, def) {
  const now = new Date();
  const isNow = y === now.getFullYear() && m === now.getMonth();
  const stored = safe.get('cockpit.val.' + mKey(page, y, m, field));
  if (stored !== null) return +stored;
  return isNow ? (def || 0) : 0;
}

function renderEditable(key, value, opts) {
  opts = opts || {};
  const v = getEdited(key, value);
  const cur = opts.cur ? '<span class="cur">'+opts.cur+'</span>' : '';
  return '<span class="editable" data-edit-key="'+key+'" data-edit-num="'+v+'">'+fmt(v)+cur+'</span>';
}

function renderEmptyState(title) {
  return '<div class="empty-state"><div class="empty-state-icon">&#9676;</div><div class="empty-state-title">'+title+'</div><div class="empty-state-sub">Configure this page to see data here.</div></div>';
}

function renderAttention(items, pageKey) {
  if (!items || !items.length) return '';
  let html = '<div class="section-h"><span><span class="num alert">!</span>Needs Attention</span><div class="line"></div><span class="meta">'+items.length+' ITEMS</span></div><div class="attention">';
  items.forEach((it, i) => {
    html += '<div class="att '+(it.kind||'')+'"><div class="att-num">'+renderEditable(pageKey+'.att.'+i+'.num', it.num, {cur:it.cur})+'</div><div class="att-label">'+it.label+'</div><div class="att-detail">'+(it.detail||'')+'</div></div>';
  });
  return html + '</div>';
}

function renderMoney(money, pageKey, y, m) {
  const incK = mKey(pageKey, y, m, 'income');
  const expK = mKey(pageKey, y, m, 'expense');
  const expX = mKey(pageKey, y, m, 'expected');
  const expD = mKey(pageKey, y, m, 'delayed');
  const now = new Date();
  const isNow = y === now.getFullYear() && m === now.getMonth();
  const defI = isNow ? money.month.income : 0;
  const defE = isNow ? money.month.expense : 0;
  const defX = isNow ? (money.month.expected||0) : 0;
  const defD = isNow ? (money.month.delayed||0) : 0;
  const income = +getEdited(incK, defI);
  const expense = +getEdited(expK, defE);
  const net = income - expense;
  const savePct = income > 0 ? Math.round(net / income * 100) : 0;

  return '<div class="month-nav"><button class="mnav-btn" onclick="navMonth(-1)">&lsaquo;</button><span class="mnav-label">'+MNAMES[m]+' '+y+'</span><button class="mnav-btn" onclick="navMonth(1)">&rsaquo;</button></div>' +
    '<div class="section-h"><span><span class="num">01</span>Money</span><div class="line"></div><span class="meta">'+MNAMES[m].toUpperCase()+' '+y+'</span></div>' +
    '<div class="money-grid">' +
    '<div class="money-card hero">' +
      '<div class="money-head"><div class="money-period">'+MNAMES[m]+' <span class="scope">· '+y+'</span></div></div>' +
      '<div class="money-rows four">' +
        '<div><div class="row-label">Income</div><div class="row-val income">'+renderEditable(incK, defI, {cur:'\u20AA'})+'</div></div>' +
        '<div><div class="row-label">Expenses</div><div class="row-val expense">'+renderEditable(expK, defE, {cur:'\u20AA'})+'</div></div>' +
        '<div><div class="row-label">Expected</div><div class="row-val expected">'+renderEditable(expX, defX, {cur:'\u20AA'})+'</div></div>' +
        '<div><div class="row-label">Delayed</div><div class="row-val delayed">'+renderEditable(expD, defD, {cur:'\u20AA'})+'</div></div>' +
      '</div>' +
      '<div class="net-row"><div class="net-num">'+fmt(net)+'<span class="cur">\u20AA</span></div><div class="net-tag"><div class="net-tag-label">Net</div><div class="net-tag-val" style="color:'+(savePct>=0?'var(--good)':'var(--bad)')+'">'+(savePct>=0?'+':'')+savePct+'%</div></div></div>' +

      {id:'name', label:'Name', value:p?p.name:''},
      {id:'pct', label:'Progress %', type:'number', min:0, max:100, value:p?p.pct:0},
      {id:'status', label:'Status', type:'select', options:[
        {value:'active',label:'Active'},{value:'risk',label:'At Risk'},{value:'idle',label:'Idle'},{value:'done',label:'Done'}
      ], value:p?p.status:'active'},
      {id:'tasks', label:'Tasks note', value:p?p.tasks:''},
      {id:'ddl', label:'Deadline', value:p?p.deadline:''}
    ]
  });
  if (r.action==='cancel') return;
  if (r.action==='delete' && id) {
    _projects = _projects.filter(x=>x.id!==id);
    sbDelete('cockpit_projects','id=eq.'+id);
    return renderPage(pageKey);
  }
  const v = r.values;
  const row = { page_key: pageKey, name: v.name, pct: +v.pct||0, status: v.status, tasks: v.tasks, deadline: v.ddl, is_urgent: false };

  } else {
    _projects.push(Object.assign({},row,{id:'tmp-'+Date.now()}));
    sbUpsert('cockpit_projects', row);
  }
  renderPage(pageKey);
};

function renderYearGrid() {
  const year = _calYear;
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + pad2(today.getMonth() + 1) + '-' + pad2(today.getDate());

  const multiDaySet = buildMultiDaySet();

  let h = '<div class="cal-grid" style="grid-template-columns:90px repeat(31,minmax(58px,1fr))">';
  // No header row of numbers — day numbers are inside each cell

  for (let m = 0; m < 12; m++) {
    const maxDay = daysInMonth(year, m);
    h += '<div class="cal-month-name" onclick="calJumpToMonth(' + m + ')" title="Click to view this month">' + MONTHS_SHORT[m] + '</div>';
    for (let day = 1; day <= 31; day++) {
      const dateStr = year + '-' + pad2(m + 1) + '-' + pad2(day);
      const isActive = day <= maxDay;
      if (!isActive) { h += '<div class="cal-cell inactive"></div>'; continue; }

  h += '</div>';

function renderYearCell(dateStr, day, year, month, todayStr, multiDaySet) {
  const isWknd = isWeekend(year, month, day);
  const isToday = dateStr === todayStr;
  const ownEntries = getDayEntries(dateStr).filter(e => isStickerVisible(e.sticker_id));
  const continuations = (multiDaySet[dateStr] || [])
    .map(p => getDayEntries(p.ownerDate).find(e => (e.id || e.cal_date) === p.entryId))
    .filter(e => e && isStickerVisible(e.sticker_id));
  const allEntries = [...ownEntries, ...continuations.map(c => Object.assign({}, c, { _cont: true }))];

  let cls = 'cal-cell';
  if (isToday) cls += ' today-cell';
  else if (isWknd) cls += ' weekend';
  if (allEntries.length > 0) cls += ' has-sticker';

  // 3-letter day-of-week
  const _dowNames = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const _dow = _dowNames[new Date(year, month, day).getDay()];

  let h = '<div class="' + cls + '" data-date="' + dateStr + '" onclick="calCellClick(this.dataset.date)" onpointerdown="calDragStart(event,\'' + dateStr + '\')">';
  h += '<div class="cal-day-head"><span class="cal-dow-mini">' + _dow + '</span><span class="cal-day-num">' + day + '</span></div>';

  // Stack entries as colored pills (max 2 in year view)
  if (allEntries.length > 0) {
    h += '<div class="cal-evt-stack">';
    const maxShow = 2;
    allEntries.slice(0, maxShow).forEach(e => {
      const c = e.sticker_color || '#38bdf8';
      const label = e.label || (e.sticker_emoji ? '' : 'event');
      const emoji = e.sticker_emoji || '';
      h += '<div class="cal-evt-pill' + (e._cont ? ' continuation' : '') + '" style="background:' + c + 'CC" onclick="event.stopPropagation();calEditEntry(\'' + (e.id || e.cal_date) + '\')">';
      if (emoji) h += '<span class="ep-emoji">' + emoji + '</span>';
      if (label) h += '<span class="ep-text">' + escapeHtml(label) + '</span>';
      h += '</div>';
    });
    if (allEntries.length > maxShow) {
      h += '<div class="cal-evt-more" onclick="event.stopPropagation();calCellClick(\'' + dateStr + '\')">+' + (allEntries.length - maxShow) + ' more</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

      if (allEntries.length > maxShow) {

// ──────────────────────────────────────────────
// Multi-entry calendar helpers
// ──────────────────────────────────────────────
function getDayEntries(dateStr) {
  const v = _calData[dateStr];
  if (!v) return [];
  if (Array.isArray(v)) return v;
  // legacy single-object format — coerce to array
  return [v];
}

function getEntryById(entryId) {
  for (const date in _calData) {
    const arr = getDayEntries(date);
    const found = arr.find(e => (e.id || e.cal_date) === entryId);
    if (found) return { entry: found, date };
  }
  return null;
}

function genTempId() {
  return 'tmp-' + Date.now() + '-' + Math.floor(Math.random() * 9999);
}

// Layer visibility — which sticker IDs are hidden from calendar
let _hiddenStickers = JSON.parse(safe.get('cockpit.cal.hidden') || '[]');
function isStickerVisible(stickerId) {
  return !stickerId || _hiddenStickers.indexOf(stickerId) < 0;
}
window.toggleStickerLayer = function(stickerId) {
  const idx = _hiddenStickers.indexOf(stickerId);
  if (idx >= 0) _hiddenStickers.splice(idx, 1);
  else _hiddenStickers.push(stickerId);
  safe.set('cockpit.cal.hidden', JSON.stringify(_hiddenStickers));
  renderPage('big-calendar');
};

function buildMultiDaySet() {
  // Returns map of dateStr → list of {ownerDate, entryId} for days that are part of a multi-day range
  const out = {};
  Object.entries(_calData).forEach(([dateStr, data]) => {
    const entries = Array.isArray(data) ? data : [data];
    entries.forEach(entry => {
      if (entry.end_date && entry.end_date !== dateStr) {
        let d = new Date(dateStr + 'T12:00:00');
        const end = new Date(entry.end_date + 'T12:00:00');
        while (d <= end) {
          const key = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
          if (key !== dateStr) {
            if (!out[key]) out[key] = [];
            out[key].push({ ownerDate: dateStr, entryId: entry.id || dateStr });
          }
          d.setDate(d.getDate() + 1);
        }
      }
    });
  });
  return out;
}

window.calSetView = function(asMonth) {
  _calMonthView = !!asMonth;

function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.calCellClick = async function(dateStr) {
  if (_drawMode) return;
  // If we just finished a drag, the dragend handler already opened a modal — skip
  if (_calDragJustEnded) { _calDragJustEnded = false; return; }
  const entries = getDayEntries(dateStr);
  const conts = (buildMultiDaySet()[dateStr] || []).length;
  // If no entries and no continuations: open new entry directly (1 click)
  if (entries.length === 0 && conts === 0) {
    calNewEntry(dateStr);
  } else {
    openCalendarDayModal(dateStr);
  }
};

let _calModalDate = null;
window.openCalendarDayModal = function(dateStr, prefillEnd) {
  _calModalDate = dateStr;
  const entries = getDayEntries(dateStr);

  // Continuations from multi-day events that started earlier
  const multiDaySet = buildMultiDaySet();
  const conts = (multiDaySet[dateStr] || [])
    .map(p => ({ owner: p.ownerDate, entry: getDayEntries(p.ownerDate).find(e => (e.id || e.cal_date) === p.entryId) }))
    .filter(c => c.entry);

  // Build modal
  let ov = document.getElementById('cal-day-modal');
  if (ov) ov.remove();
  ov = document.createElement('div');
  ov.className = 'modal-overlay'; ov.id = 'cal-day-modal';

  const dateObj = new Date(dateStr + 'T12:00:00');

  const MO  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dateObj.getMonth()];
  const dateLabel = DOW + ' ' + dateObj.getDate() + ' ' + MO + ' ' + dateObj.getFullYear();

  let entriesHtml = '';
  if (entries.length > 0 || conts.length > 0) {
    entriesHtml = '<div style="margin-bottom:14px"><div class="modal-label" style="margin-bottom:8px">' + (entries.length + conts.length) + ' entr' + ((entries.length + conts.length) === 1 ? 'y' : 'ies') + ' on this day</div>';
    entries.forEach(e => {
      const c = e.sticker_color || '#38bdf8';
      const lbl = e.label || (e.sticker_emoji ? '' : '(no label)');
      const emoji = e.sticker_emoji || '';
      entriesHtml += '<div style="display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--glass-1);border:1px solid var(--stroke-2);border-radius:9px;margin-bottom:5px;cursor:pointer" onclick="calEditEntry(\'' + (e.id || e.cal_date) + '\')">';
      entriesHtml += '<div style="width:14px;height:14px;border-radius:4px;background:' + c + ';flex-shrink:0;box-shadow:var(--hl-top)"></div>';
      entriesHtml += '<span style="font-size:14px">' + emoji + '</span>';
      entriesHtml += '<span style="font-size:12.5px;color:var(--text-1);flex:1">' + escapeHtml(lbl) + '</span>';
      if (e.end_date && e.end_date !== dateStr) entriesHtml += '<span style="font-size:9.5px;color:var(--text-3);font-family:var(--mono)">\u2192 ' + e.end_date.slice(5) + '</span>';
      entriesHtml += '<span style="color:var(--text-3);font-size:14px">\u203A</span></div>';
    });
    conts.forEach(c => {

window.calEntryDelete = async function() {
  if (!_calEditingId) return;
  if (!confirm('Delete this entry?')) return;
  const found = getEntryById(_calEditingId);
  if (!found) return;
  // Delete from GCal if linked
  if (found.entry.gcal_event_id) {
    try { await GCAL.deleteEvent(found.entry.gcal_event_id); } catch(_) {}
  }
  // Remove from local data
  const arr = getDayEntries(found.date);
  const idx = arr.findIndex(e => (e.id || e.cal_date) === _calEditingId);
  if (idx >= 0) arr.splice(idx, 1);
  if (arr.length === 0) delete _calData[found.date];
  // Delete from Supabase
  try {
    if (found.entry.id) await sbDelete('cockpit_calendar', 'id=eq.' + found.entry.id);
    else await sbDelete('cockpit_calendar', 'cal_date=eq.' + found.date);
  } catch(_) {}
  calDayCancel();
  renderPage('big-calendar');
};

window.calEntrySave = async function() {
  const $ = id => document.getElementById(id);
  const start = $('cd-start').value;
  const end = $('cd-end').value || start;
  const label = $('cd-label').value.trim();
  const stickerId = $('cd-sticker').value;
  const location = $('cd-loc').value.trim();
  const note = $('cd-note').value;

  if (!start) { alert('Start date is required'); return; }
  if (end && end < start) { alert('End date must be on or after start date'); return; }

  const sticker = stickerId ? _stickers.find(s => s.id === stickerId) : null;
  const isEmpty = !label && !stickerId && !note && !location;
  if (isEmpty) {
    calDayCancel();
    return;
  }

  const wasEditing = _calEditingId;
  let oldEntry = null;
  if (wasEditing) {
    const found = getEntryById(wasEditing);
    if (found) oldEntry = found.entry;
  }

  const updated = {
    id: oldEntry && oldEntry.id ? oldEntry.id : genTempId(),
    cal_date: start,
    label: label,
    sticker_id: stickerId,
    sticker_emoji: sticker ? (sticker.emoji || '') : '',
    sticker_color: sticker ? (sticker.color || '') : '',
    location: location,
    end_date: (end && end !== start) ? end : null,
    note: note,
    gcal_event_id: oldEntry ? oldEntry.gcal_event_id : null
  };

  // If editing and date changed, remove from old date's array
  if (wasEditing && oldEntry) {
    const oldFound = getEntryById(wasEditing);
    if (oldFound && oldFound.date !== start) {
      const oldArr = getDayEntries(oldFound.date);
      const ix = oldArr.findIndex(e => (e.id || e.cal_date) === wasEditing);
      if (ix >= 0) oldArr.splice(ix, 1);
      if (oldArr.length === 0) delete _calData[oldFound.date];
    } else if (oldFound) {
      // Same date — remove old version, will push new
      const oldArr = getDayEntries(oldFound.date);
      const ix = oldArr.findIndex(e => (e.id || e.cal_date) === wasEditing);
      if (ix >= 0) oldArr.splice(ix, 1);
    }
  }

  // Add to new date's array
  if (!_calData[start]) _calData[start] = [];
  if (!Array.isArray(_calData[start])) _calData[start] = [_calData[start]];
  _calData[start].push(updated);

  // GCal: delete old event if existed (we'll recreate)
  if (oldEntry && oldEntry.gcal_event_id) {
    try { await GCAL.deleteEvent(oldEntry.gcal_event_id); } catch(_) {}
    updated.gcal_event_id = null;
  }

  // Save to Supabase
  try {
    const row = {
      id: updated.id,
      cal_date: start,
      year: parseInt(start.slice(0, 4), 10),
      label: updated.label,
      sticker_id: updated.sticker_id,
      sticker_emoji: updated.sticker_emoji,
      sticker_color: updated.sticker_color,
      note: updated.note,
      location: updated.location,
      end_date: updated.end_date,
      gcal_event_id: null,
      last_synced_at: new Date().toISOString()
    };
    await sbUpsert('cockpit_calendar', row);
  } catch(e) { console.warn('Calendar save failed (kept locally):', e.message); }

  // Sync to GCal
  if (GCAL.isValid()) {
    const summary = (updated.sticker_emoji ? updated.sticker_emoji + ' ' : '') + (updated.label || (sticker && sticker.name) || 'Cockpit');
    try {
      const eventId = await GCAL.createEvent(start, {
        summary: summary,
        note: updated.note,
        location: updated.location,
        endDate: updated.end_date,
        colorId: sticker ? (sticker.gcal_color_id || '') : ''
      });
      if (eventId) {
        updated.gcal_event_id = eventId;
        try { await sbUpsert('cockpit_calendar', { id: updated.id, cal_date: start, year: parseInt(start.slice(0, 4), 10), gcal_event_id: eventId }); } catch(_) {}
      }
    } catch(_) {}
  }

  calDayCancel();
  renderPage('big-calendar');
};

window.calDaySave = async function() {
  const $ = id => document.getElementById(id);
  const newStart = $('cd-start').value;
  const newEnd = $('cd-end').value || newStart;
  const label = $('cd-label').value.trim();
  const stickerId = $('cd-sticker').value;
  const location = $('cd-loc').value.trim();
  const note = $('cd-note').value;

  if (!newStart) { alert('Start date is required'); return; }
  if (newEnd && newEnd < newStart) { alert('End date must be on or after start date'); return; }

  const sticker = stickerId ? _stickers.find(s => s.id === stickerId) : null;
  const oldStart = _calModalDate;
  const oldData = _calData[oldStart] || {};

  // If start date changed, drop the old entry
  if (newStart !== oldStart) {
    if (oldData.gcal_event_id) await GCAL.deleteEvent(oldData.gcal_event_id);
    delete _calData[oldStart];
    await sbDelete('cockpit_calendar', 'cal_date=eq.' + oldStart);
  } else if (oldData.gcal_event_id) {
    // Same day but content may have changed → delete old gcal event so we recreate fresh
    await GCAL.deleteEvent(oldData.gcal_event_id);
  }

  // If everything is empty, just clear
  const isEmpty = !label && !stickerId && !note && !location;
  if (isEmpty) {
    if (newStart === oldStart) {
      delete _calData[oldStart];
      await sbDelete('cockpit_calendar', 'cal_date=eq.' + oldStart);
    }
    calDayCancel();
    return renderPage('big-calendar');
  }

  const updated = {
    cal_date: newStart,
    label: label,
    sticker_id: stickerId,
    sticker_emoji: sticker ? (sticker.emoji || '') : '',
    sticker_color: sticker ? (sticker.color || '') : '',
    location: location,
    end_date: (newEnd && newEnd !== newStart) ? newEnd : null,
    note: note,
    gcal_event_id: null
  };
  _calData[newStart] = updated;

  await sbUpsert('cockpit_calendar', {
    cal_date: newStart, year: parseInt(newStart.slice(0, 4), 10),
    label: updated.label,
    sticker_emoji: updated.sticker_emoji,
    sticker_color: updated.sticker_color,
    note: updated.note,
    location: updated.location,
    end_date: updated.end_date,
    gcal_event_id: null,
    last_synced_at: new Date().toISOString()
  });

  if (GCAL.isValid()) {
    const summary = (updated.sticker_emoji ? updated.sticker_emoji + ' ' : '') + (updated.label || (sticker && sticker.name) || 'Cockpit');
    const eventId = await GCAL.createEvent(newStart, {
      summary: summary,
      note: updated.note,
      location: updated.location,
      endDate: updated.end_date,
      colorId: sticker ? (sticker.gcal_color_id || '') : ''
    });
    if (eventId) {
      updated.gcal_event_id = eventId;
      await sbUpsert('cockpit_calendar', { cal_date: newStart, year: parseInt(newStart.slice(0, 4), 10), gcal_event_id: eventId });
    }
  }

  calDayCancel();
  renderPage('big-calendar');
};

// Custom sticker modal with clear color labelling and visual swatch picker
const VIEW_COLORS = [
  '#38bdf8', // cyan
  '#c084fc', // violet
  '#f9a8d4', // pink
  '#4ade80', // mint
  '#fbbf24', // amber
  '#f87171', // coral
  '#fb923c', // orange
  '#a5b4fc', // periwinkle
  '#6ee7b7', // teal
  '#fcd34d', // banana
  '#7d8595', // graphite

async function stickerModal(existing, title, saveLabel, allowDelete) {
  return new Promise(res => {
    _modalResolve = (r) => res(r === null ? null : r);
    const ov = document.createElement('div');
    ov.className = 'modal-overlay'; ov.id = 'app-modal';

    const viewColor = existing.color || '#38bdf8';
    const gcalId = existing.gcal_color_id || '';

    const swatches = VIEW_COLORS.map(c =>
      '<div class="color-swatch'+(c===viewColor?' selected':'')+'" data-c="'+c+'" style="background:'+c+'" onclick="_pickViewColor(\''+c+'\')"></div>'
    ).join('');

    const gcalOpts = '<option value="">Default (none)</option>' + GCAL_COLORS.map(c =>
      '<option value="'+c.id+'"'+(c.id===gcalId?' selected':'')+' style="background:'+c.color+'">'+c.name+'</option>'
    ).join('');

    const delBtn = allowDelete ? '<button class="modal-btn danger" onclick="_smAct(\'delete\')">Delete</button>' : '';

    ov.innerHTML = '<div class="modal-box" onclick="event.stopPropagation()">' +
      '<div class="modal-title"><span class="mi">\u{1F3F7}\uFE0F</span>'+title+'</div>' +
      '<div class="modal-field"><label class="modal-label">Name</label><input class="modal-input" id="sm-name" placeholder="Birthday" value="'+(existing.name||'').replace(/"/g,'&quot;')+'"></div>' +
      '<div class="modal-field"><label class="modal-label">Emoji / Symbol</label><input class="modal-input" id="sm-emoji" placeholder="\u{1F382}" value="'+(existing.emoji||'').replace(/"/g,'&quot;')+'"></div>' +
      '<div class="modal-field"><label class="modal-label">Display Color &mdash; Cockpit only, never sent to Google</label>' +
        '<div class="color-row" id="sm-swatches">'+swatches+'</div>' +
        '<input type="hidden" id="sm-color" value="'+viewColor+'">' +
      '</div>' +
      '<div class="modal-field"><label class="modal-label">Google Calendar Color &mdash; only this is synced</label>' +
        '<select class="modal-input" id="sm-gcal">'+gcalOpts+'</select>' +
      '</div>' +
      '<div class="modal-actions">'+delBtn+'<button class="modal-btn secondary" onclick="_smAct(\'cancel\')">Cancel</button><button class="modal-btn primary" onclick="_smAct(\'save\')">'+saveLabel+'</button></div>' +
      '</div>';
    ov.addEventListener('click', () => _smAct('cancel'));
    document.body.appendChild(ov);
    setTimeout(() => { const el = document.getElementById('sm-name'); if (el) el.focus(); }, 50);
  });
}

window._pickViewColor = function(c) {
  document.getElementById('sm-color').value = c;
  document.querySelectorAll('#sm-swatches .color-swatch').forEach(el => {
    el.classList.toggle('selected', el.dataset.c === c);
  });
};

window._smAct = function(action) {
  const ov = document.getElementById('app-modal');
  if (!ov) return;
  let result = null;
  if (action === 'save') {
    const nameEl = document.getElementById('sm-name');
    const name = nameEl ? nameEl.value.trim() : '';
    if (!name) {
      // Make the empty state OBVIOUS instead of silently failing
      if (nameEl) {
        nameEl.style.borderColor = 'var(--bad)';
        nameEl.placeholder = 'Name is required — type something';
        nameEl.focus();
        setTimeout(() => { if (nameEl) nameEl.style.borderColor = ''; }, 2000);
      }
      return;
    }
    result = {
      name:  name,
      emoji: (document.getElementById('sm-emoji').value || '').trim(),
      color: document.getElementById('sm-color').value || '#38bdf8',
      gcal:  document.getElementById('sm-gcal').value || ''
    };
  } else if (action === 'delete') {
    if (!confirm('Delete this sticker?')) return;
    result = { _delete: true };
  }
  ov.remove();
  if (_modalResolve) { const r = _modalResolve; _modalResolve = null; r(result); }
};

window.editSticker = async function(id) {
  const s = _stickers.find(x => x.id === id);
  if (!s) return;
  const r = await stickerModal(s, 'Edit Sticker', 'Update', true);
  if (!r) return;
  if (r._delete) {
    // Optimistic local removal
    _stickers = _stickers.filter(x => x.id !== id);
    if (_activeSticker && _activeSticker.id === id) _activeSticker = null;
    renderPage('big-calendar');
    try { await sbDelete('cockpit_stickers', 'id=eq.' + id); }
    catch(e) { console.warn('Sticker delete failed (kept locally):', e.message); }
    return;
  }
  // Optimistic local update FIRST
  const idx = _stickers.findIndex(x => x.id === id);
  if (idx >= 0) {
    _stickers[idx] = Object.assign({}, _stickers[idx], {
      name: r.name, emoji: r.emoji || '\u25C6', color: r.color || '#38bdf8', gcal_color_id: r.gcal || ''
    });
  }
  renderPage('big-calendar');
  // Then sync to Supabase
  try {
    await sbPatch('cockpit_stickers', 'id=eq.' + id, {
      name: r.name, emoji: r.emoji || '\u25C6', color: r.color || '#38bdf8', gcal_color_id: r.gcal || ''
    });
  } catch(e) {
    console.warn('Sticker update failed (kept locally):', e.message);
  }
};

// Save the canvas to localStorage so strokes persist across reloads
function saveCanvasToStorage() {
  const canvas = document.getElementById('cal-draw-canvas');
  if (!canvas || canvas.width <= 1) return;
  try {
    const dataUrl = canvas.toDataURL('image/png');
    if (dataUrl.length < 4 * 1024 * 1024) safe.set('cockpit.cal.canvas', dataUrl);
  } catch(e) { console.warn('Canvas save failed:', e.message); }
}

function restoreCanvasFromStorage() {
  const canvas = document.getElementById('cal-draw-canvas');
  if (!canvas) return;
  const dataUrl = safe.get('cockpit.cal.canvas');

function initCalCanvas() {
  const canvas = document.getElementById('cal-draw-canvas');
  if (!canvas) return;
  const wrap = canvas.parentElement;
  if (!wrap) return;
  const w = Math.max(wrap.scrollWidth, wrap.clientWidth, 800);
  const h = Math.max(wrap.scrollHeight, wrap.clientHeight, 400);
  canvas.style.position = 'absolute';
  canvas.style.top = '0';
  canvas.style.left = '0';
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const ctx = canvas.getContext('2d');
  // Restore any saved strokes
  restoreCanvasFromStorage();

  let drawing = false, lx = 0, ly = 0;

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'pen') return;
    e.preventDefault();
    drawing = true;
    lx = e.offsetX;
    ly = e.offsetY;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'pen') return;
    if (!drawing) return;
    e.preventDefault();
    ctx.beginPath();
    if (_drawTool === 'eraser') {
      // Eraser: actually remove pixels using destination-out compositing
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = 18;  // wider eraser stroke
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = _drawColor;
      const press = e.pressure > 0 ? e.pressure : 0.5;
      ctx.lineWidth = 1.5 + press * 4.5;
    }
    ctx.moveTo(lx, ly);
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
    lx = e.offsetX;
    ly = e.offsetY;
  });
  canvas.addEventListener('pointerup', e => {
    if (e.pointerType !== 'pen') return;
    drawing = false;
    saveCanvasToStorage();
    showSaveToast();
  });
  canvas.addEventListener('pointercancel', e => {
    if (e.pointerType !== 'pen') return;
    drawing = false;
    saveCanvasToStorage();
  });
}

let _calDragStart = null;
let _calDragLast  = null;
let _calDragMoved = false;
let _calDragJustEnded = false;

window.calDragStart = function(e, dateStr) {
  if (_drawMode) return;
  // Only left mouse / touch / pen
  if (e.button !== undefined && e.button !== 0) return;
  _calDragStart = dateStr;
  _calDragLast = dateStr;
  _calDragMoved = false;
  document.addEventListener('pointermove', calDragMove);
  document.addEventListener('pointerup', calDragEnd, { once: true });
};

function calDragMove(e) {
  if (!_calDragStart) return;
  const target = document.elementFromPoint(e.clientX, e.clientY);
  if (!target) return;
  const cell = target.closest('.cal-cell, .cal-mcell');
  if (!cell || !cell.dataset.date) return;
  const d = cell.dataset.date;
  if (d === _calDragLast) return;
  _calDragLast = d;
  _calDragMoved = true;
  // Highlight cells in range
  const [from, to] = [_calDragStart, _calDragLast].sort();
  document.querySelectorAll('.cal-cell, .cal-mcell').forEach(c => {
    const cd = c.dataset.date;
    if (cd && cd >= from && cd <= to) c.classList.add('drag-highlight');
    else c.classList.remove('drag-highlight');
  });
}

function calDragEnd(e) {
  document.removeEventListener('pointermove', calDragMove);
  document.querySelectorAll('.drag-highlight').forEach(c => c.classList.remove('drag-highlight'));
  if (_calDragStart && _calDragMoved && _calDragLast && _calDragLast !== _calDragStart) {
    const [from, to] = [_calDragStart, _calDragLast].sort();
    _calDragJustEnded = true;
    setTimeout(() => { _calDragJustEnded = false; }, 50);
    calNewEntry(from, to);
  }
  _calDragStart = null;
  _calDragLast = null;
  _calDragMoved = false;
}

function renderStickerCountsBar() {
  const counts = {};  // sticker_id → { sticker, days }
  Object.entries(_calData).forEach(([dateStr, data]) => {
    const entries = Array.isArray(data) ? data : [data];
    entries.forEach(e => {
      if (!e.sticker_id) return;
      // Year filter
      const year = +dateStr.slice(0, 4);
      if (year !== _calYear) return;
      // Count days (handles multi-day)
      let days = 1;
      if (e.end_date && e.end_date !== dateStr) {
        const start = new Date(dateStr + 'T12:00:00');
        const end   = new Date(e.end_date + 'T12:00:00');
        days = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
      }
      if (!counts[e.sticker_id]) counts[e.sticker_id] = { sticker: _stickers.find(s => s.id === e.sticker_id), days: 0 };
      if (counts[e.sticker_id].sticker) counts[e.sticker_id].days += days;
    });
  });
  const items = Object.values(counts).filter(c => c.sticker).sort((a, b) => b.days - a.days);
  if (items.length === 0) return '';
  let h = '<div class="sticker-counts-bar">';
  h += '<span style="font-size:9px;color:var(--text-3);font-family:var(--mono);letter-spacing:0.14em;font-weight:700;align-self:center;margin-right:4px">' + _calYear + ' TOTALS</span>';
  items.forEach(c => {
    const hidden = !isStickerVisible(c.sticker.id);
    h += '<div class="sc-pill' + (hidden ? ' hidden' : '') + '" onclick="toggleStickerLayer(\'' + c.sticker.id + '\')" title="' + (hidden ? 'Show' : 'Hide') + ' on calendar">';
    h += '<div class="sc-dot" style="background:' + (c.sticker.color || '#38bdf8') + '"></div>';
    h += '<span style="font-size:13px">' + (c.sticker.emoji || '') + '</span>';
    h += '<span class="sc-name">' + escapeHtml(c.sticker.name || '') + '</span>';
    h += '<span class="sc-count">' + c.days + 'd</span>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}


// ══════════════════════════════════════════════════
// FINANCIAL COMPUTATION
// ══════════════════════════════════════════════════
function computeFinancials() {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  const fin = PAGES.finance.data;

  const accounts = fin.accounts || [];
  const debts = fin.debt || [];
  const ri = fin.recurringIncome || [];
  const re = fin.recurringExpenses || [];

  const bankBalance = accounts.reduce((s,a)=>s+(+getEdited('fin.acct.'+a.id+'.balance', a.balance)||0), 0);
  const bankSavings = accounts.reduce((s,a)=>s+(+getEdited('fin.acct.'+a.id+'.savings', a.savings)||0), 0);
  const bankCredit  = accounts.reduce((s,a)=>s+(+getEdited('fin.acct.'+a.id+'.creditLine', a.creditLine)||0), 0);

  // Business income across pages
  const bizPages = ['autoscale','wa-saas','rsvp','crm-saas','construction'];
  let totalBizIncome = 0, totalBizExpense = 0;
  bizPages.forEach(k => {
    const pg = PAGES[k];
    if (pg && pg.data && pg.data.money) {
      totalBizIncome  += getMField(k, y, m, 'income',  pg.data.money.month.income);
      totalBizExpense += getMField(k, y, m, 'expense', pg.data.money.month.expense);
    }
  });

  // Trading P&L this month
  let tradePnl = 0;
  for (let d=1; d<=31; d++) {
    const v = safe.get('cockpit.trade.'+y+'.'+m+'.'+d);
    if (v) tradePnl += parseFloat(v) || 0;
  }

  const totalRI = ri.filter(r=>r.active).reduce((s,r)=>s+(r.amount||0), 0);
  const totalRE = re.filter(r=>r.active).reduce((s,r)=>s+(r.amount||0), 0);

  // Holdings (simplified — use stored values)
  const angelPaper = (_investments||[]).reduce((s,i)=>s+(i.current_value||i.invested||0), 0);
  const reValue = (_properties||[]).reduce((s,p)=>s+(p.current_value||p.value||0), 0);
  const reCashflow = (_properties||[]).reduce((s,p)=>s+(p.monthly_revenue||p.monthlyRev||0)-(p.monthly_expenses||p.monthlyExp||0), 0);

  const totalDebt = debts.reduce((s,d)=>s+(+getEdited('fin.debt.'+d.id+'.balance', d.balance)||0), 0);
  const cashAvail = bankBalance + bankSavings;
  const totalAssets = cashAvail + reValue + angelPaper;
  const netWorth = totalAssets - totalDebt;
  const monthlyNet = totalBizIncome + tradePnl + totalRI + reCashflow - totalBizExpense - totalRE;

  return {
    netWorth, cashAvail, totalAssets, totalDebt, monthlyNet,
    bankBalance, bankSavings, bankCredit,
    totalBizIncome, totalBizExpense, tradePnl,
    totalRI, totalRE, reValue, reCashflow, angelPaper,
    accounts, debts, ri, re
  };
}

function computeRelocationETA() {
  const now = new Date(); const y=now.getFullYear(), m=now.getMonth();
  const currentSav = +getEdited('fin.currentSavings', PAGES.finance.data.currentSavings||0);
  const target = PAGES.finance.data.targetSavings || 30000;
  const mrrTarget = 6000;
  let F;
  try { F = computeFinancials(); } catch(e) { F = { monthlyNet:0, totalBizIncome:0 }; }
  const bizIncome = getMField('autoscale', y, m, 'income', PAGES.autoscale.data.money.month.income);
  let prevY=y, prevM=m-1; if(prevM<0){prevM=11;prevY--;}
  const prevIncome = getMField('autoscale', prevY, prevM, 'income', 0);
  const mrrGrowth = bizIncome - prevIncome;
  const moToSav = F.monthlyNet>0 ? Math.max(0, Math.ceil((target-currentSav)/F.monthlyNet)) : 999;
  const moToMrr = bizIncome>=mrrTarget ? 0 : (mrrGrowth>0 ? Math.ceil((mrrTarget-bizIncome)/mrrGrowth) : 999);
  const moToGo = Math.max(moToSav, moToMrr);
  const constraint = moToSav >= moToMrr ? 'savings' : 'MRR';
  const savPct = Math.min(Math.round((currentSav/target)*100), 100);
  const mrrPct = Math.min(Math.round((bizIncome/mrrTarget)*100), 100);
  return { moToGo, moToSav, moToMrr, constraint, savPct, mrrPct, currentSav, target, bizIncome, mrrTarget };
}

window.editBankAccount = async function(id) {

    title: id ? 'Edit Bank Account' : 'Add Bank Account', icon:'\u{1F3E6}',
    saveLabel: id ? 'Update' : 'Add', deleteLabel: id ? 'Delete' : null,
    fields: [
      {id:'bank',       label:'Bank Name',                 value: acct ? acct.bank : ''},
      {id:'balance',    label:'Checking Balance (\u20AA)', type:'number', value: acct ? acct.balance : ''},
      {id:'savings',    label:'Savings (\u20AA)',          type:'number', value: acct ? acct.savings : ''},

  const v = r.values;

  if (id) {
    PAGES.finance.data.accounts = PAGES.finance.data.accounts.map(a =>
      a.id === id ? Object.assign({}, a, {bank:row.bank_name, balance:row.balance, savings:row.savings, creditLine:row.credit_line, cardLimit:row.card_limit}) : a

// Helper: total holdings value in ILS
function computeHoldingsTotal() {
  const data = (PAGES.holdings && PAGES.holdings.data) || {};
  const rate = LIVE_RATES.usdToIls || 3.7;
  let total = 0;
  (data.crypto||[]).forEach(c => {
    const live = LIVE_RATES.crypto[c.symbol];
    const pi = live ? (live.ils || live.usd * rate) : ((c.price||0) * rate);
    total += (c.amount||0) * pi;
  });
  (data.stocks||[]).forEach(s => { total += (s.shares||s.amount||0) * (s.price||0) * rate; });
  (data.cash||[]).forEach(c => { total += (c.amount||0) * getRateToIls(c.currency || 'ILS'); });
  return total;
}

// Helper: render a donut chart for asset allocation
function renderAllocationDonut(segments, total) {
  if (total <= 0) {
    return '<div style="text-align:center;padding:20px 10px;color:var(--text-3);font-size:11px;font-family:var(--mono)">No assets logged yet</div>';
  }
  const filtered = segments.filter(s => s.value > 0);
  let cumulative = 0;
  const radius = 42;
  const strokeWidth = 14;
  const circ = 2 * Math.PI * radius;
  let svg = '<svg viewBox="0 0 100 100" style="width:130px;height:130px;display:block;margin:0 auto"><g transform="rotate(-90 50 50)">';
  // Background ring
  svg += '<circle cx="50" cy="50" r="'+radius+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="'+strokeWidth+'"/>';
  filtered.forEach(seg => {
    const pct = seg.value / total;
    const dash = pct * circ;
    const offset = -cumulative * circ;
    svg += '<circle cx="50" cy="50" r="'+radius+'" fill="none" stroke="'+seg.color+'" stroke-width="'+strokeWidth+'" stroke-dasharray="'+dash+' '+(circ-dash)+'" stroke-dashoffset="'+offset+'"/>';
    cumulative += pct;
  });
  svg += '</g><text x="50" y="48" text-anchor="middle" fill="#fff" font-size="13" font-weight="800" font-family="var(--mono)">'+fmtK(Math.round(total))+'\u20AA</text>';
  svg += '<text x="50" y="60" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="6.5" letter-spacing="0.10em">ASSETS</text></svg>';

  // Legend
  let legend = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px">';
  segments.forEach(seg => {
    const pct = total > 0 ? Math.round((seg.value/total)*100) : 0;
    legend += '<div style="display:flex;align-items:center;gap:6px;font-size:9.5px;font-family:var(--mono)">' +
      '<span style="width:8px;height:8px;border-radius:2px;background:'+seg.color+';flex-shrink:0"></span>' +
      '<span style="color:var(--text-3)">'+seg.label+'</span>' +
      '<span style="margin-left:auto;color:var(--text-1);font-weight:700">'+pct+'%</span>' +
      '</div>';
  });
  legend += '</div>';
  return svg + legend;
}

function renderCashFlowChart(F) {
  // Two-column income vs expense layout — clean, scannable
  const income = [
    { label: 'Business income',    value: F.totalBizIncome },
    { label: 'Trading P&L',        value: Math.max(0, F.tradePnl) },
    { label: 'Real estate CF',     value: Math.max(0, F.reCashflow) },
    { label: 'Recurring income',   value: F.totalRI }
  ].filter(r => r.value > 0);

  const expenses = [
    { label: 'Business costs',     value: F.totalBizExpense },
    { label: 'Recurring expenses', value: F.totalRE },
    { label: 'Trading P&L',        value: F.tradePnl < 0 ? Math.abs(F.tradePnl) : 0 },
    { label: 'Real estate CF',     value: F.reCashflow < 0 ? Math.abs(F.reCashflow) : 0 }
  ].filter(r => r.value > 0);

  const totalIn = income.reduce((s, r) => s + r.value, 0);

    h += '<div style="font-size:11px;color:var(--text-3);font-style:italic;padding:6px 0">No income logged this month</div>';
  } else {
    income.forEach(r => {

  h += '<span style="font-size:9.5px;font-weight:700;color:var(--bad);letter-spacing:0.18em;font-family:var(--mono);text-transform:uppercase">\u25BC Expenses</span>';

      h += '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:12px"><span style="color:var(--text-2)">' + r.label + '</span><span style="font-family:var(--mono);font-weight:600;color:var(--bad)">-' + fmtK(Math.round(r.value)) + '\u20AA</span></div>';

  // NET TOTAL bar
