// HOLDINGS (full — crypto / stocks / cash with live rates)
// ══════════════════════════════════════════════════
function renderHoldings() {
  const data = PAGES.holdings.data || {};
  const crypto = data.crypto || [];
  const stocks = data.stocks || [];
  const cash = data.cash || [];
  const rate = LIVE_RATES.usdToIls || 3.7;

  const cryptoRows = crypto.map(c => {
    const live = LIVE_RATES.crypto[c.symbol];
    const pu = live ? live.usd : (c.price || 0);
    const pi = live ? (live.ils || pu * rate) : (pu * rate);
    return { id: c.id||'', sym: c.symbol, name: c.name, amount: c.amount||0,
             pu: pu, pi: pi, vIls: (c.amount||0) * pi, vUsd: (c.amount||0) * pu,
             chg: c.change || 0, live: !!live };
  });
  const stockRows = stocks.map(s => {
    const pu = s.price || 0;
    const shares = s.shares || s.amount || 0;
    return { id: s.id||'', sym: s.symbol, name: s.name, shares: shares,
             pu: pu, pi: pu * rate, vIls: shares * pu * rate, vUsd: shares * pu,
             chg: s.change || 0 };
  });
  const cashRows = cash.map(c => {
    const r2 = getRateToIls(c.currency || 'ILS');
    const vIls = (c.amount||0) * r2;
    const vUsd = c.currency === 'USD' ? c.amount : (vIls / rate);
    return { id: c.id||'', cur: c.currency, amount: c.amount||0, r2: r2, vIls: vIls, vUsd: vUsd };
  });
  const cT = cryptoRows.reduce((s,c) => s + c.vIls, 0);
  const sT = stockRows.reduce((s,c) => s + c.vIls, 0);
  const cashT = cashRows.reduce((s,c) => s + c.vIls, 0);
  const total = cT + sT + cashT;

window.addHolding = async function(typeIdx, id) {
  const types = ['crypto','stock','cash'];
  const t = types[typeIdx];
  const list = t==='crypto' ? PAGES.holdings.data.crypto : (t==='stock' ? PAGES.holdings.data.stocks : PAGES.holdings.data.cash);
  const ex = id ? list.find(x => x.id === id) : null;
  let fields;
  if (t === 'cash') {
    fields = [
      {id:'currency', label:'Currency', placeholder:'USD', value: ex ? ex.currency : ''},
      {id:'amount',   label:'Amount',   type:'number', value: ex ? ex.amount : ''}
    ];
  } else if (t === 'crypto') {
    fields = [
      {id:'symbol', label:'Symbol \u2014 type to search (BTC, ETH, SOL\u2026)', value: ex ? ex.symbol : '', datalist:'crypto-symbols-list'},
      {id:'name',   label:'Name (auto-fills if known)',                       value: ex ? ex.name : ''},
      {id:'amount', label:'Amount',  type:'number', step:'0.00001', value: ex ? ex.amount : ''}
    ];
  } else {
    fields = [
      {id:'symbol', label:'Ticker \u2014 type to search (AAPL, NVDA, SPY\u2026)', value: ex ? ex.symbol : '', datalist:'stock-symbols-list'},
      {id:'name',   label:'Name',   value: ex ? ex.name : ''},
      {id:'shares', label:'Shares', type:'number', value: ex ? (ex.shares||ex.amount) : ''},
      {id:'price',  label:'Last Price USD', type:'number', step:'0.01', value: ex ? ex.price : ''}
    ];
  }
  const r = await openModal({
    title: id ? 'Edit '+t : 'Add '+t, icon: t==='crypto'?'\u20BF':t==='stock'?'\u{1F4C8}':'\u{1F4B5}',
    saveLabel: id?'Update':'Add', deleteLabel: id?'Delete':null, fields: fields
  });
  if (r.action === 'cancel') return;
  if (r.action === 'delete' && id) {
    sbDelete('cockpit_holdings', 'id=eq.'+id);
    if (t==='crypto') PAGES.holdings.data.crypto = list.filter(x=>x.id!==id);
    else if (t==='stock') PAGES.holdings.data.stocks = list.filter(x=>x.id!==id);
    else PAGES.holdings.data.cash = list.filter(x=>x.id!==id);
    return renderPage('holdings');
  }
  const v = r.values;
  const row = { asset_type: t, symbol: v.symbol||v.currency, name: v.name||v.currency,
                amount: +(v.amount||v.shares||0), price_usd: +(v.price||0),
                currency: v.currency || 'USD', sort_order: list.length+1 };
  if (id) {
    sbPatch('cockpit_holdings', 'id=eq.'+id, row);
    list.forEach((x,i) => { if (x.id === id) list[i] = Object.assign({}, x, {symbol: row.symbol, name: row.name, amount: row.amount, price: row.price_usd, currency: row.currency}); });
  } else {
    sbUpsert('cockpit_holdings', row).then(() => sbGet('cockpit_holdings','?order=asset_type,sort_order').then(rows => {
      PAGES.holdings.data.crypto = rows.filter(h => h.asset_type==='crypto').map(h => ({symbol:h.symbol,name:h.name,amount:h.amount,price:h.price_usd,change:h.change_pct,currency:h.currency,id:h.id}));
      PAGES.holdings.data.stocks = rows.filter(h => h.asset_type==='stock').map(h => ({symbol:h.symbol,name:h.name,shares:h.amount,price:h.price_usd,change:h.change_pct,currency:h.currency,id:h.id}));
      PAGES.holdings.data.cash   = rows.filter(h => h.asset_type==='cash').map(h => ({currency:h.symbol,amount:h.amount,id:h.id}));
      renderPage('holdings');
    }));
  }
  renderPage('holdings');
};

// ══════════════════════════════════════════════════
// TRADING — Tradezella-style overview
// ══════════════════════════════════════════════════
function calcMaxDrawdown(trades) {
  let peak=0, maxDD=0, running=0;
  trades.forEach(t => { running += (t.pnl||0); if (running > peak) peak = running; const dd = peak - running; if (dd > maxDD) maxDD = dd; });
  return maxDD;
}
function calcByDOW(trades) {
  const days = [0,1,2,3,4,5,6].map(d => ({day:d, pnl:0, n:0, wins:0}));
  trades.forEach(t => { const d = new Date(t.trade_date+'T12:00:00').getDay(); days[d].pnl += (t.pnl||0); days[d].n++; if (t.pnl>0) days[d].wins++; });
  return days;
}
function calcBySetup(trades) {
  const map = {};
  trades.forEach(t => {
    const k = t.setup_type || 'Untagged';
    if (!map[k]) map[k] = { n:0, pnl:0, wins:0 };
    map[k].n++; map[k].pnl += (t.pnl||0); if (t.pnl > 0) map[k].wins++;
  });
  return Object.entries(map).map(([name, v]) => ({ name: name, n: v.n, pnl: v.pnl, wins: v.wins,
    avg: Math.round(v.pnl/v.n), wr: Math.round((v.wins/v.n)*100)
  })).sort((a,b) => b.pnl - a.pnl);
}
function calcRulesAnalytics(trades, rules) {
  return rules.filter(r => r.is_active).map(r => {
    const withR = trades.filter(t => Array.isArray(t.rules_checked) && t.rules_checked.indexOf(r.id) >= 0);
    const woR   = trades.filter(t => !Array.isArray(t.rules_checked) || t.rules_checked.indexOf(r.id) < 0);
    const withWR  = withR.length>0 ? Math.round((withR.filter(t=>t.pnl>0).length/withR.length)*100) : null;
    const withAvg = withR.length>0 ? Math.round(withR.reduce((s,t)=>s+(t.pnl||0),0)/withR.length) : null;
    const woWR    = woR.length>0   ? Math.round((woR.filter(t=>t.pnl>0).length/woR.length)*100)   : null;
    const impact  = (withWR!==null && woWR!==null) ? withWR - woWR : null;
    return { rule: r, withR: {n: withR.length, wr: withWR, avg: withAvg}, woR: {n: woR.length, wr: woWR}, impact: impact };
  }).sort((a,b) => (b.impact||0) - (a.impact||0));
}
function renderEquityCurveBig(trades, height) {
  if (!trades.length) return '<div class="eq-curve-big" style="display:flex;align-items:center;justify-content:center;color:var(--text-3);font-family:var(--mono);font-size:12px">No trades yet</div>';
  let running = 0;
  const pts = trades.map(t => { running += (t.pnl||0); return running; });
  const eqMin = Math.min(0, ...pts), eqMax = Math.max(1, ...pts), rng = eqMax - eqMin || 1;
  const H = height || 130;
  const points = pts.map((v,i) => {
    const x = pts.length>1 ? (i/(pts.length-1))*100 : 50;
    const y = H - ((v-eqMin)/rng)*(H-4) - 2;
    return x+','+y;
  }).join(' ');
  const lastX = pts.length>1?100:50;
  const isPos = pts[pts.length-1] >= 0;
  const lc = isPos ? 'var(--good)' : 'var(--bad)';
  return '<svg class="eq-curve-big" viewBox="0 0 100 '+H+'" preserveAspectRatio="none">' +
    '<defs><linearGradient id="eqBig" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+lc+'" stop-opacity="0.20"/><stop offset="100%" stop-color="'+lc+'" stop-opacity="0"/></linearGradient></defs>' +
    '<polygon points="'+points+' '+lastX+','+H+' 0,'+H+'" fill="url(#eqBig)"/>' +
    '<polyline points="'+points+'" fill="none" stroke="'+lc+'" stroke-width="0.8" vector-effect="non-scaling-stroke"/>' +
    '</svg>';
}

// ══════════════════════════════════════════════════
// TRADING CALENDAR (Tradezella-style monthly P&L heatmap)
// ══════════════════════════════════════════════════
let _tcalYear = (new Date()).getFullYear();
let _tcalMonth = (new Date()).getMonth();

function renderTradingCalendar() {
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + pad2(today.getMonth()+1) + '-' + pad2(today.getDate());
  const y = _tcalYear, m = _tcalMonth;
  const monthName = ['January','February','March','April','May','June','July','August','September','October','November','December'][m];
  const maxDay = daysInMonth(y, m);

  // Aggregate trades by date for this month
  const byDate = {};
  (_trades || []).forEach(t => {
    if (!t.trade_date) return;
    if (t.trade_date.indexOf(y + '-' + pad2(m+1)) !== 0) return;
    if (!byDate[t.trade_date]) byDate[t.trade_date] = { pnl: 0, count: 0 };
    byDate[t.trade_date].pnl += (t.pnl || 0);
    byDate[t.trade_date].count++;
  });

  const monthTotal = Object.values(byDate).reduce((s, d) => s + d.pnl, 0);
  const monthCount = Object.values(byDate).reduce((s, d) => s + d.count, 0);
  const winDays = Object.values(byDate).filter(d => d.pnl > 0).length;
  const lossDays = Object.values(byDate).filter(d => d.pnl < 0).length;

  let h = '<div class="tcal-wrap"><div class="tcal-head">';
  h += '<div class="tcal-month-label">' + monthName + ' ' + y + '<small>' + monthCount + ' trades · ' + winDays + 'W / ' + lossDays + 'L days</small></div>';
  h += '<div class="tcal-nav">';
  h += '<button class="tcal-nav-btn" onclick="tcalPrev()" title="Previous month">\u2039</button>';
  h += '<button class="tcal-nav-btn" onclick="tcalToday()" title="This month" style="width:auto;padding:0 12px;font-size:10px;font-family:var(--mono);font-weight:600">Today</button>';
  h += '<button class="tcal-nav-btn" onclick="tcalNext()" title="Next month">\u203A</button>';
  h += '</div>';

  // Month P&L badge in corner
  const badgeCls = monthTotal > 0 ? 'pos' : monthTotal < 0 ? 'neg' : 'flat';
  const sign = monthTotal > 0 ? '+' : '';
  h += '<div class="tcal-pnl-badge ' + badgeCls + '">';
  h += '<div class="tcal-pnl-num">' + sign + fmtK(Math.round(monthTotal)) + '\u20AA</div>';
  h += '<div class="tcal-pnl-sub">' + (monthTotal >= 0 ? 'profit' : 'loss') + ' this month</div>';
  h += '</div>';
  h += '</div>';

  // Day-of-week header
  h += '<div class="tcal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { h += '<div class="tcal-dow">' + d + '</div>'; });

  // Empty cells before first day
  const startOffset = new Date(y, m, 1).getDay();
  for (let i = 0; i < startOffset; i++) h += '<div class="tcal-cell inactive"></div>';

  // Days of month
  for (let day = 1; day <= maxDay; day++) {
    const dStr = y + '-' + pad2(m+1) + '-' + pad2(day);
    const isToday = dStr === todayStr;
    const dow = new Date(y, m, day).getDay();
    const isWknd = dow === 0 || dow === 6;
    const data = byDate[dStr];
    let cls = 'tcal-cell';
    if (isToday) cls += ' today';
    if (isWknd) cls += ' weekend';
    if (data) {
      cls += ' has-pnl';
      if (data.pnl > 0) cls += ' win';
      else if (data.pnl < 0) cls += ' loss';
      else cls += ' scratch';
    }
    h += '<div class="' + cls + '" onclick="openTradeModal(null,\'' + dStr + '\')">';
    h += '<div class="tcal-day-num">' + day + '</div>';
    if (data) {
      const ps = data.pnl > 0 ? '+' : '';
      h += '<div class="tcal-cell-pnl">' + ps + fmtK(Math.round(data.pnl)) + '\u20AA</div>';
      h += '<div class="tcal-trade-count">' + data.count + ' trade' + (data.count > 1 ? 's' : '') + '</div>';
    }
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

window.tcalPrev = function() {
  _tcalMonth--; if (_tcalMonth < 0) { _tcalMonth = 11; _tcalYear--; }
  renderPage('trading');
};
window.tcalNext = function() {
  _tcalMonth++; if (_tcalMonth > 11) { _tcalMonth = 0; _tcalYear++; }
  renderPage('trading');
};
window.tcalToday = function() {
  const now = new Date();
  _tcalYear = now.getFullYear(); _tcalMonth = now.getMonth();
  renderPage('trading');
};

function renderTradingOverview() {
  const allTrades = (_trades || []).slice().sort((a,b) => (a.trade_date||'').localeCompare(b.trade_date||''));
  // Always show the trading calendar, even if there are no trades
  let prefix = renderTradingCalendar();
  const wins = allTrades.filter(t => t.pnl > 0);
  const losses = allTrades.filter(t => t.pnl < 0);
  const totalPnl = allTrades.reduce((s,t) => s + (t.pnl||0), 0);
  const wr = allTrades.length>0 ? Math.round((wins.length/allTrades.length)*100) : 0;
  const pf = (losses.length>0 && wins.length>0) ? (Math.abs(wins.reduce((s,t)=>s+t.pnl,0)/losses.reduce((s,t)=>s+t.pnl,0))).toFixed(2) : '\u221E';
  const avgR = allTrades.filter(t => t.risk_amount > 0).length>0
    ? (allTrades.filter(t=>t.risk_amount>0).reduce((s,t)=>s+t.pnl/t.risk_amount,0)/allTrades.filter(t=>t.risk_amount>0).length).toFixed(2) : '\u2014';
  const maxDD = calcMaxDrawdown(allTrades);
  const tradingDays = new Set(allTrades.map(t => t.trade_date)).size;
  const avgWin = wins.length>0 ? Math.round(wins.reduce((s,t)=>s+t.pnl,0)/wins.length) : 0;
  const avgLoss = losses.length>0 ? Math.round(losses.reduce((s,t)=>s+t.pnl,0)/losses.length) : 0;
  const pnlColor = totalPnl >= 0 ? 'var(--good)' : 'var(--bad)';

  let h = prefix + '<div class="section-h"><span><span class="num">01</span>Trading Dashboard</span><div class="line"></div>' +
    '<span class="meta">' + allTrades.length + ' TRADES \u00B7 ' + tradingDays + ' DAYS</span>' +
    '<div style="display:flex;gap:6px;margin-left:auto">' +
    '<button class="ibkr-btn" onclick="importFromIBKR()">IBKR Import</button>' +
    '<button class="ap-add" onclick="openTradeModal(null,new Date().toISOString().slice(0,10))">+ Log trade</button>' +
    '<button class="ap-add" onclick="openTradeRulesSettings()">\u2699 Rules</button>' +
    '</div></div>';

  h += '<div class="tz-grid">' +
    '<div class="tz-card ' + (totalPnl>=0?'accent-good':'accent-bad') + '"><div class="tz-val" style="color:'+pnlColor+'">' + (totalPnl>=0?'+':'') + fmtK(Math.round(totalPnl)) + '\u20AA</div><div class="tz-label">All-Time P&L</div><div class="tz-sub">' + allTrades.length + ' trades</div></div>' +
    '<div class="tz-card"><div class="tz-val" style="color:'+(wr>=50?'var(--good)':'var(--bad)')+'">' + wr + '%</div><div class="tz-label">Win Rate</div><div class="tz-sub">' + wins.length + 'W \u00B7 ' + losses.length + 'L</div></div>' +
    '<div class="tz-card"><div class="tz-val">' + pf + '</div><div class="tz-label">Profit Factor</div><div class="tz-sub">' + avgR + 'R avg</div></div>' +
    '<div class="tz-card"><div class="tz-val" style="color:var(--bad)">' + (maxDD>0?'-'+fmtK(Math.round(maxDD))+'\u20AA':'\u2014') + '</div><div class="tz-label">Max Drawdown</div></div>' +
    '<div class="tz-card"><div class="tz-val" style="color:var(--good)">' + (avgWin>0?'+'+avgWin+'\u20AA':'\u2014') + '</div><div class="tz-label">Avg Winner</div></div>' +
    '<div class="tz-card"><div class="tz-val" style="color:var(--bad)">' + (avgLoss<0?avgLoss+'\u20AA':'\u2014') + '</div><div class="tz-label">Avg Loser</div></div>' +
    '<div class="tz-card"><div class="tz-val">' + tradingDays + '</div><div class="tz-label">Trading Days</div></div>' +
    '<div class="tz-card"><div class="tz-val">' + (allTrades.length>0?(wins.length>0?Math.max.apply(null,wins.map(t=>t.pnl)).toFixed(0)+'\u20AA':'\u2014'):'\u2014') + '</div><div class="tz-label">Best Trade</div></div>' +
    '</div>';

  h += renderEquityCurveBig(allTrades, 130);

  // Rules analytics
  const rulesAna = calcRulesAnalytics(allTrades, _tradeRules || []);
  if (rulesAna.length > 0 && allTrades.some(t => Array.isArray(t.rules_checked) && t.rules_checked.length > 0)) {
    h += '<div class="rules-analytics"><div class="ra-head"><div class="ra-title">Rules Analytics \u2014 What Actually Works</div><span style="font-size:9px;color:var(--text-3);font-family:var(--mono)">checked vs not checked</span></div>';
    h += '<div class="ra-row ra-header"><span>Rule</span><span style="text-align:center">N (with)</span><span style="text-align:center">Win% \u2713</span><span style="text-align:center">Win% \u2717</span><span style="text-align:center">Avg \u2713</span><span style="text-align:right">Impact</span></div>';
    rulesAna.forEach(ra => {
      const impColor = ra.impact === null ? 'var(--text-3)' : ra.impact > 10 ? 'var(--good)' : ra.impact > 0 ? 'var(--warn)' : 'var(--bad)';
      const impStr = ra.impact === null ? 'N/A' : (ra.impact > 0 ? '+' : '') + ra.impact + '%';
      h += '<div class="ra-row">' +
        '<div><div class="ra-rule">' + escapeHtml(ra.rule.rule_text||'') + '</div><span class="rule-cat ' + ra.rule.category + '" style="font-size:8px;padding:1px 5px">' + ra.rule.category + '</span></div>' +
        '<div class="ra-num">' + ra.withR.n + '</div>' +
        '<div class="ra-num" style="color:' + (ra.withR.wr>=50?'var(--good)':'var(--bad)') + ';font-weight:600">' + (ra.withR.wr!==null?ra.withR.wr+'%':'\u2014') + '</div>' +
        '<div class="ra-num" style="color:' + (ra.woR.wr!==null&&ra.woR.wr>=50?'var(--good)':'var(--text-3)') + '">' + (ra.woR.wr!==null?ra.woR.wr+'%':'\u2014') + '</div>' +
        '<div class="ra-num" style="color:' + (ra.withR.avg!==null&&ra.withR.avg>=0?'var(--good)':'var(--bad)') + '">' + (ra.withR.avg!==null?(ra.withR.avg>=0?'+':'')+ra.withR.avg+'\u20AA':'\u2014') + '</div>' +
        '<div class="ra-impact" style="color:' + impColor + '">' + impStr + '</div></div>';
    });
    h += '</div>';
  }

  // Day of week
  const dow = calcByDOW(allTrades);
  const DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  h += '<div class="section-h" style="margin-top:6px"><span>By Day of Week</span><div class="line"></div></div><div class="dow-grid">';
  dow.forEach(d => {
    const avgPnl = d.n>0 ? Math.round(d.pnl/d.n) : 0;
    const wr2 = d.n>0 ? Math.round((d.wins/d.n)*100) : 0;
    const col = d.n===0 ? 'var(--text-3)' : avgPnl>=0 ? 'var(--good)' : 'var(--bad)';
    h += '<div class="dow-card"><div class="dow-label">' + DOW_NAMES[d.day] + '</div>' +
      '<div class="dow-val" style="color:' + col + '">' + (d.n>0?(avgPnl>=0?'+':'')+fmtK(avgPnl)+'\u20AA':'\u2014') + '</div>' +
      '<div class="dow-n">' + (d.n>0?d.n+' \u00B7 '+wr2+'%wr':'no trades') + '</div></div>';
  });
  h += '</div>';

  // Setup breakdown
  const setups = calcBySetup(allTrades).slice(0,6);
  const maxSetupPnl = Math.max(1, ...setups.map(s => Math.abs(s.pnl)));
  if (setups.length > 0 && setups.some(s => s.name !== 'Untagged')) {
    h += '<div class="section-h" style="margin-top:6px"><span>By Setup</span><div class="line"></div></div><div class="setup-list">';
    setups.forEach(s => {
      const barW = Math.round((Math.abs(s.pnl)/maxSetupPnl)*100);
      const col = s.pnl >= 0 ? 'var(--good)' : 'var(--bad)';
      h += '<div class="setup-row">' +
        '<div class="setup-name">' + escapeHtml(s.name) + '</div>' +
        '<div class="setup-bar-wrap"><div class="setup-bar-fill" style="width:'+barW+'%;background:'+col+'"></div></div>' +
        '<div class="setup-stats">' +
        '<span>' + s.n + ' trades</span>' +
        '<span style="color:'+(s.wr>=50?'var(--good)':'var(--bad)')+'">' + s.wr + '% win</span>' +
        '<span style="color:'+col+'">' + (s.avg>=0?'+':'') + s.avg + '\u20AA avg</span>' +
        '</div></div>';
    });
    h += '</div>';
  }

  // Trade log
  const recent = allTrades.slice().reverse().slice(0,30);
  h += '<div class="trade-log"><div class="trade-log-head"><div class="trade-log-title">Recent Trades</div></div>';
  if (!recent.length) {
    h += '<div style="text-align:center;padding:30px;color:var(--text-3);font-size:12px;font-family:var(--mono)">No trades logged \u2014 click + Log trade or IBKR Import</div>';
  } else {
    h += '<table class="trade-table"><tr><th>Date</th><th>Instr.</th><th>Dir</th><th>Grade</th><th>Setup</th><th>P&L</th><th>R</th><th>Rules</th></tr>';
    const INSTR_COLORS = {NQ:'var(--cyan)',ES:'var(--tech)',MNQ:'var(--cap)',MES:'var(--good)',YM:'var(--warn)',OTHER:'var(--text-2)'};
    recent.forEach(t => {
      const r2 = (t.risk_amount && t.risk_amount > 0) ? (t.pnl/t.risk_amount).toFixed(1) : '\u2014';
      const gradeColor = ({'A+':'var(--good)','A':'var(--good)','B':'var(--cyan)','C':'var(--warn)','scratch':'var(--text-3)','':'var(--text-3)'})[t.trade_grade||''];
      const checked = (Array.isArray(t.rules_checked) ? t.rules_checked.length : 0);
      const total = (_tradeRules || []).filter(r => r.is_active).length;
      const rulesScore = total>0 ? checked+'/'+total : (checked>0 ? String(checked) : '\u2014');
      const rulesPct = total>0 ? Math.round((checked/total)*100) : 0;
      h += '<tr onclick="openTradeModal(\''+(t.id||'')+'\',\''+(t.trade_date||'')+'\')">' +
        '<td>' + ((t.trade_date||'').slice(8) || '?') + '</td>' +
        '<td style="color:'+(INSTR_COLORS[t.instrument]||'var(--text-2)')+'">\u25CF ' + (t.instrument||'') + '</td>' +
        '<td class="trade-dir-' + (t.direction||'long') + '">' + (t.direction==='long'?'\u25B2':'\u25BC') + ' ' + (t.direction||'') + '</td>' +
        '<td style="color:'+gradeColor+';font-weight:700">' + (t.trade_grade||'\u2014') + '</td>' +
        '<td style="font-size:10.5px;color:var(--text-3)">' + escapeHtml(t.setup_type||'\u2014') + '</td>' +
        '<td class="trade-pnl ' + ((t.pnl||0)>=0?'pos':'neg') + '">' + ((t.pnl||0)>=0?'+':'') + fmt(t.pnl||0) + '\u20AA</td>' +
        '<td style="color:'+(parseFloat(r2)>0?'var(--good)':parseFloat(r2)<0?'var(--bad)':'var(--text-3)')+'">' + (r2!=='\u2014'?r2+'R':r2) + '</td>' +
        '<td style="color:'+(rulesPct>=80?'var(--good)':rulesPct>=50?'var(--warn)':'var(--bad)')+';font-family:var(--mono);font-size:10.5px">' + rulesScore + '</td>' +
        '</tr>';
    });
    h += '</table>';
  }
  h += '</div>';
  return h;
}

function buildAgentSystemPrompt() {

  return 'You are Richard\'s embedded AI inside his personal Cockpit RTHQ dashboard.\n\n' +
    'ABOUT RICHARD:\n' +
    '- Solo founder of AutoScale (Israeli digital marketing automation agency)\n' +
    '- Active futures trader on Apex funded accounts\n' +
    '- Building toward relocating to Koh Samui, Thailand when savings >= 30,000 ILS AND MRR >= 6,000 ILS\n' +
    '- Visual thinker, prefers short, direct answers\n\n' +

    '- Trading P&L (this month): ' + (F.tradePnl>=0?'+':'') + fmtK(Math.round(F.tradePnl)) + ' ILS\n' +
    '- Savings: ' + fmtK(E.currentSav) + ' / 30,000 ILS (' + E.savPct + '%)\n' +

    'INSTRUCTIONS: Be direct, concise, data-driven. Reference actual numbers. Tell him what he needs to hear, not what he wants. Keep replies short.';

function toggleAgent() {
  const panel = document.getElementById('agent-panel');
  agentOpen = !agentOpen;
  panel.style.transform = agentOpen ? 'translateX(0)' : 'translateX(100%)';
  if (agentOpen) setTimeout(() => document.getElementById('agent-input').focus(), 350);
}

async function sendToAgent() {
  if (agentBusy) return;
  const input = document.getElementById('agent-input');
  const msg = input && input.value && input.value.trim();
  if (!msg) return;

  let apiKey = safe.get('cockpit.agent.key');
  if (!apiKey) {
    appendAgentMsg('claude', 'Need an Anthropic API key first. Open Settings \u2192 API Keys.');
    return;
  }

  input.value = '';
  appendAgentMsg('user', msg);
  agentHistory.push({ role: 'user', content: msg });

  agentBusy = true;
  document.getElementById('agent-send').disabled = true;
  const thinkId = appendAgentMsg('claude', '...', true);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1024,
        system: buildAgentSystemPrompt(),
        messages: agentHistory
      })
    });
    if (res.status === 401) { safe.del('cockpit.agent.key'); throw new Error('Invalid API key (cleared). Re-enter in Settings → API Keys.'); }
    if (res.status === 403) throw new Error('API key forbidden. Check Anthropic console.');
    if (res.status === 429) throw new Error('Rate limit hit. Wait 60 seconds.');
    if (!res.ok) {
      let detail = '';
      try { const err = await res.json(); detail = err.error && err.error.message ? ' — '+err.error.message : ''; } catch(e){}
      throw new Error('API error ' + res.status + detail);
    }
    const data = await res.json();
    const reply = (data.content && data.content[0] && data.content[0].text) || '(No response)';
    removeAgentMsg(thinkId);
    appendAgentMsg('claude', reply);
    agentHistory.push({ role: 'assistant', content: reply });
    if (agentHistory.length > 20) agentHistory = agentHistory.slice(-20);
  } catch(e) {
    removeAgentMsg(thinkId);
    appendAgentMsg('claude', '\u26A0\uFE0F ' + e.message);
  } finally {
    agentBusy = false;
    document.getElementById('agent-send').disabled = false;
  }
}

function appendAgentMsg(role, text, isThinking) {
  const msgs = document.getElementById('agent-msgs');
  if (!msgs) return null;
  const id = 'amsg-' + Date.now() + Math.random();
  const div = document.createElement('div');
  div.id = id;
  const isUser = role === 'user';
  const bg = isUser ? 'var(--cyan)' : 'var(--bg-elev)';
  const color = isUser ? '#060912' : 'var(--text-1)';
  const align = isUser ? 'flex-end' : 'flex-start';
  div.style.cssText = 'max-width:90%;align-self:'+align;
  div.innerHTML = '<div style="padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55;background:'+bg+';color:'+color+';white-space:pre-wrap'+(isThinking?';opacity:0.5':'')+'">'+escapeHtml(text)+'</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}
function removeAgentMsg(id) { const el = id && document.getElementById(id); if (el) el.remove(); }

window.editConstructionJob = async function(id) {
  const job = id ? (_constructionJobs || []).find(j => j.id === id) : null;
  const r = await openModal({
    title: id ? 'Edit Job' : 'Add Job', icon:'\u{1F3D7}\uFE0F',
    saveLabel: id ? 'Update' : 'Add', deleteLabel: id ? 'Delete' : null,
    fields: [
      {id:'name',   label:'Job Name',          value: job ? job.name : ''},
      {id:'client', label:'Client',            value: job ? job.client : ''},
      {id:'status', label:'Status', type:'select', options:['bid','active','done','cancelled'], value: job ? job.status : 'bid'},
      {id:'value',  label:'Job Value (\u20AA)', type:'number', value: job ? job.value : ''},
      {id:'cost',   label:'Costs to Date (\u20AA)', type:'number', value: job ? job.cost : ''},
      {id:'notes',  label:'Notes', type:'textarea', value: job ? (job.notes || '') : ''}
    ]
  });
  if (r.action === 'cancel') return;
  if (!_constructionJobs) _constructionJobs = [];
  if (r.action === 'delete' && id) {
    _constructionJobs = _constructionJobs.filter(j => j.id !== id);
    sbDelete('cockpit_construction_jobs', 'id=eq.' + id);
    return renderPage('construction');
  }
  const v = r.values;
  const row = { name: v.name, client: v.client, status: v.status, value: +v.value || 0, cost: +v.cost || 0, notes: v.notes };
  if (id) {
    _constructionJobs = _constructionJobs.map(j => j.id === id ? Object.assign({}, j, row, {id}) : j);
    sbPatch('cockpit_construction_jobs', 'id=eq.' + id, row);
  } else {
    const tmpId = 'tmp-' + Date.now();
    _constructionJobs.push(Object.assign({}, row, {id: tmpId}));
    sbUpsertReturning('cockpit_construction_jobs', row).then(saved => {
      if (saved && saved[0] && saved[0].id) {
        const idx = _constructionJobs.findIndex(j => j.id === tmpId);
        if (idx >= 0) _constructionJobs[idx].id = saved[0].id;
      }
    }).catch(e => console.warn('Job save failed (kept locally):', e.message));
  }
  renderPage('construction');
};

window.editClient = async function(id, pageKey) {
  const client = id ? (_clients || []).find(c => c.id === id) : null;
  const r = await openModal({
    title: id ? 'Edit Client' : 'Add Client', icon:'\u{1F465}',
    saveLabel: id ? 'Update' : 'Add', deleteLabel: id ? 'Delete' : null,
    fields: [
      {id:'name',   label:'Client Name',           value: client ? client.name : ''},
      {id:'status', label:'Status', type:'select', options:['active','pause','onboarding','past'], value: client ? client.status : 'active'},
      {id:'mrr',    label:'Monthly Fee (\u20AA)', type:'number', value: client ? client.mrr : ''},
      {id:'since',  label:'Client Since (e.g. Jan 2025)', value: client ? client.since : ''},
      {id:'notes',  label:'Notes', type:'textarea', value: client ? (client.notes || '') : ''}
    ]
  });
  if (r.action === 'cancel') return;
  if (!_clients) _clients = [];
  if (r.action === 'delete' && id) {
    _clients = _clients.filter(c => c.id !== id);
    sbDelete('cockpit_clients', 'id=eq.' + id);
    return renderPage(pageKey);
  }
  const v = r.values;
  const row = { name: v.name, status: v.status, mrr: +v.mrr || 0, since: v.since, notes: v.notes, product: pageKey };
  if (id) {
    _clients = _clients.map(c => c.id === id ? Object.assign({}, c, row, {id}) : c);
    sbPatch('cockpit_clients', 'id=eq.' + id, row);
  } else {
    const tmpId = 'tmp-' + Date.now();
    _clients.push(Object.assign({}, row, {id: tmpId}));
    sbUpsertReturning('cockpit_clients', row).then(saved => {
      if (saved && saved[0] && saved[0].id) {
        const idx = _clients.findIndex(c => c.id === tmpId);
        if (idx >= 0) _clients[idx].id = saved[0].id;
      }
    }).catch(e => console.warn('Client save failed (kept locally):', e.message));
  }
  renderPage(pageKey);
};

function switchPane(pane, btn) {
  document.querySelectorAll('.side-tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-pane').forEach(el => el.classList.remove('open'));
  if (btn) btn.classList.add('active');
  else {
    const target = document.querySelector('.side-tab[data-pane="'+pane+'"]');
    if (target) target.classList.add('active');
  }
  const p = document.getElementById('pane-'+pane);
  if (p) p.classList.add('open');
  safe.set('cockpit.pane', pane);

function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const workPages = ['autoscale','wa-saas','rsvp','crm-saas','construction','trading','holdings','angel','real-estate','finance'];
  const lifePages = ['life-overview','health','skills','bike-build','relocation','big-calendar'];

    if (s === 'attention')        html += renderAttention(page.data.attention, key);

    else if (s === 'sources')     html += renderSources(page.data.sources, key, pm.y, pm.m);

function wireEditables() {
  mainEl.querySelectorAll('.editable').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (el.classList.contains('editing')) return;
      startEdit(el);
    });
  });
}
function startEdit(el) {
  const key = el.dataset.editKey;
  const orig = el.dataset.editNum;
  const cur = el.querySelector('.cur');
  const curHtml = cur ? cur.outerHTML : '';
  el.classList.add('editing');
  el.innerHTML = '<input type="text" value="'+orig+'" style="width:'+Math.max(el.offsetWidth-24,50)+'px;background:transparent;border:none;outline:none;color:var(--cyan);font:inherit;font-weight:inherit;letter-spacing:inherit">'+curHtml;
  const inp = el.querySelector('input');
  inp.focus(); inp.select();
  const commit = () => {
    const raw = inp.value.replace(/,/g,'').replace(/\s/g,'').trim();
    setEdited(key, raw === '' ? '0' : raw);
    el.classList.remove('editing');
    renderPage(safe.get('cockpit.page') || 'autoscale');
  };
  const cancel = () => { el.classList.remove('editing'); el.innerHTML = fmt(orig) + curHtml; };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter')  { ev.preventDefault(); inp.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
  });
}

window.importFromIBKR = function() {
  document.getElementById('ibkr-file-input').click();
};

window.handleIBKRFile = function(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    const csv = e.target.result;
    const imported = parseIBKRcsv(csv);
    if (!imported.length) { alert('No trades found. Make sure it is an IBKR Activity Statement CSV (Trades section).'); return; }
    if (!confirm('Found ' + imported.length + ' trades. Import all? (duplicates will be skipped)')) return;
    let added = 0;
    for (const t of imported) {
      const exists = _trades.find(x => x.trade_date === t.trade_date && Math.abs((x.pnl||0) - (t.pnl||0)) < 0.01 && x.instrument === t.instrument);
      if (exists) continue;
      _trades.push(Object.assign({}, t, { id: 'tmp-'+Date.now()+Math.random() }));
      await sbUpsert('cockpit_trades', t);
      const dd = new Date(t.trade_date);
      const dayTrades = _trades.filter(x => x.trade_date === t.trade_date);
      const dayPnl = dayTrades.reduce((s,x) => s + (x.pnl||0), 0);
      safe.set('cockpit.trade.' + dd.getFullYear() + '.' + dd.getMonth() + '.' + dd.getDate(), dayPnl);
      sbUpsert('cockpit_trade_days', { trade_date: t.trade_date, pnl: dayPnl });
      added++;
    }
    alert('Imported ' + added + ' new trades (' + (imported.length - added) + ' duplicates skipped).');
    renderPage(safe.get('cockpit.page') || 'trading');
  };
  reader.readAsText(file);
  event.target.value = '';
};

function parseIBKRcsv(csv) {
  const lines = csv.split('\n');
  const trades = [];
  const INSTR_KEYS = ['NQ','ES','MNQ','MES','YM','RTY','CL','GC'];
  for (const line of lines) {
    const cols = line.split(',').map(c => {
      const s = c.trim();
      return (s.startsWith('"') && s.endsWith('"')) ? s.slice(1,-1) : s;
    });
    // IBKR Flex Activity: Trades,Data,Order,Futures,USD,NQ ...
    if (cols[0] === 'Trades' && cols[1] === 'Data' && cols[2] === 'Order' && cols[3] === 'Futures') {
      const symbol = cols[5] || '';
      const dateTime = cols[6] || '';
      const qty = parseFloat(cols[7]) || 0;
      const price = parseFloat(cols[8]) || 0;
      const pnl = parseFloat(cols[13]) || 0;
      let instrument = 'OTHER';
      for (const k of INSTR_KEYS) { if (symbol.indexOf(k) === 0) { instrument = k; break; } }
      const dPart = (dateTime.split(',')[0] || '').trim();
      const tradeDate = (dPart.length >= 10 && dPart[4] === '-' && dPart[7] === '-') ? dPart.slice(0,10) : null;
      if (!tradeDate) continue;
      trades.push({
        trade_date: tradeDate, instrument: instrument,
        direction: qty > 0 ? 'long' : 'short',
        entry_price: price, exit_price: null,
        size: Math.abs(qty),
        pnl: Math.round(pnl * 3.7), // USD->ILS approx
        risk_amount: null, setup_type: 'IBKR Import',
        notes: 'Imported from IBKR \u00B7 Symbol: ' + symbol,
        rules_checked: [], trade_grade: '', mistakes: ''
      });
    }
    // Simple CSV: date,symbol,direction,qty,entry,exit,pnl
    else if (cols.length >= 7 && cols[0].length === 10 && cols[0][4] === '-' && cols[0][7] === '-') {
      let instrument = 'OTHER';
      for (const k of INSTR_KEYS) { if ((cols[1]||'').indexOf(k) === 0) { instrument = k; break; } }
      trades.push({
        trade_date: cols[0], instrument: instrument,
        direction: (cols[2]||'').toLowerCase().indexOf('short') >= 0 ? 'short' : 'long',
        size: Math.abs(parseFloat(cols[3]) || 1),
        entry_price: parseFloat(cols[4]) || null,
        exit_price: parseFloat(cols[5]) || null,
        pnl: parseFloat(cols[6]) || 0,
        risk_amount: null, setup_type: 'CSV Import',
        notes: '', rules_checked: [], trade_grade: '', mistakes: ''
      });
    }
  }
  return trades;
}

let _dragSrc = null;
function initNavDrag() {
  document.querySelectorAll('#pane-work .nav-item[draggable=true]').forEach(el => {
    el.addEventListener('dragstart', e => {
      _dragSrc = el;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.page);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.nav-item.drag-over').forEach(x => x.classList.remove('drag-over'));
      _dragSrc = null;
      saveNavOrder();
    });
    el.addEventListener('dragover', e => { e.preventDefault(); if (_dragSrc && _dragSrc !== el) el.classList.add('drag-over'); return false; });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.stopPropagation();
      if (!_dragSrc || _dragSrc === el) return;
      el.classList.remove('drag-over');
      el.parentNode.insertBefore(_dragSrc, el);
      return false;
    });
  });
}
function saveNavOrder() {
  const order = [];
  document.querySelectorAll('#pane-work .nav-item[draggable=true]').forEach(el => order.push(el.dataset.page));
  safe.set('nav.work.order', JSON.stringify(order));
}
function restoreNavOrder() {
  const saved = safe.get('nav.work.order');
  if (!saved) return;
  try {
    const order = JSON.parse(saved);
    const pane = document.getElementById('pane-work');
    if (!pane) return;
    order.forEach(pageKey => {
      const el = pane.querySelector('.nav-item[data-page="'+pageKey+'"]');
      if (el) pane.appendChild(el);
    });
  } catch(e) {}
}

    cats[cat].forEach(r => {
      const checked = _tmChecked.indexOf(r.id) >= 0;
      rulesHtml += '<label class="rule-check"><input type="checkbox"'+(checked?' checked':'')+' onchange="toggleRule(\''+r.id+'\',this.checked)"><span class="rule-check-text">'+escapeHtml(r.rule_text||'')+'</span></label>';
    });
    rulesHtml += '</div></div>';
  });
  if (!rules.length) rulesHtml = '<div style="font-size:11px;color:var(--text-3);font-family:var(--mono);padding:8px 0">No rules defined. Click \u2699 Rules in Trading page header.</div>';
  const rulesScore = rules.length>0 ? _tmChecked.length+'/'+rules.length+' ('+Math.round((_tmChecked.length/rules.length)*100)+'%)' : '\u2014';

  const tvLink = TV_SYMBOLS[v.instrument || 'NQ'];
  const tvBtn = tvLink ? '<a class="tv-btn" href="https://www.tradingview.com/chart/?symbol='+encodeURIComponent(tvLink)+'&interval=15" target="_blank" rel="noopener">\u{1F4C8} TradingView</a>' : '';

  box.innerHTML =
    '<div class="modal-title"><span class="mi">\u25B2</span>'+(isEdit?'Edit Trade':'New Trade')+'<div style="margin-left:auto">'+tvBtn+'</div></div>' +
    '<div class="tm-row cols2">' +
      '<div class="tm-field"><label class="tm-label">Date</label><input class="tm-input" id="tm-date" type="date" value="'+(v.trade_date || _tmCurrentDate)+'"></div>' +
      '<div class="tm-field"><label class="tm-label">Instrument</label><select class="tm-input tm-select" id="tm-instrument" onchange="updateTVLink(this.value)">'+instrOpts+'</select></div>' +
    '</div>' +
    '<div class="tm-row cols3">' +
      '<div class="tm-field"><label class="tm-label">Direction</label><select class="tm-input tm-select" id="tm-direction">'+dirOpts+'</select></div>' +
      '<div class="tm-field"><label class="tm-label">Contracts</label><input class="tm-input" id="tm-size" type="number" min="0" step="1" value="'+(v.size||1)+'"></div>' +
      '<div class="tm-field"><label class="tm-label">Setup</label><input class="tm-input" id="tm-setup" placeholder="ICT FVG, OB, etc" value="'+escapeHtml(v.setup_type||'')+'"></div>' +
    '</div>' +
    '<div class="tm-row cols3">' +
      '<div class="tm-field"><label class="tm-label">Entry</label><input class="tm-input" id="tm-entry" type="number" step="0.01" value="'+(v.entry_price||'')+'"></div>' +
      '<div class="tm-field"><label class="tm-label">Exit</label><input class="tm-input" id="tm-exit" type="number" step="0.01" value="'+(v.exit_price||'')+'"></div>' +
      '<div class="tm-field"><label class="tm-label">P&L (\u20AA)</label><input class="tm-input" id="tm-pnl" type="number" step="0.01" value="'+(v.pnl||'')+'"></div>' +
    '</div>' +
    '<div class="tm-row cols2">' +
      '<div class="tm-field"><label class="tm-label">Risk Amount (\u20AA)</label><input class="tm-input" id="tm-risk" type="number" step="0.01" value="'+(v.risk_amount||'')+'" placeholder="for R calc"></div>' +
      '<div class="tm-field"><label class="tm-label">Screenshot URL</label><input class="tm-input" id="tm-screenshot" type="url" value="'+escapeHtml(v.screenshot_url||'')+'" placeholder="paste imgur/etc"></div>' +
    '</div>' +
    '<div class="tm-section-title">Grade & Mistakes</div>' +
    '<div class="tm-row" style="margin-bottom:10px"><label class="tm-label" style="margin-bottom:6px">Trade Grade</label><div class="grade-pills">'+gradePills+'</div></div>' +
    '<div class="tm-row"><div class="tm-field"><label class="tm-label">Mistakes / Lessons</label><textarea class="tm-textarea" id="tm-mistakes" placeholder="What went wrong? What would you do differently?">'+escapeHtml(v.mistakes||'')+'</textarea></div></div>' +
    '<div class="tm-row"><div class="tm-field"><label class="tm-label">Notes</label><textarea class="tm-textarea" id="tm-notes" placeholder="Context, market conditions, what worked...">'+escapeHtml(v.notes||'')+'</textarea></div></div>' +
    '<div class="tm-section-title">Rules Followed <span style="margin-left:auto;color:var(--cyan);font-weight:700;font-size:11px">'+rulesScore+'</span></div>' +
    '<div id="tm-rules">'+rulesHtml+'</div>' +
    '<div style="display:flex;gap:8px;margin-top:20px">' +
      (isEdit ? '<button class="tm-btn del" onclick="deleteTrade()">Delete</button>' : '') +
      '<button class="tm-btn cancel" onclick="closeTradeModal()" style="flex:0.5">Cancel</button>' +
      '<button class="tm-btn save" onclick="saveTradeModal()">'+(isEdit?'Update Trade':'Save Trade')+'</button>' +
    '</div>';
}

window.selectGrade = function(g) {
  _tmGrade = (_tmGrade === g ? '' : g);
  // refresh just the pills
  const pills = document.querySelector('.grade-pills');
  if (pills) {
    const grades = ['A+','A','B','C','scratch'];
    pills.innerHTML = grades.map(gg => {
      const cls = 'sel-' + (gg === 'A+' ? 'Ap' : gg);
      return '<button class="grade-pill'+(_tmGrade===gg?' '+cls:'')+'" onclick="selectGrade(\''+gg+'\')">'+gg+'</button>';
    }).join('');
  }
};

window.toggleRule = function(ruleId, checked) {
  if (checked) {
    if (_tmChecked.indexOf(ruleId) < 0) _tmChecked.push(ruleId);
  } else {
    _tmChecked = _tmChecked.filter(x => x !== ruleId);
  }
  // update score
  const rules = (_tradeRules || []).filter(r => r.is_active);
  const score = rules.length>0 ? _tmChecked.length+'/'+rules.length+' ('+Math.round((_tmChecked.length/rules.length)*100)+'%)' : '\u2014';
  const titles = document.querySelectorAll('.tm-section-title');
  if (titles.length >= 2) {
    const span = titles[1].querySelector('span');
    if (span) span.textContent = score;
  }
};

window.updateTVLink = function(instrument) {
  const sym = TV_SYMBOLS[instrument];
  const btn = document.querySelector('.tv-btn');
  if (btn && sym) btn.href = 'https://www.tradingview.com/chart/?symbol='+encodeURIComponent(sym)+'&interval=15';
};

window.saveTradeModal = async function() {
  const $ = id => document.getElementById(id);
  const row = {
    trade_date: $('tm-date').value,
    instrument: $('tm-instrument').value,
    direction:  $('tm-direction').value,
    size:       parseFloat($('tm-size').value) || 1,
    entry_price: parseFloat($('tm-entry').value) || null,
    exit_price:  parseFloat($('tm-exit').value)  || null,
    pnl:         parseFloat($('tm-pnl').value)   || 0,
    risk_amount: parseFloat($('tm-risk').value)  || null,
    setup_type:  $('tm-setup').value,
    screenshot_url: $('tm-screenshot').value,
    notes:       $('tm-notes').value,
    mistakes:    $('tm-mistakes').value,
    trade_grade: _tmGrade,
    rules_checked: _tmChecked
  };
  if (!row.trade_date) { alert('Date required'); return; }
  if (_tmCurrentId) {
    _trades = _trades.map(x => x.id === _tmCurrentId ? Object.assign({}, x, row, {id: _tmCurrentId}) : x);
    await sbPatch('cockpit_trades', 'id=eq.'+_tmCurrentId, row);
  } else {
    _trades.push(Object.assign({}, row, {id: 'tmp-'+Date.now()}));
    await sbUpsert('cockpit_trades', row);
  }
  // Update day aggregate
  const dd = new Date(row.trade_date+'T12:00:00');
  const dayTrades = _trades.filter(t => t.trade_date === row.trade_date);
  const dayPnl = dayTrades.reduce((s,t) => s + (t.pnl||0), 0);
  safe.set('cockpit.trade.' + dd.getFullYear() + '.' + dd.getMonth() + '.' + dd.getDate(), dayPnl);
  await sbUpsert('cockpit_trade_days', { trade_date: row.trade_date, pnl: dayPnl });
  closeTradeModal();
  renderPage(safe.get('cockpit.page') || 'trading');
};

window.deleteTrade = async function() {
  if (!_tmCurrentId) return;
  if (!confirm('Delete this trade?')) return;
  const t = _trades.find(x => x.id === _tmCurrentId);
  _trades = _trades.filter(x => x.id !== _tmCurrentId);
  await sbDelete('cockpit_trades', 'id=eq.'+_tmCurrentId);
  if (t && t.trade_date) {
    const dd = new Date(t.trade_date+'T12:00:00');
    const dayTrades = _trades.filter(x => x.trade_date === t.trade_date);
    const dayPnl = dayTrades.reduce((s,x) => s + (x.pnl||0), 0);
    safe.set('cockpit.trade.' + dd.getFullYear() + '.' + dd.getMonth() + '.' + dd.getDate(), dayPnl);
    await sbUpsert('cockpit_trade_days', { trade_date: t.trade_date, pnl: dayPnl });
  }
  closeTradeModal();
  renderPage(safe.get('cockpit.page') || 'trading');
};

// ── Trade Rules Settings ──
window.openTradeRulesSettings = async function() {
  const rules = (_tradeRules || []).slice().sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
  const cats = ['entry','risk','mindset','exit'];
  const r = await openModal({
    title: 'Trade Rules', icon:'\u2699',
    saveLabel: 'Add Rule', deleteLabel: null,
    fields: [
      {id:'rule', label:'Rule (e.g. "Wait for confirmation")', placeholder:'Wait for FVG fill before entry'},
      {id:'cat',  label:'Category', type:'select', options: cats, value: 'entry'}
    ]
  });
  if (r.action !== 'save' || !r.values.rule) {
    // re-show list if user just wanted to manage
    if (r.action === 'cancel' && rules.length > 0) showRulesList();
    return;
  }
  const row = { rule_text: r.values.rule, category: r.values.cat || 'entry', is_active: true, sort_order: rules.length + 1 };
  _tradeRules.push(Object.assign({}, row, {id: 'tmp-'+Date.now()}));
  await sbUpsert('cockpit_trade_rules', row);
  _tradeRules = await sbGet('cockpit_trade_rules', '?order=sort_order');
  showRulesList();
};

function showRulesList() {
  const rules = (_tradeRules || []).slice().sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
  if (!rules.length) return;
  let body = '<div style="font-size:11px;color:var(--text-3);margin-bottom:12px">Click \u2715 to delete a rule. Add new rules from the trading page.</div>';
  rules.forEach(r => {
    body += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--stroke-1)">' +
      '<span class="rule-cat '+r.category+'">'+r.category+'</span>' +
      '<span style="flex:1;font-size:12px;color:var(--text-1)">'+escapeHtml(r.rule_text||'')+'</span>' +
      '<button onclick="deleteTradeRule(\''+r.id+'\')" style="background:transparent;border:none;color:var(--bad);cursor:pointer;font-size:14px;padding:4px 8px">\u2715</button>' +
      '</div>';
  });
  // Show via simple alert-style modal
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal-box" onclick="event.stopPropagation()">' +
    '<div class="modal-title"><span class="mi">\u2699</span>Manage Rules</div>' +
    '<div style="max-height:50vh;overflow-y:auto">'+body+'</div>' +
    '<div class="modal-actions"><button class="modal-btn primary" onclick="this.closest(\'.modal-overlay\').remove()">Done</button></div>' +
    '</div>';
  ov.addEventListener('click', () => ov.remove());
  document.body.appendChild(ov);
}

window.deleteTradeRule = async function(id) {
  if (!confirm('Delete this rule?')) return;
  _tradeRules = _tradeRules.filter(x => x.id !== id);
  await sbDelete('cockpit_trade_rules', 'id=eq.'+id);
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
  showRulesList();
};

// ══════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════
async function bootApp() {
  // Handle GCal OAuth redirect FIRST (before anything else)
  GCAL.handleRedirect();

  // Render saved page from cache
  const savedPane = safe.get('cockpit.pane') || 'work';
  const savedPage = safe.get('cockpit.page') || 'cockpit-overview';
  switchPane(savedPane);
  navigate(savedPage);

  // Restore drag-drop nav order, then enable dragging
  restoreNavOrder();
  initNavDrag();

  // Hidden file input for IBKR CSV
  if (!document.getElementById('ibkr-file-input')) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.csv,text/csv';
    inp.id = 'ibkr-file-input'; inp.style.display = 'none';
    inp.onchange = window.handleIBKRFile;
    document.body.appendChild(inp);
  }

  // Hydrate from Supabase
  await loadAllData();
  navigate(safe.get('cockpit.page') || savedPage);

  // Start GCal auto-sync (every 5 min)
  setInterval(() => { if (GCAL.isValid()) GCAL.pullChanges(); }, 5 * 60 * 1000);
  if (GCAL.isValid()) GCAL.pullChanges();

  // Live rates: fetch now + every 5 min
  refreshLiveRates();
  setInterval(refreshLiveRates, 5 * 60 * 1000);

  // Daily Claude insight (cached per day)
  setTimeout(fetchDailyInsight, 1500);

  // Clock
  tick();
  setInterval(tick, 30000);
}

// Start: auth first, then boot
AUTH.init().then(bootApp);

window.toggleSidebar = function(ev) {
  if (ev) ev.stopPropagation();
  const app = document.querySelector('.app');
  if (!app) return;
  app.classList.toggle('sidebar-collapsed');
  safe.set('cockpit.sidebar.collapsed', app.classList.contains('sidebar-collapsed') ? '1' : '0');
  // Update arrow direction
  const btn = app.querySelector('.side-collapse-btn');
  if (btn) btn.textContent = app.classList.contains('sidebar-collapsed') ? '›' : '‹';
};

// Restore collapsed state on load
(function() {
  const restore = () => {
    if (safe.get('cockpit.sidebar.collapsed') === '1') {
      const app = document.querySelector('.app');
      if (app) {
        app.classList.add('sidebar-collapsed');
        const btn = app.querySelector('.side-collapse-btn');
        if (btn) btn.textContent = '›';
      }
    }
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', restore);
  } else {
    setTimeout(restore, 0);
  }
})();
